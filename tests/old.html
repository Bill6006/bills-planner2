            title: "Delete income?",
            message: `Delete "${(it && it.name) ? it.name : "this income"}"?`,
            okText: "Delete",
            danger: true,
            onConfirm: ()=>{
              state.settings.otherIncomes = (Array.isArray(state.settings.otherIncomes) ? state.settings.otherIncomes : []).filter(x=>x.id !== id);
              render();
            }
          });
          return;
        }
      });

      freqEl.addEventListener("change", ()=>{
        payObj.frequency = freqEl.value;
        render();
      });
      capEl.addEventListener("input", ()=>{
        payObj.paycheckCap = Number(capEl.value || 0);
        // Don't re-render while typing on mobile (keeps the keyboard open)
        saveState();
      });
      capEl.addEventListener("change", ()=>{
        payObj.paycheckCap = Number(capEl.value || 0);
        render();
      });
      anchorEl.addEventListener("change", ()=>{
        payObj.anchorNextPayday = anchorEl.value;
        render();
      });
      semi1El.addEventListener("input", ()=>{
        payObj.semimonthlyDom1 = clampInt(semi1El.value, 1, 31);
        saveState();
      });
      semi1El.addEventListener("change", ()=>{
        payObj.semimonthlyDom1 = clampInt(semi1El.value, 1, 31);
        render();
      });
      semi2El.addEventListener("input", ()=>{
        payObj.semimonthlyDom2 = clampInt(semi2El.value, 1, 31);
        saveState();
      });
      semi2El.addEventListener("change", ()=>{
        payObj.semimonthlyDom2 = clampInt(semi2El.value, 1, 31);
        render();
      });
      monthlyDomEl.addEventListener("input", ()=>{
        payObj.monthlyDom = clampInt(monthlyDomEl.value, 1, 31);
        saveState();
      });
      monthlyDomEl.addEventListener("change", ()=>{
        payObj.monthlyDom = clampInt(monthlyDomEl.value, 1, 31);
        render();
      });
      customEl.addEventListener("change", ()=>{
        const raw = customEl.value.split(",").map(s=>s.trim()).filter(Boolean);
        const cleaned = raw.filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s));
        payObj.customDates = cleaned;
        render();
      });

      // ===== Transfer split wiring (Pay2 + Additional income only) =====
      function clampPctLive(v){
        v = Number(v);
        if(!Number.isFinite(v)) return 0;
        v = Math.round(v);
        if(v < 0) v = 0;
        if(v > 100) v = 100;
        return v;
      }
      function enforceSplitSums(changed){
        const sp = ensureTransferSplit(state.settings);
        // Bills sum
        if(sp.pay2BillsPct + sp.otherBillsPct > 100){
          if(changed === "pay2Bills"){
            sp.pay2BillsPct = Math.max(0, 100 - sp.otherBillsPct);
          }else{
            sp.otherBillsPct = Math.max(0, 100 - sp.pay2BillsPct);
          }
        }
        // Savings sum
        if(sp.pay2SavingsPct + sp.otherSavingsPct > 100){
          if(changed === "pay2Sav"){
            sp.pay2SavingsPct = Math.max(0, 100 - sp.otherSavingsPct);
          }else{
            sp.otherSavingsPct = Math.max(0, 100 - sp.pay2SavingsPct);
          }
        }
      }

      const sp = ensureTransferSplit(state.settings);

      const splitPay2BillsEl = controls.querySelector("#splitPay2Bills");
      const splitPay2SavEl   = controls.querySelector("#splitPay2Sav");
      if(splitPay2BillsEl && splitPay2SavEl){
        splitPay2BillsEl.value = String(sp.pay2BillsPct || 0);
        splitPay2SavEl.value   = String(sp.pay2SavingsPct || 0);

        splitPay2BillsEl.addEventListener("input", ()=>{
          sp.pay2BillsPct = clampPctLive(splitPay2BillsEl.value);
          enforceSplitSums("pay2Bills");
          splitPay2BillsEl.value = String(sp.pay2BillsPct);
          saveState();
        });
        splitPay2BillsEl.addEventListener("change", ()=>{
          sp.pay2BillsPct = clampPctLive(splitPay2BillsEl.value);
          enforceSplitSums("pay2Bills");
          render();
        });

        splitPay2SavEl.addEventListener("input", ()=>{
          sp.pay2SavingsPct = clampPctLive(splitPay2SavEl.value);
          enforceSplitSums("pay2Sav");
          splitPay2SavEl.value = String(sp.pay2SavingsPct);
          saveState();
        });
        splitPay2SavEl.addEventListener("change", ()=>{
          sp.pay2SavingsPct = clampPctLive(splitPay2SavEl.value);
          enforceSplitSums("pay2Sav");
          render();
        });
      }

      const splitOtherBillsEl = controls.querySelector("#splitOtherBills");
      const splitOtherSavEl   = controls.querySelector("#splitOtherSav");
      if(splitOtherBillsEl && splitOtherSavEl){
        splitOtherBillsEl.value = String(sp.otherBillsPct || 0);
        splitOtherSavEl.value   = String(sp.otherSavingsPct || 0);

        splitOtherBillsEl.addEventListener("input", ()=>{
          sp.otherBillsPct = clampPctLive(splitOtherBillsEl.value);
          enforceSplitSums("otherBills");
          splitOtherBillsEl.value = String(sp.otherBillsPct);
          saveState();
        });
        splitOtherBillsEl.addEventListener("change", ()=>{
          sp.otherBillsPct = clampPctLive(splitOtherBillsEl.value);
          enforceSplitSums("otherBills");
          render();
        });

        splitOtherSavEl.addEventListener("input", ()=>{
          sp.otherSavingsPct = clampPctLive(splitOtherSavEl.value);
          enforceSplitSums("otherSav");
          splitOtherSavEl.value = String(sp.otherSavingsPct);
          saveState();
        });
        splitOtherSavEl.addEventListener("change", ()=>{
          sp.otherSavingsPct = clampPctLive(splitOtherSavEl.value);
          enforceSplitSums("otherSav");
          render();
        });
      }

      // ===== Additional income list =====
      if(!Array.isArray(state.settings.otherIncomes)) state.settings.otherIncomes = [];
      const otherList = state.settings.otherIncomes;

      function ruleLabel(type){
        return ({
          monthly_dom: "Monthly (DOM)",
          weekly_dow: "Weekly (DOW)",
          annual_md: "Annual (MM-DD)",
          one_time: "One-time (date)",
          biweekly: "Bi-weekly",
          perpay: "Per Pay"
        })[type] || type;
      }
      function ensureRule(x){
        if(!x.rule || typeof x.rule !== "object") x.rule = {type:"monthly_dom", dom:1};
        if(!x.rule.type) x.rule.type = "monthly_dom";
        if(x.rule.type === "monthly_dom" && (x.rule.dom==null)) x.rule.dom = 1;
        if(x.rule.type === "weekly_dow" && (x.rule.dow==null)) x.rule.dow = 1;
        return x.rule;
      }
      function defaultAnchor(){
        return `${mk}-01`;
      }

      function incomeCardHTML(x){
        const rule = ensureRule(x);
        const type = String(rule.type || "monthly_dom");
        const showDom = (type === "monthly_dom");
        const showDow = (type === "weekly_dow");
        const showDate = (type === "one_time" || type === "biweekly" || type === "perpay" || type === "annual_md");
        const domVal = clampInt(rule.dom ?? 1, 1, 31);
        const dowVal = clampInt(rule.dow ?? 1, 0, 6);
        const anchorVal = String(rule.anchor || defaultAnchor());

        return `
          <div class="itemCard" data-oi="${escapeAttr(x.id)}">
            <button class="iconBtn" data-act="delOI" data-id="${escapeAttr(x.id)}" title="Delete">${trashSvg}</button>

            <div class="billTopRow">
              <div class="nameField">
                <label class="lbl">Income</label>
                <input class="in billName" data-act="name" value="${escapeAttr(x.name||"")}" placeholder="Income name" />
              </div>
              <div class="amtField moneyWrap">
                <label class="lbl">Amount</label>
                <div class="moneyInput">
                  <span class="prefix">$</span>
                  <input class="in right billAmt" data-act="amount" type="number" step="0.01" value="${escapeAttr(Number(x.amount||0))}" />
                </div>
              </div>
            </div>

            <div class="billRow2">
              <div>
                <label class="lbl">Rule</label>
                <select class="in" data-act="ruleType">
                  ${["monthly_dom","weekly_dow","annual_md","one_time","biweekly","perpay"].map(t=>`
                    <option value="${t}" ${t===type?"selected":""}>${ruleLabel(t)}</option>
                  `).join("")}
                </select>
              </div>

              <div class="ruleBox" data-show="dom" style="${showDom?'':'display:none;'}">
                <label class="lbl">Day of month</label>
                <input class="in" data-act="dom" type="number" min="1" max="31" value="${escapeAttr(domVal)}" />
              </div>

              <div class="ruleBox" data-show="dow" style="${showDow?'':'display:none;'}">
                <label class="lbl">Day of week</label>
                <select class="in" data-act="dow">
                  ${[
                    ["0","Sunday"],["1","Monday"],["2","Tuesday"],["3","Wednesday"],
                    ["4","Thursday"],["5","Friday"],["6","Saturday"]
                  ].map(([v,lab])=>`<option value="${v}" ${Number(v)===dowVal?"selected":""}>${lab}</option>`).join("")}
                </select>
              </div>

              <div class="ruleBox" data-show="date" style="${showDate?'':'display:none;'}">
                <label class="lbl">Anchor date</label>
                <input class="in" data-act="anchor" type="date" value="${escapeAttr(anchorVal)}" />
                <div class="hint">
                  ${type==="annual_md" ? "Uses MM-DD from the date." : (type==="perpay" ? "Applies on every payday." : (type==="biweekly" ? "Every 14 days from anchor." : "Occurs on this date."))}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      const listEl = controls.querySelector("#otherIncomeList");
      listEl.innerHTML = otherList.length
        ? otherList.map(incomeCardHTML).join("")
        : `<div class="muted">No additional income yet.</div>`;

      // Show helper line ONLY when added
      const summary = controls.querySelector("#otherIncomeSummary");
      if(otherList.length){
        const tot = Number(plan && plan.otherIncomeTotal || 0);
        const per = Number(plan && plan.otherIncomePerPayday || 0);
        summary.textContent = `This month: +${fmtMoney(tot)} total (≈ +${fmtMoney(per)} per payday)`;
        summary.style.display = "";
      }else{
        summary.style.display = "none";
      }

      controls.querySelector("#addOtherIncomeBtn").addEventListener("click", ()=>{
        const id = `oi${Date.now()}`;
        state.settings.otherIncomes.unshift({ id, name:"Additional income", amount:0, rule:{type:"one_time", anchor: defaultAnchor()} });
        render();
      });

      // Inputs for income cards
      controls.addEventListener("input", (e)=>{
        const el = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
        if(!el || !controls.contains(el)) return;
        const card = el.closest("[data-oi]");
        if(!card) return;
        const id = card.dataset.oi;
        const it = otherList.find(x=>String(x.id)===String(id));
        if(!it) return;

        const act = el.dataset.act;
        const rule = ensureRule(it);

        if(act === "name"){ it.name = el.value; }
        if(act === "amount"){ it.amount = round2(el.value || 0); }

        if(act === "ruleType"){
          const next = el.value;
          rule.type = next;
          if(next === "monthly_dom"){ rule.dom = clampInt(rule.dom ?? 1, 1, 31); delete rule.dow; }
          else if(next === "weekly_dow"){ rule.dow = clampInt(rule.dow ?? 1, 0, 6); delete rule.dom; }
          else { delete rule.dom; delete rule.dow; }
          if(next === "annual_md" || next === "one_time" || next === "biweekly" || next === "perpay"){
            if(!rule.anchor) rule.anchor = defaultAnchor();
          }else{
            // keep anchor if present; harmless
          }
          render();
          return;
        }

        if(act === "dom"){ rule.dom = clampInt(el.value, 1, 31); render(); return; }
        if(act === "dow"){ rule.dow = clampInt(el.value, 0, 6); render(); return; }
        if(act === "anchor"){ rule.anchor = el.value; render(); return; }

        render();
      });

      return wrap;
    }

    function renderBills(ctx, planForToast, fullCtx){
      const wrap = document.createElement("div");

      const wide = (window.matchMedia ? window.matchMedia("(min-width: 900px)").matches : (window.innerWidth >= 900));

      const mk = state.selectedMonth;
      const bills = Array.isArray(state.bills) ? state.bills : [];
      const extras = Array.isArray(state.extras) ? state.extras : (state.extras = []);
      const debts = Array.isArray(state.debts) ? state.debts : (state.debts = []);
      state.ui = state.ui || {};
      if(!state.ui.billsSortMode) state.ui.billsSortMode = "custom";
      if(!Array.isArray(state.ui.billCustomOrder)) state.ui.billCustomOrder = bills.map(b=>b && b.id).filter(Boolean);
      if(!Array.isArray(state.ui.extraCustomOrder)) state.ui.extraCustomOrder = extras.map(x=>x && x.id).filter(Boolean);

      const normalizeCustomOrder = (items, key)=>{
        const list = Array.isArray(items) ? items : [];
        const ids = list.map(v=>v && v.id).filter(Boolean);
        const seen = new Set();
        const cur = Array.isArray(state.ui[key]) ? state.ui[key] : [];
        const next = [];
        for(const id of cur){
          if(ids.includes(id) && !seen.has(id)){ seen.add(id); next.push(id); }
        }
        for(const id of ids){
          if(!seen.has(id)){ seen.add(id); next.push(id); }
        }
        state.ui[key] = next;
        return next;
      };
      const billOrder = normalizeCustomOrder(bills, "billCustomOrder");
      const extraOrder = normalizeCustomOrder(extras, "extraCustomOrder");

      const orderedBills = (()=>{
        if(state.ui.billsSortMode === "alpha"){
          return [...bills].sort((a,b)=> String(a?.name||"").localeCompare(String(b?.name||""), undefined, { sensitivity:"base", numeric:true }));
        }
        if(state.ui.billsSortMode === "date"){
          const occ = billOccurrencesForMonth(mk, bills, state.settings);
          const firstDateById = new Map();
          for(const [ms, items] of occ.entries()){
            for(const item of (items || [])){
              const id = item && item.id;
              if(!id) continue;
              const prev = firstDateById.get(id);
              if(prev == null || ms < prev) firstDateById.set(id, ms);
            }
          }
          return [...bills].sort((a,b)=>{
            const ams = firstDateById.get(a?.id);
            const bms = firstDateById.get(b?.id);
            const aMissing = !Number.isFinite(ams);
            const bMissing = !Number.isFinite(bms);
            if(aMissing && !bMissing) return 1;
            if(!aMissing && bMissing) return -1;
            if(!aMissing && !bMissing && ams !== bms) return ams - bms;
            return String(a?.name||"").localeCompare(String(b?.name||""), undefined, { sensitivity:"base", numeric:true });
          });
        }
        if(state.ui.billsSortMode === "amountAsc" || state.ui.billsSortMode === "amountDesc"){
          const dir = state.ui.billsSortMode === "amountDesc" ? -1 : 1;
          return [...bills].sort((a,b)=>{
            const av = Number(a?.amount || 0);
            const bv = Number(b?.amount || 0);
            if(av !== bv) return (av - bv) * dir;
            return String(a?.name||"").localeCompare(String(b?.name||""), undefined, { sensitivity:"base", numeric:true });
          });
        }
        const pos = new Map(billOrder.map((id,i)=>[id,i]));
        return [...bills].sort((a,b)=> (pos.get(a?.id) ?? 1e9) - (pos.get(b?.id) ?? 1e9));
      })();
      const orderedExtras = (()=>{
        const pos = new Map(extraOrder.map((id,i)=>[id,i]));
        return [...extras].sort((a,b)=> (pos.get(a?.id) ?? 1e9) - (pos.get(b?.id) ?? 1e9));
      })();

      const extraSpendEntries = allExtraSpendEntries();
      const extraSpendTransfers = allExtraSpendTransfers();
      const extraSpendOptions = extraSpendCategoryOptions();
      if(state.ui.extraSpendDraftType !== "refund") state.ui.extraSpendDraftType = "spend";
      if(!state.ui.extraSpendDraftExtraId || !extraSpendOptions.some(x=>x.id === state.ui.extraSpendDraftExtraId)){
        state.ui.extraSpendDraftExtraId = extraSpendOptions[0]?.id || "";
      }
      const extraSpendSnapshot = extraSpendSnapshotForMonth(mk, extras, extraSpendEntries, extraSpendTransfers);
      const monthSpendEntries = extraSpendEntries
        .filter(it=>{
          const iso = normalizeISODateLoose(it?.date || "");
          return !!iso && iso.slice(0,7) === mk;
        })
        .sort((a,b)=>{
          const ad = normalizeISODateLoose(a?.date || "");
          const bd = normalizeISODateLoose(b?.date || "");
          if(ad !== bd) return bd.localeCompare(ad);
          const ac = String(a?.createdAt || "");
          const bc = String(b?.createdAt || "");
          if(ac !== bc) return bc.localeCompare(ac);
          return String(a?.extraName || "").localeCompare(String(b?.extraName || ""), undefined, { sensitivity:"base", numeric:true });
        });
      const extraSpendDefaultDateFallback = (()=>{
        const today = todayIsoInTZ(APP_TZ);
        const draftIso = normalizeISODateLoose(state.ui.extraSpendDraftDate || "");

        // Default to today's Eastern date. Do not let an old saved draft date
        // keep Track Spending stuck on where the user left off.
        if(extraSpendDateManualSession && draftIso && draftIso.slice(0,7) === mk) return draftIso;

        return (today.slice(0,7) === mk) ? today : `${mk}-01`;
      })();
      const trackSpendingCollapsed = !!state.ui.trackSpendingCollapsed;
      const billsSectionCollapsed = !!state.ui.billsSectionCollapsed;
      const extraCostsSectionCollapsed = !!state.ui.extraCostsSectionCollapsed;
      const debtSectionCollapsed = !!state.ui.debtSectionCollapsed;
      const extraShiftCollapsed = state.ui.extraShiftCollapsed !== false;
      function extraSpendOptionHTML(selectedId){
        const cur = String(selectedId || "");
        return extraSpendOptions.map(opt=>`<option value="${escapeAttr(opt.id)}" ${opt.id===cur?"selected":""}>${escapeHtml(opt.name)}</option>`).join("");
      }

      function extraSpendPreviewPeriodMeta(mk, spendEntries, preferredIso){
        // Use the date box/current day to decide the ACTIVE pay period.
        // Old behavior used the newest spending log, which made a new pay period
        // keep showing the previous one until a new purchase was logged.
        let anchorIso = normalizeISODateLoose(preferredIso || state.ui.extraSpendDraftDate || "");
        if(!anchorIso || anchorIso.slice(0,7) !== mk){
          const todayIso = todayIsoInTZ(APP_TZ);
          anchorIso = (todayIso.slice(0,7) === mk) ? todayIso : `${mk}-01`;
        }

        const period = extraSpendPeriodInfo(anchorIso);
        const startMs = parseISOToMs(period.startIso);
        const endMs = parseISOToMs(period.endIso);
        const snapshot = (Number.isFinite(startMs) && Number.isFinite(endMs))
          ? extraSpendSnapshotForRange(startMs, endMs, extras, spendEntries, extraSpendTransfers)
          : { items: [], totals: { budget:0, spent:0, remaining:0 } };

        return {
          ...period,
          anchorIso,
          snapshot
        };
      }

      const extraSpendDefaultDate = extraSpendDefaultDateFallback;
      state.ui.extraSpendDraftDate = extraSpendDefaultDate;

      const extraSpendPreview = extraSpendPreviewPeriodMeta(mk, extraSpendEntries, extraSpendDefaultDate);
      const extraSpendSummaryMode = state.ui.extraSpendSummaryMode === "month" ? "month" : "pay";

      function extraSpendMonthSummaryFromPayPeriods(monthKey){
        const monthStart = monthStartMs(monthKey);
        const monthEnd = monthEndMs(monthKey);
        const candidateStarts = [];
        for(let offset=-1; offset<=1; offset++){
          const key = addMonthsKey(monthKey, offset);
          const pays = getPaydaysForMonth(key, state.settings || {})
            .slice()
            .sort((a,b)=> a-b)
            .filter((v,i,a)=> i === 0 || v !== a[i-1]);
          candidateStarts.push(...pays);
        }

        const periodStarts = candidateStarts
          .filter((v,i,a)=> Number.isFinite(v) && a.indexOf(v) === i)
          .sort((a,b)=> a-b);

        if(!periodStarts.length){
          return extraSpendSnapshotForMonth(monthKey, extras, extraSpendEntries, extraSpendTransfers);
        }

        const monthItemsMap = new Map();
        const ensureMonthItem = (row)=>{
          const sid = String(row?.id || "");
          if(!sid) return null;
          if(!monthItemsMap.has(sid)){
            monthItemsMap.set(sid, {
              id: sid,
              name: String(row?.name || "Extra cost"),
              budget: 0,
              spent: 0,
              remaining: 0,
              entryCount: 0,
              transferIn: 0,
              transferOut: 0,
              transferNet: 0
            });
          }
          const out = monthItemsMap.get(sid);
          if(row?.name) out.name = String(row.name);
          return out;
        };

        for(const periodStartMs of periodStarts){
          const nextPaydayMs = nextPaydayAfterMs(periodStartMs, state.settings || {});
          if(!Number.isFinite(nextPaydayMs)) continue;
          const periodEndMs = addDaysMs(nextPaydayMs, -1);
          if(!Number.isFinite(periodEndMs) || periodEndMs < periodStartMs) continue;

          const overlapsMonth = periodEndMs >= monthStart && periodStartMs <= monthEnd;
          const endsInMonth = isoDate(periodEndMs).slice(0,7) === monthKey;
          if(!overlapsMonth || !endsInMonth) continue;

          const periodSnapshot = extraSpendSnapshotForRange(periodStartMs, periodEndMs, extras, extraSpendEntries, extraSpendTransfers);
          for(const row of (Array.isArray(periodSnapshot?.items) ? periodSnapshot.items : [])){
            const target = ensureMonthItem(row);
            if(!target) continue;
            target.budget = round2(target.budget + Number(row?.budget || 0));
            target.spent = round2(target.spent + Number(row?.spent || 0));
            target.entryCount += Number(row?.entryCount || 0);
            target.transferIn = round2(target.transferIn + Number(row?.transferIn || 0));
            target.transferOut = round2(target.transferOut + Number(row?.transferOut || 0));
            target.transferNet = round2(target.transferNet + Number(row?.transferNet || 0));
          }
        }

        const items = Array.from(monthItemsMap.values())
          .map(row=> ({
            ...row,
            remaining: round2(Number(row.budget || 0) - Number(row.spent || 0))
          }))
          .sort(compareExtraCategoryNames);

        return {
          items,
          totals: {
            budget: round2(items.reduce((sum, row)=> sum + Number(row?.budget || 0), 0)),
            spent: round2(items.reduce((sum, row)=> sum + Number(row?.spent || 0), 0)),
            remaining: round2(items.reduce((sum, row)=> sum + Number(row?.remaining || 0), 0))
          }
        };
      }

      function graphPocketBaseForPeriodStart(periodStartMs){
        const periodMonthKey = isoDate(periodStartMs).slice(0,7);
        const plan = (ctx && ctx.plans) ? ctx.plans.get(periodMonthKey) : null;
        if(!plan) return 0;
        const paydays = (plan.paydays || []).slice().sort((a,b)=> a-b);
        const idx = paydays.findIndex(ms => ms === periodStartMs);
        if(idx < 0) return 0;
        return round2(pocketBasePerPaycheck(plan, idx));
      }

      function extraSpendGraphRowsForMonth(monthKey){
        const monthStart = monthStartMs(monthKey);
        const monthEnd = monthEndMs(monthKey);
        const todayMs = parseISOToMs(todayIsoInTZ(APP_TZ));
        const candidateStarts = [];

        for(let offset=-1; offset<=1; offset++){
          const key = addMonthsKey(monthKey, offset);
          const pays = getPaydaysForMonth(key, state.settings || {})
            .slice()
            .sort((a,b)=> a-b)
            .filter((v,i,a)=> i === 0 || v !== a[i-1]);
          candidateStarts.push(...pays);
        }

        const periodStarts = candidateStarts
          .filter((v,i,a)=> Number.isFinite(v) && a.indexOf(v) === i)
          .sort((a,b)=> a-b);

        const rows = [];
        for(const periodStartMs of periodStarts){
          const nextPaydayMs = nextPaydayAfterMs(periodStartMs, state.settings || {});
          if(!Number.isFinite(nextPaydayMs)) continue;
          const periodEndMs = addDaysMs(nextPaydayMs, -1);
          if(!Number.isFinite(periodEndMs) || periodEndMs < periodStartMs) continue;

          const overlapsMonth = periodEndMs >= monthStart && periodStartMs <= monthEnd;
          const endsInMonth = isoDate(periodEndMs).slice(0,7) === monthKey;
          if(!overlapsMonth || !endsInMonth) continue;

          const isCurrentPeriod = Number.isFinite(todayMs) && todayMs >= periodStartMs && todayMs <= periodEndMs;
          const isComplete = Number.isFinite(todayMs) ? periodEndMs < todayMs : true;
          const periodSnapshot = extraSpendSnapshotForRange(periodStartMs, periodEndMs, extras, extraSpendEntries, extraSpendTransfers);
          const periodBudget = round2(Number(periodSnapshot?.totals?.budget || 0));

          rows.push({
            id: `${isoDate(periodStartMs)}_${isoDate(periodEndMs)}`,
            startMs: periodStartMs,
            endMs: periodEndMs,
            pocketBase: graphPocketBaseForPeriodStart(periodStartMs),
            budget: periodBudget,
            spent: 0,
            entryCount: 0,
            isCurrentPeriod,
            isComplete
          });
        }

        const allLogs = Array.isArray(extraSpendEntries) ? extraSpendEntries : [];
        for(const it of allLogs){
          const iso = normalizeISODateLoose(it?.date || "");
          const ms = parseISOToMs(iso);
          if(!Number.isFinite(ms)) continue;
          const row = rows.find(r => ms >= r.startMs && ms <= r.endMs);
          if(!row) continue;
          row.spent = round2(Number(row.spent || 0) + Number(it?.amount || 0));
          row.entryCount = Number(row.entryCount || 0) + 1;
        }

        const activeRows = rows.filter(row => Number(row?.entryCount || 0) > 0 || Number(row?.spent || 0) !== 0 || row?.isCurrentPeriod);
        activeRows.sort((a,b)=> a.startMs - b.startMs);
        const totalSpent = round2(activeRows.reduce((sum, row)=> sum + Number(row?.spent || 0), 0));
        const completedRows = activeRows.filter(row => row?.isComplete);
        const completedTotalSpent = round2(completedRows.reduce((sum, row)=> sum + Number(row?.spent || 0), 0));
        const averageSpent = completedRows.length ? round2(completedTotalSpent / completedRows.length) : 0;
        const maxSpent = Math.max(averageSpent, ...activeRows.map(row=> Number(row?.spent || 0)), ...activeRows.map(row=> Number(row?.budget || 0)), 0);

        return {
          monthKey,
          rangeMode: "month",
          rows: activeRows,
          totalSpent,
          completedTotalSpent,
          averageSpent,
          maxSpent,
          count: activeRows.length,
          completedCount: completedRows.length,
          hasCurrentPeriod: activeRows.some(row => row?.isCurrentPeriod)
        };
      }

      function extraSpendGraphRowsLastN(monthKey, count){
        const monthEnd = monthEndMs(monthKey);
        const todayMs = parseISOToMs(todayIsoInTZ(APP_TZ));
        const candidateStarts = [];
        for(let offset=-12; offset<=1; offset++){
          const key = addMonthsKey(monthKey, offset);
          const pays = getPaydaysForMonth(key, state.settings || {})
            .slice()
            .sort((a,b)=> a-b)
            .filter((v,i,a)=> i === 0 || v !== a[i-1]);
          candidateStarts.push(...pays);
        }

        const rows = candidateStarts
          .filter((v,i,a)=> Number.isFinite(v) && a.indexOf(v) === i)
          .sort((a,b)=> a-b)
          .map(periodStartMs=>{
            const nextPaydayMs = nextPaydayAfterMs(periodStartMs, state.settings || {});
            if(!Number.isFinite(nextPaydayMs)) return null;
            const periodEndMs = addDaysMs(nextPaydayMs, -1);
            if(!Number.isFinite(periodEndMs) || periodEndMs < periodStartMs || periodEndMs > monthEnd) return null;
            const isCurrentPeriod = Number.isFinite(todayMs) && todayMs >= periodStartMs && todayMs <= periodEndMs;
            const isComplete = Number.isFinite(todayMs) ? periodEndMs < todayMs : true;
            const periodSnapshot = extraSpendSnapshotForRange(periodStartMs, periodEndMs, extras, extraSpendEntries, extraSpendTransfers);
            const periodBudget = round2(Number(periodSnapshot?.totals?.budget || 0));
            return {
              id: `${isoDate(periodStartMs)}_${isoDate(periodEndMs)}`,
              startMs: periodStartMs,
              endMs: periodEndMs,
              pocketBase: graphPocketBaseForPeriodStart(periodStartMs),
              budget: periodBudget,
              spent: 0,
              entryCount: 0,
              isCurrentPeriod,
              isComplete
            };
          })
          .filter(Boolean);

        const allLogs = Array.isArray(extraSpendEntries) ? extraSpendEntries : [];
        for(const it of allLogs){
          const iso = normalizeISODateLoose(it?.date || "");
          const ms = parseISOToMs(iso);
          if(!Number.isFinite(ms)) continue;
          const row = rows.find(r => ms >= r.startMs && ms <= r.endMs);
          if(!row) continue;
          row.spent = round2(Number(row.spent || 0) + Number(it?.amount || 0));
          row.entryCount = Number(row.entryCount || 0) + 1;
        }

        const activeRows = rows.filter(row => Number(row?.entryCount || 0) > 0 || Number(row?.spent || 0) !== 0 || row?.isCurrentPeriod);
        const selectedRows = activeRows.slice(-Math.max(1, Number(count || 7)));
        const totalSpent = round2(selectedRows.reduce((sum, row)=> sum + Number(row?.spent || 0), 0));
        const completedRows = selectedRows.filter(row => row?.isComplete);
        const completedTotalSpent = round2(completedRows.reduce((sum, row)=> sum + Number(row?.spent || 0), 0));
        const averageSpent = completedRows.length ? round2(completedTotalSpent / completedRows.length) : 0;
        const maxSpent = Math.max(averageSpent, ...selectedRows.map(row=> Number(row?.spent || 0)), ...selectedRows.map(row=> Number(row?.budget || 0)), 0);

        return {
          monthKey,
          rangeMode: "last7",
          rows: selectedRows,
          totalSpent,
          completedTotalSpent,
          averageSpent,
          maxSpent,
          count: selectedRows.length,
          completedCount: completedRows.length,
          hasCurrentPeriod: selectedRows.some(row => row?.isCurrentPeriod)
        };
      }

      function recalcExtraSpendGraphMeta(baseMeta, rows, rangeMode, extra){
        const selectedRows = Array.isArray(rows) ? rows : [];
        const totalSpent = round2(selectedRows.reduce((sum, row)=> sum + Number(row?.spent || 0), 0));
        const completedRows = selectedRows.filter(row => row?.isComplete);
        const completedTotalSpent = round2(completedRows.reduce((sum, row)=> sum + Number(row?.spent || 0), 0));
        const averageSpent = completedRows.length ? round2(completedTotalSpent / completedRows.length) : 0;
        const maxSpent = Math.max(averageSpent, ...selectedRows.map(row=> Number(row?.spent || 0)), ...selectedRows.map(row=> Number(row?.budget || 0)), 0);
        return {
          ...(baseMeta || {}),
          ...(extra || {}),
          rangeMode,
          rows: selectedRows,
          totalSpent,
          completedTotalSpent,
          averageSpent,
          maxSpent,
          count: selectedRows.length,
          completedCount: completedRows.length,
          hasCurrentPeriod: selectedRows.some(row => row?.isCurrentPeriod)
        };
      }

      function extraSpendGraphData(monthKey, rangeMode){
        const mode = rangeMode === "custom" ? "custom" : (rangeMode === "last7" ? "last7" : "month");
        if(mode !== "custom"){
          return mode === "last7"
            ? extraSpendGraphRowsLastN(monthKey, 7)
            : extraSpendGraphRowsForMonth(monthKey);
        }

        const sourceMode = state.ui.extraSpendGraphCustomSource === "last7" ? "last7" : "month";
        const baseMeta = sourceMode === "last7"
          ? extraSpendGraphRowsLastN(monthKey, 7)
          : extraSpendGraphRowsForMonth(monthKey);
        const hiddenIds = new Set((Array.isArray(state.ui.extraSpendGraphHiddenIds) ? state.ui.extraSpendGraphHiddenIds : []).map(x=>String(x)));
        const sourceRows = Array.isArray(baseMeta?.rows) ? baseMeta.rows : [];
        const rows = sourceRows.filter(row => !hiddenIds.has(String(row?.id || "")));
        return recalcExtraSpendGraphMeta(baseMeta, rows, "custom", {
          customSource: sourceMode,
          hiddenCount: Math.max(0, sourceRows.length - rows.length)
        });
      }

      function extraSpendGraphAverageBreakdown(meta){
        const rows = Array.isArray(meta?.rows) ? meta.rows : [];
        const completedRows = rows.filter(row => row?.isComplete);
        const completedCount = completedRows.length;
        if(!completedCount) return [];

        const categories = new Map();
        const ensureCat = (id, name)=>{
          const key = String(id || name || "uncategorized");
          if(!categories.has(key)){
            categories.set(key, {
              id: key,
              name: String(name || "Uncategorized"),
              total: 0,
              entryCount: 0,
              periodsHit: new Set()
            });
          }
          const out = categories.get(key);
          if(name) out.name = String(name);
          return out;
        };

        for(const row of completedRows){
          const periodKey = String(row?.id || `${row?.startMs || ""}_${row?.endMs || ""}`);
          const startMs = Number(row?.startMs);
          const endMs = Number(row?.endMs);
          if(!Number.isFinite(startMs) || !Number.isFinite(endMs)) continue;

          for(const entry of (Array.isArray(extraSpendEntries) ? extraSpendEntries : [])){
            const iso = normalizeISODateLoose(entry?.date || "");
            const ms = parseISOToMs(iso);
            if(!Number.isFinite(ms) || ms < startMs || ms > endMs) continue;
            const amount = Number(entry?.amount || 0);
            const cat = ensureCat(entry?.extraId, entry?.extraName);
            cat.total = round2(cat.total + amount);
            cat.entryCount += 1;
            cat.periodsHit.add(periodKey);
          }
        }

        return Array.from(categories.values())
          .map(cat=>({
            id: cat.id,
            name: cat.name,
            total: round2(cat.total),
            average: round2(cat.total / completedCount),
            entryCount: Number(cat.entryCount || 0),
            periodsHit: cat.periodsHit.size,
            completedCount
          }))
          .filter(cat => cat.entryCount > 0)
          .sort((a,b)=>{
            const avgDiff = Math.abs(Number(b?.average || 0)) - Math.abs(Number(a?.average || 0));
            if(avgDiff) return avgDiff;
            return String(a?.name || "").localeCompare(String(b?.name || ""));
          });
      }

      function extraSpendGraphAverageBreakdownHTML(meta, rangeMode){
        const items = extraSpendGraphAverageBreakdown(meta);
        const completedCount = Number(meta?.completedCount || 0);
        const rangeLabel = rangeMode === "last7" ? "completed pay periods in this range" : "completed pay periods ending in this month";
        if(!items.length){
          return `
            <div class="graphAvgBreakdown" id="graphAvgBreakdown">
              <div class="graphAvgBreakdownHead">
                <div>
                  <div class="graphAvgBreakdownTitle">Average breakdown by category</div>
                  <div class="graphAvgBreakdownSub">Uses the same completed pay periods as the average line.</div>
                </div>
              </div>
              <div class="graphAvgEmpty">No logged categories were found in the completed pay periods used for this average.</div>
            </div>
          `;
        }

        return `
          <div class="graphAvgBreakdown">
            <div class="graphAvgBreakdownHead">
              <div>
                <div class="graphAvgBreakdownTitle">Average breakdown by category</div>
                <div class="graphAvgBreakdownSub">Based on ${completedCount} ${completedCount === 1 ? "completed pay period" : "completed pay periods"} from the ${escapeHtml(rangeLabel)} used by the average line.</div>
              </div>
            </div>
            <div class="graphAvgBreakdownGrid">
              ${items.map(item=>`
                <div class="graphAvgCard">
                  <div class="graphAvgCardName">${escapeHtml(item.name)}</div>
                  <div class="graphAvgCardAvg">${fmtMoney(item.average)}</div>
                  <div class="graphAvgCardMeta">
                    Total logged: ${fmtMoney(item.total)}<br>
                    Logs: ${Number(item.entryCount || 0)}<br>
                    Pay periods with logs: ${Number(item.periodsHit || 0)} / ${Number(item.completedCount || 0)}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      function extraSpendGraphPeriodLogsHTML(meta){
        const openId = String(state.ui.extraSpendGraphOpenId || "");
        if(!openId) return "";
        const graphRows = Array.isArray(meta?.rows) ? meta.rows : [];
        const row = graphRows.find(r => String(r?.id || "") === openId);
        if(!row) return "";

        const startMs = Number(row?.startMs);
        const endMs = Number(row?.endMs);
        if(!Number.isFinite(startMs) || !Number.isFinite(endMs)) return "";

        const logs = (Array.isArray(extraSpendEntries) ? extraSpendEntries : [])
          .filter(it=>{
            const iso = normalizeISODateLoose(it?.date || "");
            const ms = parseISOToMs(iso);
            return Number.isFinite(ms) && ms >= startMs && ms <= endMs;
          })
          .sort((a,b)=>{
            const ad = normalizeISODateLoose(a?.date || "");
            const bd = normalizeISODateLoose(b?.date || "");
            if(ad !== bd) return bd.localeCompare(ad);
            const ac = String(a?.createdAt || "");
            const bc = String(b?.createdAt || "");
            if(ac !== bc) return bc.localeCompare(ac);
            return String(a?.extraName || "").localeCompare(String(b?.extraName || ""), undefined, { sensitivity:"base", numeric:true });
          });

        const title = `${fmtMD(startMs)} to ${fmtMD(endMs)}`;
        const total = round2(logs.reduce((sum, it)=> sum + Number(it?.amount || 0), 0));
        const count = logs.length;
        const detailMode = state.ui.extraSpendGraphDetailMode === "categories" ? "categories" : "logs";

        const catMap = new Map();
        logs.forEach(it=>{
          const rawName = String(it?.extraName || it?.name || "Extra cost").trim() || "Extra cost";
          const key = rawName.toLocaleLowerCase();
          if(!catMap.has(key)){
            catMap.set(key, { name: rawName, total: 0, spendTotal: 0, refundTotal: 0, count: 0 });
          }
          const rec = catMap.get(key);
          const amount = Number(it?.amount || 0);
          const isRefund = String(it?.entryType || "").trim() === "refund" || amount < 0;
          rec.count += 1;
          rec.total = round2(rec.total + amount);
          if(isRefund) rec.refundTotal = round2(rec.refundTotal + amount);
          else rec.spendTotal = round2(rec.spendTotal + amount);
        });
        const categories = Array.from(catMap.values()).sort((a,b)=>{
          const diff = Math.abs(Number(b.total || 0)) - Math.abs(Number(a.total || 0));
          if(diff) return diff;
          return String(a.name || "").localeCompare(String(b.name || ""), undefined, { sensitivity:"base", numeric:true });
        });

        const logsHtml = logs.length ? `
              <div class="graphLogList">
                ${logs.map(it=>{
                  const iso = normalizeISODateLoose(it?.date || "");
                  const amount = Number(it?.amount || 0);
                  const isRefund = String(it?.entryType || "").trim() === "refund" || amount < 0;
                  const amountClass = isRefund ? "pos" : "neg";
                  const kind = isRefund ? "Refund" : "Spend";
                  return `
                    <div class="graphLogItem">
                      <div class="graphLogItemTop">
                        <div class="graphLogCat">${escapeHtml(it?.extraName || it?.name || "Extra cost")}</div>
                        <div class="graphLogAmt ${amountClass}">${fmtMoney(amount)}</div>
                      </div>
                      <div class="graphLogMeta">${escapeHtml(kind)} • ${escapeHtml(iso || "No date")}</div>
                      ${String(it?.note || "").trim() ? `<div class="graphLogNote">${escapeHtml(String(it.note || ""))}</div>` : ``}
                    </div>
                  `;
                }).join("")}
              </div>
            ` : `<div class="spendEmpty">No logs in this pay period yet.</div>`;

        const categoriesHtml = categories.length ? `
              <div class="graphCategoryGrid">
                ${categories.map(cat=>{
                  const totalAmt = Number(cat.total || 0);
                  const amountClass = totalAmt < 0 ? "pos" : (totalAmt > 0 ? "neg" : "");
                  const refundLine = Number(cat.refundTotal || 0) ? ` • Refunds ${fmtMoney(cat.refundTotal)}` : ``;
                  return `
                    <div class="graphCategoryCard">
                      <div class="graphCategoryTop">
                        <div class="graphCategoryName">${escapeHtml(cat.name)}</div>
                        <div class="graphCategoryTotal ${amountClass}">${fmtMoney(totalAmt)}</div>
                      </div>
                      <div class="graphCategoryMeta">
                        ${Number(cat.count || 0)} ${Number(cat.count || 0) === 1 ? "log" : "logs"} • Spend ${fmtMoney(Number(cat.spendTotal || 0))}${refundLine}
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            ` : `<div class="spendEmpty">No category totals yet for this pay period.</div>`;

        return `
          <div class="graphLogPanel" id="graphLogPanel">
            <div class="graphLogHead">
              <div>
                <div class="graphLogTitle">Pay period details</div>
                <div class="graphLogSub">${escapeHtml(title)} • ${count} ${count === 1 ? "log" : "logs"} • Total ${fmtMoney(total)}</div>
              </div>
              <div class="graphLogModeToggle" role="tablist" aria-label="Graph detail view">
                <button type="button" class="graphLogModeBtn ${detailMode === "logs" ? "active" : ""}" data-graph-detail-mode="logs" aria-selected="${detailMode === "logs" ? "true" : "false"}">All logs</button>
                <button type="button" class="graphLogModeBtn ${detailMode === "categories" ? "active" : ""}" data-graph-detail-mode="categories" aria-selected="${detailMode === "categories" ? "true" : "false"}">Categories</button>
              </div>
            </div>
            ${detailMode === "categories" ? categoriesHtml : logsHtml}
          </div>
        `;
      }

      function extraSpendGraphsSectionHTML(){
        const graphsSectionCollapsed = state.ui.graphsSectionCollapsed !== false;
        if(graphsSectionCollapsed){
          return `
            <div class="block graphsBlock">
              <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
                <h3 style="margin:0;">Graphs</h3>
                <button type="button" class="btn small" id="toggleGraphsBtn" aria-expanded="false">Expand</button>
              </div>
            </div>
          `;
        }

        const hasCustomGraphHidden = Array.isArray(state.ui.extraSpendGraphHiddenIds) && state.ui.extraSpendGraphHiddenIds.length > 0;
        const requestedGraphRange = String(state.ui.extraSpendGraphRange || "month");
        const graphRangeMode = (requestedGraphRange === "custom" && hasCustomGraphHidden)
          ? "custom"
          : (requestedGraphRange === "last7" ? "last7" : "month");
        const meta = extraSpendGraphData(mk, graphRangeMode);
        const rows = Array.isArray(meta?.rows) ? meta.rows : [];
        const openGraphId = String(state.ui.extraSpendGraphOpenId || "");
        const averageSpent = Number(meta?.averageSpent || 0);
        const completedCount = Number(meta?.completedCount || 0);
        const showAverage = completedCount > 0 && averageSpent > 0;
        const maxSpent = Math.max(1, Number(meta?.maxSpent || 0), averageSpent);
        const avgPct = showAverage ? Math.max(0, Math.min(100, (averageSpent / maxSpent) * 100)) : 0;
        const graphSubtitle = graphRangeMode === "custom"
          ? `${fmtMonthKeyShort(meta?.monthKey || "")} • custom from ${meta?.customSource === "last7" ? "last 7 pay periods" : "this month"} • ${Number(meta?.hiddenCount || 0)} hidden • avg: completed periods only`
          : graphRangeMode === "last7"
            ? `${fmtMonthKeyShort(meta?.monthKey || "")} • last 7 active periods • avg: completed periods only`
            : `${fmtMonthKeyShort(meta?.monthKey || "")} • month-ending periods • avg: completed periods only`;
        const denseCount = rows.length;
        const graphGap = denseCount >= 7 ? 2 : denseCount >= 6 ? 3 : denseCount >= 5 ? 4 : 8;
        const graphBarW = denseCount >= 7 ? 18 : denseCount >= 6 ? 20 : denseCount >= 5 ? 24 : 38;
        const graphTrackH = denseCount >= 7 ? 104 : denseCount >= 6 ? 110 : denseCount >= 5 ? 116 : 128;
        const graphValueSize = denseCount >= 7 ? 8.5 : denseCount >= 6 ? 9 : denseCount >= 5 ? 10 : 12;
        const graphLabelSize = denseCount >= 7 ? 8.5 : denseCount >= 6 ? 9 : denseCount >= 5 ? 9.5 : 11;
        const graphLabelH = denseCount <= 4 ? 50 : denseCount >= 7 ? 34 : 38;
        const graphTopPad = denseCount >= 6 ? 14 : 16;
        const avgBottom = `calc(var(--graph-bottom-pad) + var(--graph-label-h) + var(--graph-stack-gap) + (var(--graph-track-h) * ${(avgPct / 100).toFixed(6)}))`;
        const avgLabelClass = avgPct >= 88 ? 'graphAvgMarkerLabel below' : 'graphAvgMarkerLabel';
        const avgLabelText = `AVG ${denseCount >= 5 ? fmtMoneyCompact(averageSpent) : fmtMoney(averageSpent)}`;
        const chartHtml = rows.length ? rows.map(row=>{
          const spent = Number(row?.spent || 0);
          const pct = Math.max(0, Math.min(100, (spent / maxSpent) * 100));
          const valueText = denseCount >= 5 ? fmtMoneyCompact(spent) : fmtMoney(spent);
          const rowIsCurrent = !!row?.isCurrentPeriod;
          const periodBudget = Math.max(0, Number(row?.budget || 0));
          const warnThreshold = periodBudget > 0 ? round2(periodBudget * 0.90) : Infinity;
          const rowIsOverBudget = periodBudget > 0 && spent > periodBudget;
          const rowIsNearBudget = periodBudget > 0 && spent >= warnThreshold && spent <= periodBudget;
          const barClass = rowIsOverBudget
            ? 'graphColBar over'
            : rowIsNearBudget
              ? 'graphColBar warn'
              : (rowIsCurrent ? 'graphColBar current' : 'graphColBar complete');
          const labelHtml = denseCount <= 4
            ? `<span>${escapeHtml(fmtMD(row?.startMs))}</span><span>to</span><span>${escapeHtml(fmtMD(row?.endMs))}</span>`
            : `<span>${escapeHtml(fmtMD(row?.startMs))}</span><span>${escapeHtml(fmtMD(row?.endMs))}</span>`;
          return `
            <div class="graphCol${openGraphId === String(row?.id || "") ? ' isOpen' : ''}" data-graph-id="${escapeAttr(row?.id || "")}" data-graph-label="${escapeAttr(`${fmtMD(row?.startMs)} to ${fmtMD(row?.endMs)} • ${valueText}`)}" aria-pressed="${openGraphId === String(row?.id || "") ? "true" : "false"}" title="Tap to view logs • Hold to hide this graph">
              <div class="graphColValue"><span class="graphColSpent">${valueText}</span></div>
              <div class="graphColTrack">
                <div class="${barClass}" style="height:${Math.max(6, pct).toFixed(2)}%;"></div>
              </div>
              <div class="graphColLabel">
                ${labelHtml}
              </div>
            </div>
          `;
        }).join("") : `<div class="spendEmpty" style="margin-top:6px;">No pay periods to graph for this month yet.</div>`;

        return `
          <div class="block graphsBlock">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
              <h3 style="margin:0;">Graphs</h3>
              <button type="button" class="btn small" id="toggleGraphsBtn" aria-expanded="true">Collapse</button>
            </div>
            <div class="graphList">
              <div class="graphRowCard">
                <div class="graphRowTop">
                  <div>
                    <div class="graphRowTitle">Track spending per pay period</div>
                    <div class="graphRowSub">${escapeHtml(graphSubtitle)}</div>
                  </div>
                  <div class="graphRowControls">
                    <label class="graphRangeLabel" for="graphRangeSelect">Range</label>
                    <select id="graphRangeSelect" class="graphRangeSelect">
                      <option value="month" ${graphRangeMode === "month" ? "selected" : ""}>This month</option>
                      <option value="last7" ${graphRangeMode === "last7" ? "selected" : ""}>Last 7 pay periods</option>
                      ${(graphRangeMode === "custom" || hasCustomGraphHidden) ? `<option value="custom" ${graphRangeMode === "custom" ? "selected" : ""}>Custom</option>` : ``}
                    </select>
                  </div>
                </div>
                <div class="graphStats">
                  <span class="chip">Average ${showAverage ? fmtMoney(averageSpent) : '—'}</span>
                  <span class="chip">Total ${fmtMoney(Number(meta?.totalSpent || 0))}</span>
                  <span class="chip">Pay periods ${Number(meta?.count || 0)}</span>
                </div>
                <div class="graphVizWrap">
                  ${rows.length ? `
                    <div class="graphViz" style="grid-template-columns:repeat(${rows.length}, minmax(0, 1fr)); --graph-track-h:${graphTrackH}px; --graph-stack-gap:${graphGap}px; --graph-bar-w:${graphBarW}px; --graph-value-size:${graphValueSize}px; --graph-label-size:${graphLabelSize}px; --graph-label-h:${graphLabelH}px; --graph-top-pad:${graphTopPad}px;">
                      ${showAverage ? `<div class="graphAvgMarker" style="bottom:${avgBottom};"><button type="button" class="${avgLabelClass} graphAvgToggle" id="graphAvgToggleBtn" aria-expanded="${state.ui.extraSpendGraphAvgExpanded ? "true" : "false"}" aria-controls="graphAvgBreakdown">${avgLabelText}</button></div>` : ``}
                      ${chartHtml}
                    </div>
                  ` : chartHtml}
                </div>
                ${extraSpendGraphPeriodLogsHTML(meta)}
                ${showAverage && state.ui.extraSpendGraphAvgExpanded ? extraSpendGraphAverageBreakdownHTML(meta, graphRangeMode) : ``}
                ${rows.length ? `
                  <div class="graphLegend">
                    <span>Green = current pay period under budget.<br>Blue = completed under budget.<br>Yellow = 90%+ of budget.<br>Red = over budget.</span>
                    ${showAverage ? `<span class="graphLegendAvg"><span class="graphLegendAvgLine"></span>Average</span>` : `<span class="graphLegendAvg">Average appears after at least 1 completed pay period.</span>`}

                    <div class="spendCatMeta">
                      <div class="spendCatMetaRow"><span class="muted">Budgeted</span><strong class="num">${fmtMoney(it.budget)}</strong></div>

                      ${isMiscCategory ? `<div class="spendCatDetailsEmpty" style="margin-top:10px; border-top:1px solid var(--border2); padding-top:10px;">Misc automatically uses any pocket money that is not projected to another category.</div>` : `
                      <div class="spendCatMoveWrap" data-target-id="${escapeAttr(sid)}" data-target-name="${escapeAttr(it.name || "Extra cost")}" data-target-remaining="${escapeAttr(round2(Number(it.remaining || 0)))}" style="margin-top:10px; border-top:1px solid var(--border2); padding-top:10px;">
                        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
                          <div style="font-size:12px; color:var(--muted); font-weight:800; letter-spacing:.02em; text-transform:uppercase;">Move budget here</div>
                          <button class="btn small" type="button" data-act="toggleSpendMove" data-id="${escapeAttr(sid)}" aria-expanded="${isMoveOpen ? "true" : "false"}">${isMoveOpen ? "Hide" : "Show"}</button>
                        </div>
                        ${isMoveOpen ? (sourceRows.length ? `
                          <div class="grid2" style="margin-top:10px;">
                            <div class="rowField">
                              <div class="hint">From</div>
                              <select data-act="moveFrom" data-target="${escapeAttr(sid)}">
                                ${sourceRows.map(row=>`
                                  <option value="${escapeAttr(row.id)}" data-name="${escapeAttr(row.name || "Extra cost")}" data-available="${escapeAttr(round2(Number(row.remaining || 0)))}" ${String(row.id || "") === selectedFromId ? "selected" : ""}>${escapeHtml(row.name || "Extra cost")}</option>
                                `).join("")}
                              </select>
                            </div>
                            <div class="rowField">
                              <div class="hint">Amount</div>
                              <input data-act="moveAmt" data-target="${escapeAttr(sid)}" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${escapeAttr(draftAmtRaw)}" />
                            </div>
                          </div>
                          <div class="spendMoveLive" data-move-helper="${escapeAttr(sid)}" style="margin-top:8px; font-size:12px; color:var(--muted); font-weight:700; line-height:1.35;">
                            <div>${escapeHtml(selectedFromRow?.name || "Source")} available <strong class="num ${selectedAvailable < 0 ? "neg" : ""}">${fmtMoney(selectedAvailable)}</strong>${draftAmtNum > 0 ? ` → after <strong class="num ${sourceAfter < 0 ? "neg" : ""}">${fmtMoney(sourceAfter)}</strong>` : ``}</div>
                            ${draftAmtNum > 0 ? `<div>${escapeHtml(it.name || "Extra cost")} remaining after move <strong class="num ${targetAfter < 0 ? "neg" : ""}">${fmtMoney(targetAfter)}</strong></div>` : ``}
                          </div>
                          <div style="margin-top:10px; display:flex; justify-content:flex-end;">
                            <button class="btn small" type="button" data-act="addSpendMove" data-target="${escapeAttr(sid)}">Move here</button>
                          </div>
                        ` : `<div class="spendCatDetailsEmpty" style="margin-top:10px;">No available amount in other categories right now.</div>`) : ``}
                      </div>
                      `}
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      function fmtSignedMoney(n){
        const num = round2(Number(n || 0));
        if(num > 0) return `+${fmtMoney(num)}`;
        return fmtMoney(num);
      }

      function extraSpendTransferRowsHTML(){
        const startMs = parseISOToMs(extraSpendPreview?.startIso || "");
        const endMs = parseISOToMs(extraSpendPreview?.endIso || "");
        const rows = (Number.isFinite(startMs) && Number.isFinite(endMs))
          ? extraSpendTransfers

                const ms = parseISOToMs(iso);

              })
              .slice()
              .sort((a,b)=>{
                const ad = normalizeISODateLoose(a?.date || "");

      function extraSpendPeriodSummaryHTML(snapshot){
        if(!snapshot || !Array.isArray(snapshot.items) || !snapshot.items.length) return "";
        return `
          <div class="spendPeriodSummary">
            <div class="spendPeriodSummaryHead">
              <div class="spendPeriodSummaryTitle">Category totals for this pay period</div>
              <div class="spendPeriodSummaryTotals">
                <span>Budgeted <strong class="num">${fmtMoney(snapshot.totals.budget)}</strong></span>
                <span>Spent <strong class="num">${fmtMoney(snapshot.totals.spent)}</strong></span>
                <span>Remaining <strong class="num ${snapshot.totals.remaining < 0 ? "neg" : ""}">${fmtMoney(snapshot.totals.remaining)}</strong></span>
              </div>

            <div class="spendPeriodCategoryList">
              ${snapshot.items.map(it=>`
                <div class="spendPeriodCategoryRow">
                  <div class="spendPeriodCategoryName">${escapeHtml(it.name || "Extra cost")}</div>
                  <div class="spendPeriodCategoryMeta">

                    <span>Spent <strong class="num">${fmtMoney(it.spent)}</strong></span>

      function formatSpendHistoryMonthLabel(mk){
        const parts = String(mk || "").split("-");
        const y = Number(parts[0] || 0);
        const m = Number(parts[1] || 0);
        if(!y || !m) return String(mk || "");
        return `${monthName(m)} ${y}`;
      }

      function formatSpendHistoryDate(iso, withDow=false){
        const norm = normalizeISODateLoose(iso || "");
        if(!norm) return String(iso || "No date");
        const ms = parseISOToMs(norm);
        if(!Number.isFinite(ms)) return norm;
        const d = toDateObj(ms);
        const base = `${String(d.m).padStart(2,'0')}/${String(d.d).padStart(2,'0')}/${d.y}`;
        return withDow ? `${dowName(d.dow)}, ${base}` : base;
      }

      function ensureExtraSpendHistoryOpen(){
        if(!state.ui || typeof state.ui !== "object") state.ui = {};
        if(!state.ui.extraSpendHistoryOpen || typeof state.ui.extraSpendHistoryOpen !== "object"){
          state.ui.extraSpendHistoryOpen = {};
        }
        return state.ui.extraSpendHistoryOpen;
      }

      function extraSpendPeriodInfo(iso){
        const norm = normalizeISODateLoose(iso || "");
        if(!norm){
          return {
            key: `nodate|${String(iso || "")}`,
            startIso: "",
            endIso: "",
            label: "No pay period",
            sub: "No date"
          };
        }

        const ms = parseISOToMs(norm);
        const mkForDate = norm.slice(0,7);
        let paydays = [];
        for(let i=-2; i<=4; i++){
          const key = addMonthsKey(mkForDate, i);
          paydays = paydays.concat(getPaydaysForMonth(key, state.settings || {}));
        }
        paydays = paydays.slice().sort((a,b)=>a-b).filter((v,i,a)=> i===0 || v!==a[i-1]);

        let start = null;
        let next = null;
        for(const p of paydays){
          if(p <= ms) start = p;
          else { next = p; break; }
        }

        const monthStart = monthStartMs(mkForDate);
        const monthEnd = monthEndMs(mkForDate);
        if(start == null) start = monthStart;
        if(next == null || next <= start) next = addDaysMs(monthEnd, 1);

        const end = addDaysMs(next, -1);
        const startIso = isoDate(start);
        const endIso = isoDate(end);
        return {
          key: `${mkForDate}|${startIso}|${endIso}`,
          startIso,
          endIso,
          label: `${formatSpendHistoryDate(startIso)} – ${formatSpendHistoryDate(endIso)}`,
          sub: ``
        };
      }

      function clearExtraSpendHistoryOpen(){
        const openMap = ensureExtraSpendHistoryOpen();
        Object.keys(openMap).forEach(key=>{
          if(String(key || "").startsWith("esh:")) openMap[key] = false;
        });
        return openMap;
      }

      function flashExtraSpendHistoryEntry(id){
        if(!id) return;
        const rows = Array.from(document.querySelectorAll("[data-extra-spend]"));
        const target = rows.find(el => String(el.getAttribute("data-extra-spend") || "") === String(id));
        if(!target) return;
        target.classList.remove("spendFlashTarget");
        target.scrollIntoView({ behavior:"smooth", block:"center" });
        requestAnimationFrame(()=>{
          target.classList.add("spendFlashTarget");
          const off = ()=>{
            target.classList.remove("spendFlashTarget");
            target.removeEventListener("animationend", off);
          };
          target.addEventListener("animationend", off);
        });
      }

      function jumpToExtraSpendHistory(id){
        const list = allExtraSpendEntries();
        const entry = list.find(x => String(x?.id || "") === String(id || ""));
        if(!entry) return;
        const iso = normalizeISODateLoose(entry?.date || "");
        if(!iso) return;

        const year = iso.slice(0,4);
        const mkEntry = iso.slice(0,7);
        const period = extraSpendPeriodInfo(iso);

        state.ui = state.ui || {};
        state.ui.trackSpendingCollapsed = false;

        const openMap = clearExtraSpendHistoryOpen();
        openMap[`esh:y:${year}`] = true;
        openMap[`esh:m:${mkEntry}`] = true;
        openMap[`esh:p:${period.key}`] = true;

        saveState();
        render();

        const runFlash = ()=>{
          const rows = Array.from(document.querySelectorAll("[data-extra-spend]"));
          const target = rows.find(el => String(el.getAttribute("data-extra-spend") || "") === String(id));
          if(!target){
            setTimeout(()=> flashExtraSpendHistoryEntry(id), 90);
            return;
          }
          flashExtraSpendHistoryEntry(id);
        };
        requestAnimationFrame(()=> requestAnimationFrame(runFlash));
      }

      function extraSpendRowsHTML(){
        const normalHistoryEntries = extraSpendEntries
          .filter(it=>!!normalizeISODateLoose(it?.date || ""))
          .map(it=>({ ...it, __kind:"extra" }));

        const debtHistoryEntries = [];

        const historyEntries = normalHistoryEntries
          .concat(debtHistoryEntries)
          .sort((a,b)=>{
            const ad = normalizeISODateLoose(a?.date || "");
            const bd = normalizeISODateLoose(b?.date || "");
            if(ad !== bd) return bd.localeCompare(ad);

            // Make debt payments easy to find in Track Spending: for the same date,
            // show debt payment logs before normal spend logs. This is display-only;
            // graphs/category math still uses normal Track Spending entries only.
            const ak = String(a?.__kind || "extra");
            const bk = String(b?.__kind || "extra");
            if(ak !== bk){
              if(ak === "debtPayment") return -1;
              if(bk === "debtPayment") return 1;
            }

            const ac = String(a?.createdAt || "");
            const bc = String(b?.createdAt || "");
            if(ac !== bc) return bc.localeCompare(ac);
            return String(a?.extraName || a?.debtName || "").localeCompare(String(b?.extraName || b?.debtName || ""), undefined, { sensitivity:"base", numeric:true });
          });

        if(!historyEntries.length){
          return `<div class="spendEmpty">No spending history yet.</div>`;
        }

        const years = [];
        const yearMap = new Map();
        for(const it of historyEntries){
          const iso = normalizeISODateLoose(it?.date || "");
          if(!iso) continue;
          const year = iso.slice(0,4);
          const mkEntry = iso.slice(0,7);
          const period = extraSpendPeriodInfo(iso);

          let yearNode = yearMap.get(year);
          if(!yearNode){
            yearNode = { year, total:0, count:0, months:[], monthMap:new Map() };
            yearMap.set(year, yearNode);
            years.push(yearNode);
          }
          yearNode.total = round2(yearNode.total + Number(it?.amount || 0));
          yearNode.count += 1;

          let monthNode = yearNode.monthMap.get(mkEntry);
          if(!monthNode){
            monthNode = { mk: mkEntry, total:0, count:0, periods:[], periodMap:new Map() };
            yearNode.monthMap.set(mkEntry, monthNode);
            yearNode.months.push(monthNode);
          }
          monthNode.total = round2(monthNode.total + Number(it?.amount || 0));
          monthNode.count += 1;

          let periodNode = monthNode.periodMap.get(period.key);
          if(!periodNode){
            periodNode = {
              key: period.key,
              startIso: period.startIso,
              endIso: period.endIso,
              label: period.label,
              sub: period.sub,
              total:0,
              count:0,
              items:[]
            };
            monthNode.periodMap.set(period.key, periodNode);
            monthNode.periods.push(periodNode);
          }
          periodNode.total = round2(periodNode.total + Number(it?.amount || 0));
          periodNode.count += 1;
          periodNode.items.push(it);
        }

        const openMap = ensureExtraSpendHistoryOpen();
        const todayIso = todayIsoInTZ();
        const selectedYear = String((state.selectedMonth || "").slice(0,4) || todayIso.slice(0,4));
        const selectedMonthKey = String(state.selectedMonth || todayIso.slice(0,7));
        const latestYear = years[0]?.year || selectedYear;

        const isOpen = (key, fallback)=> Object.prototype.hasOwnProperty.call(openMap, key) ? !!openMap[key] : !!fallback;

        return `
          <div class="spendHistoryTree">
            ${years.map((yearNode, yearIndex)=>{
              const yearKey = `esh:y:${yearNode.year}`;
              const yearDefault = years.length === 1 || yearNode.year === selectedYear || yearNode.year === todayIso.slice(0,4) || (yearIndex === 0 && latestYear === yearNode.year);
              return `
                <details class="spendHistLevel spendHistYear" data-open-key="${escapeAttr(yearKey)}" ${isOpen(yearKey, yearDefault) ? "open" : ""}>
                  <summary class="spendHistSummary">
                    <div class="spendHistSummaryMain">
                      <span class="spendHistChevron">›</span>
                      <div class="spendHistLabelWrap">
                        <div class="spendHistLabel">${escapeHtml(yearNode.year)}</div>
                        <div class="spendHistSub">${yearNode.months.length} ${yearNode.months.length === 1 ? "month" : "months"}</div>
                      </div>
                    </div>
                    <div class="spendHistMeta">
                      <span>${yearNode.count} ${yearNode.count === 1 ? "log" : "logs"}</span>
                      <strong class="num">${fmtMoney(yearNode.total)}</strong>
                    </div>
                  </summary>
                  <div class="spendHistBody">
                    ${yearNode.months.map((monthNode, monthIndex)=>{
                      const monthKey = `esh:m:${monthNode.mk}`;
                      const monthDefault = yearNode.months.length === 1 || monthNode.mk === selectedMonthKey || monthNode.mk === todayIso.slice(0,7) || (yearIndex === 0 && monthIndex === 0);
                      return `
                        <details class="spendHistLevel spendHistMonth" data-open-key="${escapeAttr(monthKey)}" ${isOpen(monthKey, monthDefault) ? "open" : ""}>
                          <summary class="spendHistSummary">
                            <div class="spendHistSummaryMain">
                              <span class="spendHistChevron">›</span>

      function normalizeDebt(d, idx){
        if(!d || typeof d !== "object") d = {};
        if(!d.id) d.id = `d${Date.now()}${idx || 0}`;
        if(!d.name) d.name = "Debt";
        if(typeof d.collapsed !== "boolean") d.collapsed = false;
        if(!Array.isArray(d.payments)) d.payments = [];
        d.payments = d.payments.map((p, pi)=>({
          id: p && p.id ? p.id : `p${Date.now()}${idx || 0}${pi}`,
          date: String((p && p.date) || todayIsoInTZ(APP_TZ)),
          amount: Math.max(0, round2(Number((p && p.amount) || 0))),
          principal: Math.max(0, round2(Number((p && p.principal) || 0))),
          interest: Math.max(0, round2(Number((p && p.interest) || 0))),
          balanceBefore: Math.max(0, round2(Number((p && p.balanceBefore) || 0))),
          balanceAfter: Math.max(0, round2(Number((p && p.balanceAfter) || 0))),
          note: String((p && p.note) || ""),
          createdAt: String((p && p.createdAt) || "")
        })).filter(p=>p.amount > 0);
        d.balance = Math.max(0, round2(Number(d.balance || 0)));
        d.originalBalance = Math.max(d.balance, round2(Number(d.originalBalance || d.balance || 0)));
        d.apr = Math.max(0, round2(Number(d.apr || 0)));
        d.minPayment = Math.max(0, round2(Number(d.minPayment || 0)));
        d.extraPayment = Math.max(0, round2(Number(d.extraPayment || 0)));
        d.interestStartDate = normalizeISODateLoose(d.interestStartDate || "") || "";
        d.dueDay = clampInt(d.dueDay || 1, 1, 31);
        d.priority = clampInt(d.priority || (idx + 1), 1, 999);
        return d;
      }

      debts.forEach(normalizeDebt);
      if(state.ui.debtWorkflowVersion !== 109){
        debts.forEach(d=>{ if(d) d.collapsed = true; });
