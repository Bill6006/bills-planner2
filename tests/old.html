    let __confirmCleanup = null;
    function openConfirm(opts){
      const o = (opts && typeof opts === "object") ? opts : {};
      const title = String(o.title || "Confirm");
      const msg = String(o.message || "Are you sure?");
      const okText = String(o.okText || "Delete");
      const cancelText = String(o.cancelText || "Cancel");
      const danger = (o.danger !== false);
      const onConfirm = (typeof o.onConfirm === "function") ? o.onConfirm : null;

      const overlay = document.getElementById("confirmOverlay");
      const titleEl = document.getElementById("confirmTitle");
      const msgEl = document.getElementById("confirmMsg");
      const btnOk = document.getElementById("confirmOk");
      const btnCancel = document.getElementById("confirmCancel");
      if(!overlay || !titleEl || !msgEl || !btnOk || !btnCancel){
        if(danger){
          if(confirm(msg)) onConfirm && onConfirm();
        }else{
          if(confirm(msg)) onConfirm && onConfirm();
        }
        return;
      }

      titleEl.textContent = title;
      msgEl.textContent = msg;
      btnOk.textContent = okText;
      btnCancel.textContent = cancelText;
      btnOk.classList.toggle("danger", !!danger);

      function close(){
        overlay.classList.add("hidden");
        overlay.setAttribute("aria-hidden", "true");
        if(__confirmCleanup){ try{ __confirmCleanup(); }catch(_){ } }
        __confirmCleanup = null;
      }

      const onKey = (e)=>{
        if(e.key === "Escape"){ e.preventDefault(); close(); }
      };

      const onCancel = (e)=>{ e.preventDefault(); close(); };
      const onOk = (e)=>{
        e.preventDefault();
        close();
        try{ onConfirm && onConfirm(); }catch(_){}
      };

      btnCancel.addEventListener("click", onCancel, { once:true });
      btnOk.addEventListener("click", onOk, { once:true });
      overlay.addEventListener("click", (e)=>{ if(e.target === overlay) close(); }, { once:true });
      document.addEventListener("keydown", onKey);

      __confirmCleanup = ()=> document.removeEventListener("keydown", onKey);

      overlay.classList.remove("hidden");
      overlay.setAttribute("aria-hidden", "false");
      btnCancel.focus({ preventScroll:true });
    }


    function pocketPayPeriods(plan){
      const paydays = (plan.paydays || []).slice().sort((a,b)=>a-b);
      if(paydays.length === 0) return [];

      const periods = [];
      for(let i=0; i<paydays.length; i++){
        const start = paydays[i];

        let next = null;
        if(i < paydays.length-1) next = paydays[i+1];
        else next = plan.nextPaydayAfterLast || null;

        // Fallback: keep within month if we can't find the next payday
        if(!next || next <= start) next = addDaysMs(plan.monthEnd, 1);

        const periodEnd = addDaysMs(next, -1);

        const base = pocketForPayIndex(plan, i);
        const spent = Number(plan.pocketSpentByPayIndex?.[i] || 0);
        const net = round2(base - spent);

        periods.push({
          payIndex: i,
          start,
          end: periodEnd,
          pocketBase: base,
          pocketSpent: round2(spent),
          pocketNet: net
        });
      }
      return periods;
    }

    function payIndexForDate(plan, ms){
      if(!plan || !Array.isArray(plan.paydays) || plan.paydays.length === 0) return null;
      const sorted = plan.paydays.slice().sort((a,b)=>a-b);
      let idx = -1;
      for(let i=0;i<sorted.length;i++){
        if(sorted[i] <= ms) idx = i;
        else break;
      }
      return Math.max(0, idx);
    }

    function livePocketInfoForDate(ctx, ms){
      const mk = state.selectedMonth;
      let plan = ctx.plans.get(mk);
      if(!plan || plan.paydays.length === 0) return null;

      // If the date is BEFORE the first payday in the selected month,
      // the "current pay period" actually belongs to the previous month.
      const sorted = (plan.paydays || []).slice().sort((a,b)=>a-b);
      if(sorted.length && ms < sorted[0]){
        const prev = ctx.plans.get(addMonthsKey(mk, -1));
        if(prev && prev.paydays && prev.paydays.length) plan = prev;
      }

      if(!plan || plan.paydays.length === 0) return null;

      const idx = payIndexForDate(plan, ms);
      if(idx === null) return null;

      const periods = pocketPayPeriods(plan);
      const period = periods.find(p=>p.payIndex===idx) || periods[0] || null;
      if(!period) return null;

      return { plan, idx, period, net: pocketNetForPayIndex(plan, idx), base: (period && Number.isFinite(period.pocketBase)) ? period.pocketBase : pocketForPayIndex(plan, idx) };
    }

    let pocketToastTimer = null;

    function showPocketToast(ctx, opts = {}){
      const toast = document.getElementById("pocketToast");
      if(!toast) return;

      const ms = (typeof opts.ms === "number") ? opts.ms : parseISOToMs(todayIsoInTZ(APP_TZ));
      const info = livePocketInfoForDate(ctx, ms);

      if(!info){
        toast.style.display = "none";
        return;
      }

      const label = opts.label ? String(opts.label) : "Projected free to spend";
      toast.innerHTML = `
        <span class="main">${escapeHtml(label)}: ${escapeHtml(fmtMoney(info.net))}<span class="pocketSlash">/</span><span class="pocketTot">${escapeHtml(fmtMoney(info.base))}</span></span>
        <span class="sub">Pay period: ${escapeHtml(isoDate(info.period.start))} → ${escapeHtml(isoDate(info.period.end))}</span>
      `;

      const duration = (typeof opts.duration === "number") ? opts.duration : 7000;

      // Default: top-center
      toast.style.visibility = "visible";
      toast.style.left = "50%";
      toast.style.top = `calc(env(safe-area-inset-top) + 10px)`;
      toast.style.transform = "translateX(-50%)";
      toast.style.display = "block";

      // Optional: anchor near an element/rect (helps on mobile so it doesn't block editing)
      const anchorEl = opts.anchorEl;
      const anchorRect = opts.anchorRect || null;
      const ar0 = anchorRect || ((anchorEl && anchorEl.getBoundingClientRect) ? anchorEl.getBoundingClientRect() : null);
      if(ar0){
        // Measure after display
        toast.style.visibility = "hidden";
        const tr = toast.getBoundingClientRect();
        const ar = ar0;

        const gap = 10;
        const preferAbove = (opts.preferAbove !== undefined) ? !!opts.preferAbove : true;

        let top = preferAbove ? (ar.top - tr.height - gap) : (ar.bottom + gap);
        if(top < 8) top = ar.bottom + gap;
        if(top + tr.height > window.innerHeight - 8) top = Math.max(8, ar.top - tr.height - gap);

        let left = ar.left + (ar.width/2) - (tr.width/2);
        left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));

        toast.style.left = `${left}px`;
        toast.style.top = `${top}px`;
        toast.style.transform = "none";
        toast.style.visibility = "visible";
      }

      if(pocketToastTimer) clearTimeout(pocketToastTimer);
      pocketToastTimer = setTimeout(()=>{ toast.style.display = "none"; }, duration);
    }

    let _pendingRenderAfterEdit = false;
    function _isEditingInputActive(){
      const el = document.activeElement;
      if(!el || el === document.body || el === document.documentElement) return false;
      if(!el.matches || !el.matches("input, textarea, select")) return false;
      if(el.readOnly || el.disabled) return false;

      // Do NOT block re-render for picker/dropdown controls. Android often leaves
      // <input type="month/date"> focused after a selection, which made Sync base
      // and projected mode appear only after a manual refresh.
      const tag = String(el.tagName || "").toLowerCase();
      const type = String(el.getAttribute("type") || "").toLowerCase();
      if(tag === "select" || type === "month" || type === "date") return false;

      // Only guard true typing fields in the main app forms. This prevents Android/iOS
      // from closing the keyboard when a render would recreate the field being edited.
      return !!el.closest("#panelBody");
    }
    function _flushPendingRenderAfterEdit(){
      if(!_pendingRenderAfterEdit) return;
      if(_isEditingInputActive()) return;
      _pendingRenderAfterEdit = false;
      render();
    }
    document.addEventListener("focusout", ()=>{
      setTimeout(_flushPendingRenderAfterEdit, 80);
    }, true);
    document.addEventListener("change", (e)=>{
      const el = e.target;
      if(el && el.matches && el.matches("input, textarea, select") && el.closest("#panelBody")){
        setTimeout(_flushPendingRenderAfterEdit, 120);
      }
    }, true);

      // NOTE: Base month never auto-follows the Viewed month. (Strict anchor)

      
      const baseMonth = (state.settings.baseMonth || (state.selectedMonth || currentLocalMonthKey())).trim();

      // Ensure the planning context covers BOTH:
      // - the viewed month (for dashboard/ledger), and

      const viewMonth = state.selectedMonth || currentLocalMonthKey();
      const horizon = Math.max(12, Number(state.settings?.savings?.timelineMonths || 6) + 2);

      const bi = monthIndex(baseMonth);

      // Build a context that always includes the viewed month, even when the Base month is in the future.
      // Range start = min(viewed, base). Range end = max(viewed, base) + horizon.
      let rangeStart = baseMonth;
      let rangeEnd = viewMonth;
      if(Number.isFinite(bi) && Number.isFinite(vi)){
        rangeStart = (bi <= vi) ? baseMonth : viewMonth;
        rangeEnd   = (bi <= vi) ? viewMonth : baseMonth;
      } else {
        rangeStart = (baseMonth || viewMonth).trim();
        rangeEnd   = (viewMonth || baseMonth).trim();
      }

      const toMonth = addMonthsKey(rangeEnd, horizon);

      if(state.ui.activeTab === "events") body.appendChild(renderEvents(ctx));

    /***********************
     * Ledger sticky header (main page scroll; no inner scrollbar)
     ***********************/
    let _ledgerStickyEl = null;
    let _ledgerStickyWrap = null;
    let _ledgerStickyTable = null;
    let _ledgerStickyHeadH = 0;
    let _ledgerStickyIsOn = false;
    let _ledgerStickyAdjusting = false;

    function ensureLedgerStickyEl(){
      if(_ledgerStickyEl) return _ledgerStickyEl;
      const el = document.createElement("div");
      el.id = "ledgerStickyHeader";
      el.className = "ledgerStickyHeader";
      el.innerHTML = `<div class="ledgerStickyClip"><div class="ledgerStickyInner"></div></div>`;
      document.body.appendChild(el);
      _ledgerStickyEl = el;
      return el;
    }

    function _ledgerStickyWrapScroll(){
      // Only horizontal alignment work here (cheap)
      if(!_ledgerStickyIsOn || !_ledgerStickyEl || !_ledgerStickyWrap) return;
      const inner = _ledgerStickyEl.querySelector(".ledgerStickyInner");
      if(inner) inner.style.transform = `translateX(${-_ledgerStickyWrap.scrollLeft}px)`;
    }

    
    function syncLedgerStickyColWidths(){
      if(!_ledgerStickyTable || !_ledgerStickyEl) return;
      const srcTh = _ledgerStickyTable.querySelectorAll("thead th");
      const inner = _ledgerStickyEl.querySelector(".ledgerStickyInner");
      const cloneTable = inner ? inner.querySelector("table") : null;
      if(!cloneTable || !srcTh || !srcTh.length) return;

      // Ensure a colgroup exists so the cloned header uses the exact same column pixel widths
      let colgroup = cloneTable.querySelector("colgroup");
      if(!colgroup){
        colgroup = document.createElement("colgroup");
        cloneTable.insertBefore(colgroup, cloneTable.firstChild);
      }
      while(colgroup.children.length < srcTh.length){
        colgroup.appendChild(document.createElement("col"));
      }

      for(let i=0;i<srcTh.length;i++){
        const w = Math.round(srcTh[i].getBoundingClientRect().width);
        if(w > 0){
          colgroup.children[i].style.width = `${w}px`;
          colgroup.children[i].style.minWidth = `${w}px`;
          colgroup.children[i].style.maxWidth = `${w}px`;
        }
      }
    }

function refreshLedgerStickyHeader(){
      const mainPanel = document.getElementById("mainPanel");
      const enabled = !!(mainPanel && mainPanel.classList.contains("ledgerStickyEnabled"));
      const el = ensureLedgerStickyEl();

      if(!enabled){
        _ledgerStickyIsOn = false;
        el.classList.remove("on");
        if(_ledgerStickyWrap) _ledgerStickyWrap.style.paddingTop = "";
        _ledgerStickyWrap = null;
        _ledgerStickyTable = null;
        return;
      }

      const wrap = document.querySelector("#panelBody .ledgerTableWrap");
      const table = wrap?.querySelector("table");
      const thead = table?.querySelector("thead");

      if(!wrap || !table || !thead){
        _ledgerStickyIsOn = false;
        el.classList.remove("on");
        if(_ledgerStickyWrap) _ledgerStickyWrap.style.paddingTop = "";
        _ledgerStickyWrap = null;
        _ledgerStickyTable = null;
        return;
      }

      if(_ledgerStickyWrap !== wrap || _ledgerStickyTable !== table){
        // detach old
        if(_ledgerStickyWrap){
          _ledgerStickyWrap.removeEventListener("scroll", _ledgerStickyWrapScroll);
          _ledgerStickyWrap.style.paddingTop = "";
        }

        _ledgerStickyWrap = wrap;
        _ledgerStickyTable = table;

        // rebuild header clone
        const inner = el.querySelector(".ledgerStickyInner");
        inner.innerHTML = "";
        const t = document.createElement("table");
        t.className = table.className || "";
        t.style.tableLayout = getComputedStyle(table).tableLayout || "fixed";
        // Match the real table width; without this the clone can shrink and misalign.
        t.style.width = `${table.scrollWidth}px`;
        t.style.minWidth = `${table.scrollWidth}px`;
        t.appendChild(thead.cloneNode(true));
        inner.appendChild(t);

        // sync horizontal scroll
        wrap.addEventListener("scroll", _ledgerStickyWrapScroll, {passive:true});

        _ledgerStickyIsOn = false;
        el.classList.remove("on");
      }

      updateLedgerStickyHeader();
    }

    function setLedgerSticky(on){
      if(!_ledgerStickyWrap || !_ledgerStickyTable) return;
      const el = ensureLedgerStickyEl();

      if(on === _ledgerStickyIsOn){
        // keep positioned
        if(on) el.classList.add("on");
        return;
      }

      const thead = _ledgerStickyTable.querySelector("thead");
      const h = thead ? Math.round(thead.getBoundingClientRect().height) : 0;
      _ledgerStickyHeadH = h || _ledgerStickyHeadH || 44;

      _ledgerStickyAdjusting = true;

      if(on){
        // Create a reserved space inside the wrap (so the fixed header doesn't cover the first row),
        // then compensate scroll so there is no "jump".
        _ledgerStickyWrap.style.paddingTop = `${_ledgerStickyHeadH}px`;
        window.scrollBy(0, _ledgerStickyHeadH);
        el.classList.add("on");
      }else{
        _ledgerStickyWrap.style.paddingTop = "";
        window.scrollBy(0, -_ledgerStickyHeadH);
        el.classList.remove("on");
      }

      _ledgerStickyIsOn = on;
      // allow one tick for the scrollBy to settle
      setTimeout(()=>{ _ledgerStickyAdjusting = false; }, 0);
    }

    function updateLedgerStickyHeader(){
      if(_ledgerStickyAdjusting) return;

      const mainPanel = document.getElementById("mainPanel");
      const enabled = !!(mainPanel && mainPanel.classList.contains("ledgerStickyEnabled"));
      const el = ensureLedgerStickyEl();

      if(!enabled || !_ledgerStickyWrap || !_ledgerStickyTable){
        setLedgerSticky(false);
        el.classList.remove("on");
        return;
      }

      const wrap = _ledgerStickyWrap;
      const table = _ledgerStickyTable;

      const wrapRect = wrap.getBoundingClientRect();
      const stickTop = 8;

      const thead = table.querySelector("thead");
      const headerH = thead ? Math.round(thead.getBoundingClientRect().height) : (_ledgerStickyHeadH || 44);

      const shouldStick = (wrapRect.top < stickTop) && (wrapRect.bottom > stickTop + headerH + 8);

      setLedgerSticky(shouldStick);

      if(!shouldStick){
        el.classList.remove("on");
        return;
      }

      // Position/size to match the visible wrap area
      const left = wrapRect.left;
      el.style.top = `${stickTop}px`;
      el.style.left = `${left}px`;
      el.style.width = `${wrapRect.width}px`;

      // Ensure the cloned header has the full table width and is translated to match horizontal scroll
      const inner = el.querySelector(".ledgerStickyInner");
      if(inner){
        const sw = Math.max(Math.round(table.getBoundingClientRect().width), (table.scrollWidth|0));
        inner.style.width = `${sw}px`;
        inner.style.transform = `translateX(${-wrap.scrollLeft}px)`;

        // Force the cloned header table to match the real table width; otherwise it can shrink-to-fit
        // and the columns won't align with the body on desktop.
        const cloneTable = inner.querySelector("table");
        if(cloneTable){
          cloneTable.style.width = `${sw}px`;
          cloneTable.style.minWidth = `${sw}px`;
        }

        // Match column pixel widths (header-only clone needs explicit widths to align perfectly)
        syncLedgerStickyColWidths();
      }

      el.classList.add("on");
    }


    function buildLedgerDays(ctx){
      const mk = state.selectedMonth;
      const plan = ctx.plans.get(mk);

      const beforeAfter = clampInt(state.ui.daysBeforeAfter || 3, 0, 31);
      const rangeStart = addDaysMs(plan.monthStart, -beforeAfter);
      const rangeEnd = addDaysMs(plan.monthEnd, beforeAfter);

      const out = [];
      for(let ms=rangeStart; ms<=rangeEnd; ms=addDaysMs(ms,1)){
        const dayKey = isoDate(ms);
        const dayMonth = dayKey.slice(0,7);
        const dayPlan = ctx.plans.get(dayMonth);
        if(!dayPlan) continue;

        const dayRow = dayPlan.rows.find(r=>r.ms===ms);
        if(!dayRow) continue;

        const isPrev = (monthIndex(dayMonth) < monthIndex(mk));
        const isNext = (monthIndex(dayMonth) > monthIndex(mk));
        const isPayday = dayPlan.paydays.includes(ms);

        const movement =
          (Math.abs(dayRow.transferIn) > 0.0001) ||
          (Math.abs(dayRow.billsOut) > 0.0001) ||
          (Math.abs(dayRow.savingsIn) > 0.0001) ||
          (Math.abs(dayRow.pocketOut || 0) > 0.0001);

        const keepBoundary = (ms===plan.monthStart || ms===plan.monthEnd);
        const keepPrevNextBadgeDays = (isPrev || isNext) && (isPayday || movement);

        if(state.ui.collapseEmpty && !movement && !keepBoundary && !keepPrevNextBadgeDays) continue;

        out.push({ ms, dayRow, dayPlan, isPrev, isNext, isPayday, dayMonth });
      }
      return out;
    }

    function computeTodayHighlights(days, rangeStartMs, rangeEndMs){
      const todayIso = todayIsoInTZ(APP_TZ);
      const todayMs = parseISOToMs(todayIso);

      const visible = days.map(d=>d.ms);
      const hasTodayVisible = visible.includes(todayMs);

      // "Today exists" if it's within the shown date range (even if collapsed hidden)
      const hasTodayInRange = (Number.isFinite(rangeStartMs) && Number.isFinite(rangeEndMs))
        ? (todayMs >= rangeStartMs && todayMs <= rangeEndMs)
        : false;

      let nearPrevMs = null;
      let nearNextMs = null;

      // bills12-style behavior: only show near highlight when collapse hides Today
      if(state.ui.collapseEmpty && hasTodayInRange && !hasTodayVisible && visible.length){
        for(let i=visible.length-1; i>=0; i--){
          if(visible[i] < todayMs){ nearPrevMs = visible[i]; break; }
        }
        for(let i=0; i<visible.length; i++){
          if(visible[i] > todayMs){ nearNextMs = visible[i]; break; }
        }
      }

      const nearSet = new Set();
      if(nearPrevMs !== null) nearSet.add(nearPrevMs);
      if(nearNextMs !== null) nearSet.add(nearNextMs);

      return { todayMs, nearSet, nearPrevMs, nearNextMs, proxyMs: null };
    }

      const billItems = Array.isArray(dayRow?.cardBillItems)
        ? dayRow.cardBillItems.filter(it => String(it?.name || '').trim())
        : [];
      if(!billItems.length){
        return escapeHtml(dayRow?.notes || "—");

      const leadHtml = leadNotes.length
        ? `<span class="dayNoteChunk">${escapeHtml(leadNotes.join(" • "))}<span class="dayNoteComma"> • </span></span>`
        : "";
      const billsHtml = billItems.map((it, idx)=>{
        const comma = idx < billItems.length - 1 ? `<span class="dayNoteComma">,</span>` : "";
        return `<span class="dayNoteChunk"><span class="dayNoteName">${escapeHtml(it.name)}</span><span class="dayNoteAmount">-${escapeHtml(fmtMoney(Math.abs(Number(it.amount || 0))))}</span>${comma}</span>`;

      return `<span class="dayNotesBreakdown">${leadHtml}${billsHtml}</span>`;

    function renderPocketInline(ctx){
      const wrap = document.createElement("div");
      wrap.className = "pocketInline";
      wrap.innerHTML = `
        <div class="pocketInlineHeader">
          <div class="pocketInlineHeadLeft">
            <div class="t">Pocket leftover (per pay period)</div>
            <div class="pocketModeToggle" title="Switch between the original pay period window and the shifted-back view">
              <span class="modeLbl ${state.ui && state.ui.pocketShiftBackOne ? "" : "active"}">Original</span>
              <div class="switch ${state.ui && state.ui.pocketShiftBackOne ? "on" : ""}" id="pocketShiftModeSwitch" role="switch" aria-checked="${state.ui && state.ui.pocketShiftBackOne ? "true" : "false"}" tabindex="0"></div>
              <span class="modeLbl ${state.ui && state.ui.pocketShiftBackOne ? "active" : ""}">Shift back 1</span>
            </div>
          </div>
          <button class="x" type="button" aria-label="Close">✕</button>
        </div>
                <div id=\"pocketInlineWarn\" class=\"warnBanner\" style=\"display:none;\"></div>
        <div class="pocketInlineBody"></div>
      `;
      const closeBtn = wrap.querySelector("button.x");
      closeBtn.addEventListener("click", ()=>{
        state.ui.showSidePocket = false;
        render();
      });

      const shiftModeSwitch = wrap.querySelector("#pocketShiftModeSwitch");
      if(shiftModeSwitch){
        const togglePocketShiftMode = ()=>{
          state.ui = state.ui || {};
          state.ui.pocketShiftBackOne = !(state.ui.pocketShiftBackOne !== false);
          render();
        };
        shiftModeSwitch.addEventListener("click", togglePocketShiftMode);
        shiftModeSwitch.addEventListener("keydown", (e)=>{
          if(e.key === "Enter" || e.key === " "){
            e.preventDefault();
            togglePocketShiftMode();
          }
        });
      }

      const body = wrap.querySelector(".pocketInlineBody");

      const mk = state.selectedMonth;

      // Pocket Leftover window mode:
      // Original = same window as before.
      // Shift back 1 = move the displayed window back by one pay period while
      // keeping the same number of blocks.
      const shiftedBackOne = !(state.ui && state.ui.pocketShiftBackOne === false);
      const mkStart = monthStartMs(mk);
      const twoMonthsOut = addMonthsKey(mk, 2);
      const twoMonthsOutStart = monthStartMs(twoMonthsOut);

      // Keep the SAME number of Pocket leftover blocks as the normal view,
      // but shift the whole window back by one pay period.
      // Example for semimonthly April:
      // normal: 04/14→04/28, 04/29→05/13, 05/14→05/28, 05/29→06/13
      // shifted:03/29→04/13, 04/14→04/28, 04/29→05/13, 05/14→05/28
      const pctx = buildPlanRange(addMonthsKey(mk, -1), addMonthsKey(twoMonthsOut, 1), state.settings, state.bills);
      const allExtras = allExtrasList();

      const allPeriods = [];
      const seenStarts = new Set();
      for(const [_, plan] of pctx.plans.entries()){
        if(!plan) continue;
        const periods = pocketPayPeriods(plan);
        for(const pp of periods){
          if(seenStarts.has(pp.start)) continue;
          seenStarts.add(pp.start);
          pp.__cap = capForPayIndex(plan, pp.payIndex);
          pp.__savings = Number(plan.savingsPerPaycheck||0);
          pp.__bills = Number(plan.billsPerPaycheck||0);
          allPeriods.push(pp);
        }
      }
      allPeriods.sort((a,b)=>a.start-b.start);

      // This matches the original block count: all pay periods whose START date
      // falls in the selected month or the next month.
      const normalPeriods = allPeriods.filter(pp => pp.start >= mkStart && pp.start < twoMonthsOutStart);
      const desiredCount = Math.max(1, normalPeriods.length || 0);

      let firstNormalIdx = -1;
      if(normalPeriods.length){
        const firstNormalStart = normalPeriods[0].start;
        firstNormalIdx = allPeriods.findIndex(pp => pp.start === firstNormalStart);
      }else{
        firstNormalIdx = allPeriods.findIndex(pp => pp.start >= mkStart);
      }
      if(firstNormalIdx < 0) firstNormalIdx = 0;

      const originalStartIdx = Math.max(0, firstNormalIdx);
      const shiftedStartIdx = Math.max(0, firstNormalIdx - 1);

      const periodsWindow = shiftedBackOne
        ? allPeriods.slice(shiftedStartIdx, shiftedStartIdx + desiredCount)
        : allPeriods.slice(originalStartIdx, originalStartIdx + desiredCount);

      const pocketWarn = wrap.querySelector("#pocketInlineWarn");
      if(pocketWarn && periodsWindow.length){
        const maxBase = Math.max(...periodsWindow.map(p=>Number(p.pocketBase||0)));
        const minBase = Math.min(...periodsWindow.map(p=>Number(p.pocketBase||0)));
        const nearZero = (v)=> Math.abs(Number(v||0)) < 0.01;

        // Use the first period as a representative explanation (caps/transfers are typically stable).
        const p0 = periodsWindow[0];
        const cap0 = Number(p0.__cap || 0);
        const sav0 = round2(Number(p0.__savings || 0));
        const bil0 = round2(Number(p0.__bills || 0));
        const req0 = round2(sav0 + bil0);

        if(nearZero(maxBase) && req0 >= (cap0 - 0.01)){
          pocketWarn.innerHTML =
            `<strong>Heads up:</strong> Pocket base is ${escapeHtml(fmtMoney(maxBase))} because required transfers consume the paycheck cap (${escapeHtml(fmtMoney(cap0))}): ` +
            `Savings ${escapeHtml(fmtMoney(sav0))} + Bills ${escapeHtml(fmtMoney(bil0))} = ${escapeHtml(fmtMoney(req0))}. ` +
            `Pocket-only costs will appear as negative projected free to spend.`;
          pocketWarn.style.display = "";
        } else if(minBase < 0){
          pocketWarn.innerHTML =
            `<strong>Heads up:</strong> Pocket base goes negative in at least one pay period (as low as ${escapeHtml(fmtMoney(minBase))}). ` +
            `This usually means required transfers exceed the paycheck cap for that period.`;
          pocketWarn.style.display = "";
        }
      }

      for(const pp of periodsWindow){
        const secMk = isoDate(pp.start).slice(0,7);
        const {y,m} = parseMonthKey(secMk);

          const ex = extrasSpentAndNamesForRange(pp.start, pp.end, pctx, allExtras);
          const loggedSnapshot = extraSpendSnapshotForRange(pp.start, pp.end, allExtras, allExtraSpendEntries(), allExtraSpendTransfers());

          const names = Array.isArray(ex.names) ? ex.names.slice() : [];
          const projectedSpent = round2(ex.spent || 0);
          const pocketSpent = round2((loggedSnapshot && loggedSnapshot.totals ? loggedSnapshot.totals.spent : 0) || 0);
          const pocketNet = round2(pp.pocketBase - projectedSpent);
          const spentLimit = round2(pp.pocketBase);
          const pocketSpentOver = pocketSpent > (spentLimit + 0.005);
          const thresholdInfo = pocketMinimumInfo(pctx.plans.get(secMk), pp.payIndex, pocketNet, projectedSpent);
          const thresholdLow = !!thresholdInfo;
          const netThresholdClass = (thresholdLow && thresholdInfo && thresholdInfo.mode === "net") ? " thresholdLowText" : "";
          const baseThresholdClass = (thresholdLow && thresholdInfo && thresholdInfo.mode === "base") ? " thresholdLowText" : "";

          const extrasClass = (names.length <= 4) ? "fixed" : "more";
          const extrasHtml = names.length
            ? names.map(n => `<div class="pe">${escapeHtml(n)}</div>`).join("")
            : `<div class="pe none">none</div>`;

          const item = document.createElement("button");
          item.type = "button";
          item.className = "pocketItem";
          item.dataset.mk = secMk;
          item.dataset.start = String(pp.start);
          item.dataset.end = String(pp.end);
          item.dataset.pk = pocketKey(item.dataset.mk, item.dataset.start, item.dataset.end);
          item.dataset.thresholdLow = thresholdLow ? "1" : "0";
          if(pocketNet < 0) item.classList.add("neg");
          if(thresholdLow) item.classList.add("thresholdLow");
          if(thresholdLow){
            item.title = `${thresholdInfo.metricLabel} ${fmtMoney(thresholdInfo.metricValue)} is below your minimum ${fmtMoney(thresholdInfo.minimum)}. Tap to see why.`;
          }
          item.addEventListener("click", (e)=> togglePocketBreakdownInline(e, item, pctx));

          const selectedMode = pocketThresholdMode();
          item.innerHTML = `
            <div class="l">
              <div class="m">${monthName(m)} ${y}</div>
              <div class="p">${dowName(toDateObj(pp.start).dow)} ${fmtMD(pp.start)} → ${dowName(toDateObj(pp.end).dow)} ${fmtMD(pp.end)}</div>
              <div class="pocketExtras ${extrasClass}">${extrasHtml}</div>
            </div>
            <div>
              <div class="pocketMetricLegend"><span class="metricProj ${selectedMode === "net" ? "activeMetric" : ""}">Proj. free<br>to spend</span><span class="${selectedMode === "base" ? "activeMetric" : ""}">Base</span></div>
              <div class="r"><span class="pocketNetValue${netThresholdClass}">${fmtMoney(pocketNet)}</span><span class="pocketSlash">/</span><span class="pocketTot pocketBaseValue${baseThresholdClass}">${fmtMoney(pp.pocketBase)}</span></div>
              <div class="pocketMeta">spent <span class="${pocketSpentOver ? 'overSpent' : ''}">${fmtMoney(pocketSpent)}</span></div>
            </div>
`;

          body.appendChild(item);
          // Re-open inline breakdown after re-render (mobile/desktop)
          if(thresholdLow && state.ui && state.ui.pocketExpandedKey === item.dataset.pk){
            expandPocketItemInline(item, pctx, true);
          }

      }

      if(body.children.length === 0){
        const empty = document.createElement("div");
        empty.className = "muted";
        empty.textContent = "No paydays found for current/next month.";
        body.appendChild(empty);
      }

      return wrap;
    }

        if(act === "delOI"){
          const id = btn.dataset.id;
          const list = Array.isArray(state.settings.otherIncomes) ? state.settings.otherIncomes : [];
