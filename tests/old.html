<!doctype html>
<!-- BudgetGraphColorsFixedOnCurrent: Graph bar colors now use category spending budget, not pocket base. -->
<!-- TrackSpendDateEasternTodayFixed: Track Spending date now defaults to today in America/New_York instead of reusing the last saved draft date. -->
<!-- MobileGraphDetailsCompact: selected graph details use compact rows and category totals. -->
<!-- PayPeriodDateFixed: Track Spending active pay period follows the Date box/current day instead of the newest old spending log. -->
<!-- SyncBaseReappearsFixed: Sync base returns after changing Savings month or Viewed month again. Based on SyncBaseButtonVisible. -->
<!-- SyncBaseButtonVisible: Sync base button/warnings show whenever Savings month differs from viewed month; Debt remains in ledger plan math. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bills Account Planner - Pay Period Fixed</title>
  <style>

    :root{
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
      --radius: 14px;

      --fs-0: 13px;
      --fs-1: 15px;
      --fs-2: 18px;
      --fs-3: 24px;

      --line: 1px;

      --bg: #f6f8fc;
      --panel: #ffffff;
      --panel2: #fbfcff;
      --text: #0f172a;
      --muted: #58657a;
      --border: #dbe3ef;
      --border2: #e6edf7;
      --shadow: 0 1px 0 rgba(15,23,42,.04);

      --blue: #2563eb;
      --blueSoft: rgba(37,99,235,.10);

      --green: #16a34a;
      --red: #dc2626;

      --badgeBg: #eef2ff;
      --badgeText: #1e40af;

      --rowHover: #f1f5ff;

      /* UPDATED (Today highlight = orange) */
      --rowToday: rgba(245,158,11,.22);
      --rowNearToday: rgba(37,99,235,0.14);

      
      --todayBorder: rgba(245,158,11,0.72);
      --nearTodayBorder: rgba(37,99,235,0.72);
--inputBg: #ffffff;
      --inputText: #0f172a;
      --inputBorder: #cfd9ea;

      --toastBg: #0f172a;
      --toastText: #ffffff;
      --toastBorder: rgba(255,255,255,.15);

      --chipBg: rgba(37,99,235,.10);
      --chipText: #1e40af;
    }

    html[data-theme="dark"]{
      --bg: #0b1220;
      --panel: #0f1a2e;
      --panel2: #0d172b;
      --text: #e6edf7;
      --muted: #a9b7cf;
      --border: rgba(255,255,255,.10);
      --border2: rgba(255,255,255,.08);
      --shadow: none;

      --blue: #60a5fa;
      --blueSoft: rgba(96,165,250,.14);

      --green: #22c55e;
      --red: #ef4444;

      --badgeBg: rgba(96,165,250,.14);
      --badgeText: #cfe6ff;

      --rowHover: rgba(255,255,255,.06);

      /* UPDATED (Today highlight = orange) */
      --rowToday: rgba(245,158,11,.22);
      --rowNearToday: rgba(96,165,250,0.16);

      
      --todayBorder: rgba(251,146,60,0.78);
      --nearTodayBorder: rgba(96,165,250,0.85);
--inputBg: rgba(255,255,255,.06);
      --inputText: #e6edf7;
      --inputBorder: rgba(255,255,255,.14);

      --toastBg: #0b1220;
      --toastText: #e6edf7;
      --toastBorder: rgba(255,255,255,.14);

      --chipBg: rgba(96,165,250,.14);
      --chipText: #cfe6ff;
    }

    html[data-theme="neon"]{
      --bg: #050014;
      --panel: #0b0622;
      --panel2: #070319;
      --text: #f6f7ff;
      --muted: #b9c3ff;
      --border: rgba(0,229,255,.18);
      --border2: rgba(0,229,255,.12);
      --shadow: none;

      --blue: #00e5ff;
      --blueSoft: rgba(0,229,255,.16);

      --green: #39ff14;
      --red: #ff3d8b;

      --badgeBg: rgba(0,229,255,.12);
      --badgeText: #c7fbff;

      --rowHover: rgba(255,255,255,.07);

      /* Today highlight */
      --rowToday: rgba(255,196,0,.22);
      --rowNearToday: rgba(0,229,255,0.18);

      --todayBorder: rgba(255,196,0,.80);
      --nearTodayBorder: rgba(0,229,255,.90);

      --inputBg: rgba(255,255,255,.06);
      --inputText: #f6f7ff;
      --inputBorder: rgba(0,229,255,.22);

      --toastBg: #050014;
      --toastText: #f6f7ff;
      --toastBorder: rgba(0,229,255,.22);

      --chipBg: rgba(0,229,255,.14);
      --chipText: #c7fbff;
    }


    html[data-theme="aurora"]{
      /* STELLAR RIFT (animated holographic aurora + scanlines) */
      --bg: #050014;

      --panel: rgba(10, 12, 26, .58);
      --panel2: rgba(10, 12, 26, .38);

      --text: #f2f6ff;
      --muted: rgba(225,236,255,.78);

      --border: rgba(255,255,255,.14);
      --border2: rgba(255,255,255,.10);

      --shadow: 0 18px 60px rgba(0,0,0,.45);

      --blue: #00e5ff;
      --blueSoft: rgba(0,229,255,.18);

      --green: #2eff8a;
      --red: #ff4fd8;

      --badgeBg: rgba(0,229,255,.16);
      --badgeText: #d7fbff;

      --rowHover: rgba(255,255,255,.06);

      /* Today highlight */
      --rowToday: rgba(255,149,0,.26);
      --rowNearToday: rgba(0,229,255,.18);

      --todayBorder: rgba(255,149,0,.90);
      --nearTodayBorder: rgba(0,229,255,.95);

      --inputBg: rgba(255,255,255,.07);
      --inputText: #f2f6ff;
      --inputBorder: rgba(255,255,255,.18);

      --toastBg: rgba(10, 12, 26, .92);
      --toastText: #f2f6ff;
      --toastBorder: rgba(255,255,255,.16);

      --chipBg: rgba(0,229,255,.18);
      --chipText: #d7fbff;
    }


    /* Aurora: make dropdown options solid (cleaner than transparent on glass) */
    html[data-theme="aurora"] select option{ background: #0b1220; color: #e8eefc; }

    /* Aurora WOW mode */
    html[data-theme="aurora"] body{
      position: relative;
      background-color: #050014;
      background-image:
        radial-gradient(1100px circle at 12% 18%, rgba(0,229,255,.22), transparent 55%),
        radial-gradient(900px circle at 88% 14%, rgba(255,79,216,.18), transparent 50%),
        radial-gradient(1000px circle at 62% 92%, rgba(46,255,138,.14), transparent 52%),
        conic-gradient(from 180deg at 50% 50%,
          rgba(0,229,255,.12),
          rgba(255,79,216,.10),
          rgba(46,255,138,.10),
          rgba(255,166,0,.10),
          rgba(0,229,255,.12)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 4px);
      background-size: 160% 160%, 180% 180%, 170% 170%, 220% 220%, auto;
      background-position: 0% 0%, 100% 0%, 0% 100%, 50% 50%, 0 0;
      background-attachment: fixed;
      animation: auroraDrift 16s ease-in-out infinite alternate;
      filter: saturate(1.25) contrast(1.12);
      overflow-x: hidden;
    }

    html[data-theme="aurora"] .wrap{ position: relative; z-index: 1; }

    html[data-theme="aurora"] .brand h1{
      text-shadow:
        0 0 18px rgba(0,229,255,.25),
        0 0 34px rgba(255,79,216,.18);
    }

    html[data-theme="aurora"] .panel,
    html[data-theme="aurora"] .card,
    html[data-theme="aurora"] .seg,
    html[data-theme="aurora"] .tableWrap{
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      box-shadow:
        0 18px 55px rgba(0,0,0,.45),
        0 0 0 1px rgba(255,255,255,.10),
        0 0 28px rgba(0,229,255,.08),
        0 0 26px rgba(255,79,216,.06);
    }

    html[data-theme="aurora"] .panelHeader{
      background:
        linear-gradient(90deg,
          rgba(0,229,255,.12),
          rgba(255,79,216,.10),
          rgba(46,255,138,.08));
    }

    html[data-theme="aurora"] .card .v{
      text-shadow:
        0 0 18px rgba(0,229,255,.10),
        0 0 12px rgba(255,79,216,.08);
    }

    html[data-theme="aurora"] .btn{
      background:
        linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.04)),
        radial-gradient(120px circle at 20% 20%, rgba(0,229,255,.18), transparent 60%),
        radial-gradient(140px circle at 80% 20%, rgba(255,79,216,.14), transparent 60%),
        rgba(10,12,26,.52);
      border-color: rgba(255,255,255,.16);
      box-shadow:
        0 14px 40px rgba(0,0,0,.42),
        0 0 0 1px rgba(255,255,255,.10),
        0 0 24px rgba(0,229,255,.12);
      transition: transform .12s ease, filter .12s ease, box-shadow .18s ease;
    }

    html[data-theme="aurora"] .btn:hover{
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow:
        0 18px 55px rgba(0,0,0,.50),
        0 0 0 1px rgba(255,255,255,.14),
        0 0 34px rgba(0,229,255,.16),
        0 0 26px rgba(255,79,216,.12);
    }

    html[data-theme="aurora"] .btn.primary{
      background:
        linear-gradient(135deg, rgba(0,229,255,.20), rgba(255,79,216,.14)),
        rgba(10,12,26,.48);
      border-color: color-mix(in srgb, var(--blue) 70%, rgba(255,255,255,.18));
      box-shadow:
        0 18px 55px rgba(0,0,0,.50),
        0 0 40px rgba(0,229,255,.18),
        0 0 26px rgba(255,79,216,.14);
    }

    html[data-theme="aurora"] input:focus,
    html[data-theme="aurora"] select:focus,
    html[data-theme="aurora"] textarea:focus{
      box-shadow:
        0 0 0 3px rgba(0,229,255,.20),
        0 0 22px rgba(255,79,216,.12);
    }

    @keyframes auroraDrift{
      0%{ background-position: 0% 0%, 100% 0%, 0% 100%, 50% 50%, 0 0; }
      100%{ background-position: 100% 35%, 0% 100%, 100% 65%, 50% 0%, 0 0; }
    }



    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: var(--fs-1);
      overflow-x: hidden;
    }

    .wrap{
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 18px 90px;
    }

    /* ===== Header ===== */
    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom: 14px;
    }
    .brand h1{
      margin:0;
      font-size: var(--fs-3);
      letter-spacing: -0.02em;
      font-weight: 760;
    }
    .controls{
      display:flex;
      gap:10px;
      align-items:flex-end;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .field{
      display:flex;
      align-items:center;
      gap:10px;
      background: var(--panel);
      border: var(--line) solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      box-shadow: var(--shadow);
    }
    .field label{
      font-size: var(--fs-0);
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .02em;
    }
    input, select, textarea{
      font-family: var(--font);
      font-size: var(--fs-1);
      background: var(--inputBg);
      color: var(--inputText);
      border: var(--line) solid var(--inputBorder);
      border-radius: 10px;
      padding: 8px 10px;
      outline: none;
    }
    textarea{ resize: vertical; min-height: 42px; }
    input:focus, select:focus, textarea:focus{
      border-color: color-mix(in srgb, var(--blue) 60%, var(--inputBorder));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent);
    }
    select{ padding-right: 28px; }

    .btn{
      cursor:pointer;
      border: var(--line) solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 12px;
      font-weight: 720;
      font-size: var(--fs-0);
      box-shadow: var(--shadow);
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
    }
    .btn:hover{ filter: brightness(1.02); }
    .btn.primary{
      border-color: color-mix(in srgb, var(--blue) 55%, var(--border));
      background: color-mix(in srgb, var(--blue) 10%, var(--panel));
    }
    .btn.danger{
      border-color: color-mix(in srgb, var(--red) 45%, var(--border));
    }
    .btn .dot{
      width:10px;height:10px;border-radius:999px;
      background: color-mix(in srgb, var(--blue) 78%, transparent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 18%, transparent);
    }

    /* ===== Dashboard cards ===== */
    .cards{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 10px 0 14px;
    }
    @media (max-width: 980px){
      .cards{ grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 700px){
      .graphRowTop{
        flex-direction:column;
        align-items:stretch;
      }
      .graphRowControls{
        width:100%;
        justify-content:flex-start;
      }
      .graphRangeSelect{
        width:100%;
        max-width:none;
      }
    }
    @media (max-width: 560px){
      .cards{ grid-template-columns: repeat(2, 1fr); }
    }

    .card{
      background: var(--panel);
      border: var(--line) solid var(--border);
      border-radius: var(--radius);
      padding: 14px 14px 12px;
      box-shadow: var(--shadow);
      min-height: 88px;
    }
    .card .k{
      font-size: var(--fs-0);
      color: var(--muted);
      font-weight: 720;
      margin-bottom: 6px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .card .v{
      font-size: var(--fs-2);
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .card .s{
      margin-top: 6px;
      color: var(--muted);
      font-size: var(--fs-0);
      font-weight: 600;
      line-height: 1.25;
    }

    /* ===== Tabs ===== */
    .tabs{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap: 10px;
      margin: 10px 0 12px;
      flex-wrap: wrap;
    }
    .tabstrip{
      display:flex;
      gap: 4px;
      background: var(--panel);
      border: var(--line) solid var(--border);
      border-radius: 999px;
      padding: 4px;
      box-shadow: var(--shadow);
      flex: 0 0 auto;
      max-width: 100%;
    }
    .tab{
      cursor:pointer;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 9px 14px;
      border-radius: 999px;
      font-weight: 780;
      font-size: var(--fs-0);
    }
    .tab.active{
      background: var(--text);
      color: var(--bg);
    }

    .tabActions{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
      margin-left: auto;
    }


    /* Ensure tabs never get clipped on smaller desktop widths */
    @media (max-width: 760px){
      .tabstrip{ flex-wrap: wrap; }
    }
    /* ===== Segmented (Cards/Table) ===== */
    .seg{
      display:inline-flex;
      border: var(--line) solid var(--border);
      background: var(--panel);
      border-radius: 999px;
      padding: 4px;
      box-shadow: var(--shadow);
      gap:4px;
    }
    .segBtn{
      cursor:pointer;
      border:none;
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 780;
      font-size: var(--fs-0);
    }
    .segBtn.active{
      background: var(--text);
      color: var(--bg);
    }

    /* ===== Panels ===== */
    .panel{
      background: var(--panel);
      border: var(--line) solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panelHeader{
      padding: 14px 14px 10px;
      border-bottom: var(--line) solid var(--border2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .panelHeader h2{
      margin:0;
      font-size: 18px;
      letter-spacing: -0.01em;
      font-weight: 780;
    }
    .panelBody{ padding: 12px 14px 14px; }

    /* ===== Toggle ===== */
    .toggle{
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-size: var(--fs-0);
      color: var(--muted);
      font-weight: 720;
      user-select:none;
    }
    .switch{
      width: 46px;
      height: 26px;
      background: rgba(255,255,255,.12);
      border-radius: 999px;
      position: relative;
      cursor:pointer;
      border: var(--line) solid var(--border);
      flex: 0 0 auto;
    }
    html[data-theme="light"] .switch{ background: #cbd5e1; }
    .switch::after{
      content:"";
      position:absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #ffffff;
      border-radius: 999px;
      transition: transform .18s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,.18);
    }
    .switch.on{
      background: color-mix(in srgb, var(--blue) 55%, rgba(255,255,255,.12));
    }
    .switch.on::after{ transform: translateX(20px); }

    /* ===== Tables ===== */
    .tableWrap{
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 12px;
      border: var(--line) solid var(--border2);
      background: color-mix(in srgb, var(--panel2) 60%, transparent);
    }
    table{
      width:100%;
      border-collapse: collapse;
      font-size: var(--fs-1);
      background: transparent;
    }
    th, td{
      border-bottom: var(--line) solid var(--border2);
      padding: 12px 10px;
      text-align:left;
      vertical-align:middle;
      background: transparent;
    }
    th{
      font-size: var(--fs-0);
      color: var(--muted);
      font-weight: 820;
      background: var(--panel2);
      position: sticky;
      top: 0;
      z-index: 2;
      text-transform: uppercase;
      letter-spacing: .02em;
      white-space: nowrap;
    }
    tr:hover td{ background: var(--rowHover); }
    tr.today td{ background: var(--rowToday); }
    tr.nearToday td{ background: var(--rowNearToday); }
    tr.proxyToday td{ box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--blue) 65%, transparent); }

    .dateCell{
      min-width: 250px;
      padding-left: 14px;
      white-space: nowrap;
    }
    .dateTop{
      display:flex;
      align-items:center;
      gap:10px;
      justify-content:space-between;
    }
    .dateText{
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .dateText .dow{
      font-weight: 820;
      letter-spacing: -0.01em;
    }
    .dateText .iso{
      color: var(--muted);
      font-size: var(--fs-0);
      font-weight: 650;
    }

    .badges{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
      padding-right: 6px;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size: 12px;
      font-weight: 820;
      padding: 6px 10px;
      border-radius: 999px;
      border: var(--line) solid var(--border);
      background: var(--badgeBg);
      color: var(--badgeText);
      white-space: nowrap;
    }
    .badge.payday{
      background: color-mix(in srgb, var(--green) 18%, transparent);
      color: color-mix(in srgb, var(--green) 82%, var(--text));
      border-color: color-mix(in srgb, var(--green) 35%, var(--border));
    }
    .badge.prevnext, .badge.nextmonth{
      background: color-mix(in srgb, var(--blue) 16%, transparent);
      color: color-mix(in srgb, var(--blue) 82%, var(--text));
      border-color: color-mix(in srgb, var(--blue) 35%, var(--border));
    }

    .num{
      font-variant-numeric: tabular-nums;
      font-weight: 720;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .pos{ color: var(--green); }
    .neg{ color: var(--red); }
    .muted{ color: var(--muted); font-weight: 650; }
    .note{
      color: var(--text);
      font-weight: 650;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 520px;
      display:inline-block;
      vertical-align: bottom;
    }
    .right{ text-align:right; }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: var(--line) solid var(--border);
      background: var(--panel2);
      color: var(--muted);
      font-size: var(--fs-0);
      font-weight: 820;
      letter-spacing: .02em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ===== Ledger cards (mobile) ===== */
    .cardsWrap{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 820px){
      .cardsWrap{ grid-template-columns: 1fr; }
    }
    .dayCard{
      background: var(--panel2);
      border: var(--line) solid var(--border2);
      border-radius: var(--radius);
      padding: 12px 12px;
      box-shadow: var(--shadow);
    }
    .dayCard:hover{ background: color-mix(in srgb, var(--rowHover) 65%, var(--panel2)); }
    .dayCard.today{ background: var(--rowToday); }
    .dayCard.nearToday{ background: var(--rowNearToday); }
    .dayCard.proxyToday{ box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--blue) 65%, transparent); }

    .dayCardTop{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      margin-bottom: 10px;
    }
    .dayCardTitle{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width: 0;
    }
    .dayCardTitle .dow{ font-weight: 840; }
    .dayCardTitle .iso{ font-size: var(--fs-0); color: var(--muted); font-weight: 650; }

    .kvGrid{
      display:grid;

  <script>

    /***********************
     * Date helpers (UTC)
     ***********************/
    const DAY_MS = 86400000;


    // App timezone (used for "today"/current month and midnight sync)
    // Eastern Time (US & Canada)
    const APP_TZ = "America/New_York";

    function _tzParts(date, tz){
      try{
        const fmt = new Intl.DateTimeFormat("en-US", {
          timeZone: tz,
          hour12: false,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
        const parts = fmt.formatToParts(date);
        const out = {};
        for(const p of parts){
          if(p.type !== "literal") out[p.type] = p.value;
        }
        return out; // {year, month, day, hour, minute, second}
      }catch(e){
        // Fallback: device local time
        const d = date;
        return {
          year: String(d.getFullYear()),
          month: String(d.getMonth()+1).padStart(2,"0"),
          day: String(d.getDate()).padStart(2,"0"),
          hour: String(d.getHours()).padStart(2,"0"),
          minute: String(d.getMinutes()).padStart(2,"0"),
          second: String(d.getSeconds()).padStart(2,"0"),
        };
      }
    }

    function todayIsoInTZ(tz = APP_TZ){
      const p = _tzParts(new Date(), tz);
      return `${p.year}-${p.month}-${p.day}`;
    }
    function currentMonthKeyInTZ(tz = APP_TZ){
      const p = _tzParts(new Date(), tz);
      return `${p.year}-${p.month}`;
    }
    function _tzOffsetToUTC(date, tz = APP_TZ){
      // returns ms to add to local time to get UTC at this instant (UTC - local)
      const p = _tzParts(date, tz);
      const asUTC = Date.UTC(+p.year, +p.month-1, +p.day, +p.hour, +p.minute, +p.second);
      return date.getTime() - asUTC;
    }
