        try{ saveState(); }catch(_){ }
      }

      function debtIsoFromMs(ms){
        if(!Number.isFinite(ms)) return todayIsoInTZ(APP_TZ);
        return new Date(ms).toISOString().slice(0,10);
      }

      function debtNextDueIsoAfter(fromIso, dueDay){
        const from = normalizeISODateLoose(fromIso || "") || todayIsoInTZ(APP_TZ);
        const fromMs = parseISOToMs(from);
        if(!Number.isFinite(fromMs)) return todayIsoInTZ(APP_TZ);
        const dt = new Date(fromMs);
        let y = dt.getUTCFullYear();
        let m = dt.getUTCMonth() + 1;
        const dom = clampInt(dueDay || 1, 1, 31);
        const candidateDay = Math.min(dom, daysInMonth(y, m));
        let candidate = msUTC(y, m, candidateDay);
        if(candidate <= fromMs){
          m += 1;
          if(m > 12){ m = 1; y += 1; }
          const nextDay = Math.min(dom, daysInMonth(y, m));
          candidate = msUTC(y, m, nextDay);
        }
        return debtIsoFromMs(candidate);
      }

      function debtLastPaymentDate(d){
        const list = Array.isArray(d?.payments) ? d.payments.filter(p=>Number(p?.amount || 0) > 0) : [];
        if(!list.length) return "";
        return String([...list].sort(debtPaymentSortAsc).slice(-1)[0]?.date || "");
      }

      function debtPayoffCalc(d){
        const balance0 = Math.max(0, Number(d?.balance || 0));
        const apr = Math.max(0, Number(d?.apr || 0));
        const payment = Math.max(0, Number(d?.minPayment || 0) + Number(d?.extraPayment || 0));
        if(balance0 <= 0) return { months:0, interest:0, payment, stuck:false };
        if(payment <= 0) return { months:Infinity, interest:0, payment, stuck:true };

        const startIso = normalizeISODateLoose(d?.interestStartDate || "") || "";
        if(startIso){
          let bal = balance0;
          let interest = 0;
          let months = 0;
          let fromIso = normalizeISODateLoose(debtLastPaymentDate(d) || startIso) || todayIsoInTZ(APP_TZ);
          for(let i=0; i<600 && bal > 0.009; i++){
            const dueIso = debtNextDueIsoAfter(fromIso, d?.dueDay || 1);
            const days = debtDailyInterestDays(fromIso, dueIso);
            const safeDays = Number.isFinite(days) ? days : 30;
            const int = round2(bal * (apr / 100) / 365 * safeDays);
            if(payment <= int && bal > payment){
              return { months:Infinity, interest:round2(interest + int), payment, stuck:true, daily:true };
            }
            interest = round2(interest + int);
            bal = round2(Math.max(0, bal + int - payment));
            months++;
            fromIso = dueIso;
          }
          return { months: bal > 0.009 ? Infinity : months, interest, payment, stuck: bal > 0.009, daily:true };
        }

        const r = (apr / 100) / 12;
        let bal = balance0;
        let interest = 0;
        let months = 0;
        for(let i=0; i<600 && bal > 0.009; i++){
          const int = round2(bal * r);
          if(payment <= int && bal > payment){
            return { months:Infinity, interest:round2(interest + int), payment, stuck:true, daily:false };
          }
          interest = round2(interest + int);
          bal = round2(Math.max(0, bal + int - payment));
          months++;
        }
        return { months: bal > 0.009 ? Infinity : months, interest, payment, stuck: bal > 0.009, daily:false };
      }

      function debtPaymentPrincipal(p){
        if(!p) return 0;
        const principal = Number(p.principal || 0);
        if(principal > 0) return round2(principal);
        const amount = Number(p.amount || 0);
        const interest = Number(p.interest || 0);
        if(interest > 0) return round2(Math.max(0, amount - interest));
        return round2(Math.max(0, amount));
      }

      function debtPaymentInterest(p){
        if(!p) return 0;
        const interest = Number(p.interest || 0);
        if(interest > 0) return round2(interest);
        const amount = Number(p.amount || 0);
        const principal = Number(p.principal || 0);
        if(principal > 0) return round2(Math.max(0, amount - principal));
        return 0;
      }

      function debtPrincipalPaidTotal(d){
        return round2((Array.isArray(d?.payments) ? d.payments : []).reduce((sum,p)=>sum + debtPaymentPrincipal(p), 0));
      }

      function debtDailyInterestDays(fromIso, toIso){
        const from = normalizeISODateLoose(fromIso || "");
        const to = normalizeISODateLoose(toIso || "");
        if(!from || !to) return null;
        const fromMs = parseISOToMs(from);
        const toMs = parseISOToMs(to);
        if(!Number.isFinite(fromMs) || !Number.isFinite(toMs)) return null;
        return Math.max(0, Math.round((toMs - fromMs) / DAY_MS));
      }

      function debtPaymentSplit(d, amount, balanceOverride, paymentDate, interestFromDate){
        const balance = Math.max(0, round2(Number.isFinite(Number(balanceOverride)) ? Number(balanceOverride) : Number(d?.balance || 0)));
        const apr = Math.max(0, Number(d?.apr || 0));
        const requested = Math.max(0, round2(Number(amount || 0)));
        if(balance <= 0 || requested <= 0){
          return { amount:0, interest:0, principal:0, balanceBefore:balance, balanceAfter:balance };
        }

        const dailyMode = !!normalizeISODateLoose(d?.interestStartDate || "");
        const days = dailyMode ? debtDailyInterestDays(interestFromDate || d?.interestStartDate || "", paymentDate || todayIsoInTZ(APP_TZ)) : null;
        const interestDue = (dailyMode && Number.isFinite(days))
          ? round2(balance * (apr / 100) / 365 * days)
          : round2(balance * ((apr / 100) / 12));

        const paid = round2(Math.min(requested, round2(balance + interestDue)));
        const interest = round2(Math.min(interestDue, paid));
        const principal = round2(Math.min(balance, Math.max(0, paid - interest)));
        const balanceAfter = round2(Math.max(0, balance - principal));
        return { amount:paid, interest, principal, balanceBefore:balance, balanceAfter, interestDays: dailyMode ? (Number.isFinite(days) ? days : 0) : null };
      }

      function debtPaymentSortAsc(a,b){
        const ad = String(a?.date || "");
        const bd = String(b?.date || "");
        if(ad !== bd) return ad.localeCompare(bd);
        const ac = String(a?.createdAt || "");
        const bc = String(b?.createdAt || "");
        if(ac !== bc) return ac.localeCompare(bc);
        return String(a?.id || "").localeCompare(String(b?.id || ""));
      }

      function recalcDebtFromPayments(d, startBalance){
        if(!d) return;
        const payments = Array.isArray(d.payments) ? d.payments : [];
        const fallbackStart = round2(Math.max(Number(d.originalBalance || 0), Number(d.balance || 0) + payments.reduce((sum,p)=>sum + Math.max(debtPaymentPrincipal(p), Number(p?.amount || 0)), 0), Number(d.balance || 0)));
        let bal = Math.max(0, round2(Number.isFinite(Number(startBalance)) ? Number(startBalance) : fallbackStart));
        d.originalBalance = Math.max(Number(d.originalBalance || 0), bal);
        let interestFromDate = normalizeISODateLoose(d.interestStartDate || "") || "";
        [...payments].sort(debtPaymentSortAsc).forEach(p=>{
          const payDate = normalizeISODateLoose(p.date || "") || todayIsoInTZ(APP_TZ);
          const split = debtPaymentSplit(d, Number(p.amount || 0), bal, payDate, interestFromDate);
          p.date = payDate;
          p.amount = split.amount;
          p.interest = split.interest;
          p.principal = split.principal;
          p.balanceBefore = split.balanceBefore;
          p.balanceAfter = split.balanceAfter;
          if(Number.isFinite(split.interestDays)) p.interestDays = split.interestDays;
          bal = split.balanceAfter;
          if(interestFromDate) interestFromDate = payDate;
        });
        d.balance = round2(bal);
      }

      if(state.ui.debtInterestVersion !== 117){
        debts.forEach(d=>{
          if(!d) return;
          const needsSplit = (Array.isArray(d.payments) ? d.payments : []).some(p=>p && Number(p.amount || 0) > 0 && !(Number(p.principal || 0) > 0 || Number(p.interest || 0) > 0));
          if(needsSplit) recalcDebtFromPayments(d);
        });
        state.ui.debtInterestVersion = 117;
        try{ saveState(); }catch(_){ }
      }

      function debtMonthsLabel(months){
        if(!Number.isFinite(months)) return "Payment too low";
        if(months <= 0) return "Paid off";
        const y = Math.floor(months / 12);
        const m = months % 12;
        const base = y && m ? `${y}y ${m}m` : (y ? `${y}y` : `${m}m`);
        return `${base} left`;
      }

      function debtOrderedList(){
        const mode = state.ui.debtStrategy === "snowball" ? "snowball" : (state.ui.debtStrategy === "custom" ? "custom" : "avalanche");
        const active = debts.filter(d=>Number(d.balance || 0) > 0 || d.collapsed === false);
        return [...active].sort((a,b)=>{
          if(mode === "snowball"){
            const av = Number(a.balance || 0), bv = Number(b.balance || 0);
            if(av !== bv) return av - bv;
            return Number(b.apr || 0) - Number(a.apr || 0);
          }
          if(mode === "custom"){
            const ap = Number(a.priority || 999), bp = Number(b.priority || 999);
            if(ap !== bp) return ap - bp;
            return String(a.name || "").localeCompare(String(b.name || ""), undefined, { sensitivity:"base", numeric:true });
          }
          const ar = Number(a.apr || 0), br = Number(b.apr || 0);
          if(ar !== br) return br - ar;
          return Number(a.balance || 0) - Number(b.balance || 0);
        });
      }

      function debtPaymentTotal(d){
        return round2((Array.isArray(d?.payments) ? d.payments : []).reduce((sum,p)=>sum + Number(p?.amount || 0), 0));
      }

      function debtPaidSoFar(d){
        const original = Math.max(Number(d?.originalBalance || 0), Number(d?.balance || 0), 0);
        return Math.max(0, round2(original - Number(d?.balance || 0)));
      }

      function debtLastPaymentLabel(d){
        const list = Array.isArray(d?.payments) ? d.payments.filter(p=>Number(p?.amount || 0) > 0) : [];
        if(!list.length) return "None yet";
        const last = list[list.length - 1];
        return `${fmtMoney(Number(last.amount || 0))} on ${String(last.date || "").slice(5) || "today"}`;
      }

      function debtSummary(){
        const all = debts.filter(d=>Number(d.originalBalance || 0) > 0 || Number(d.balance || 0) > 0);
        const active = debts.filter(d=>Number(d.balance || 0) > 0);
        const totalBalance = round2(active.reduce((sum,d)=>sum + Number(d.balance || 0), 0));
        const totalOriginal = round2(all.reduce((sum,d)=>sum + Math.max(Number(d.originalBalance || 0), Number(d.balance || 0), 0), 0));
        const paidSoFar = round2(all.reduce((sum,d)=>sum + debtPaidSoFar(d), 0));
        const monthlyMin = round2(active.reduce((sum,d)=>sum + Number(d.minPayment || 0), 0));
        const monthlyExtra = round2(active.reduce((sum,d)=>sum + Number(d.extraPayment || 0), 0));
        const calcs = active.map(d=>debtPayoffCalc(d));
        const longestMonths = calcs.reduce((max,c)=> Math.max(max, Number.isFinite(c.months) ? c.months : Infinity), 0);
        const interest = round2(calcs.reduce((sum,c)=> sum + (Number.isFinite(c.interest) ? c.interest : 0), 0));
        return { active, totalBalance, totalOriginal, paidSoFar, monthlyMin, monthlyExtra, monthlyTotal: round2(monthlyMin + monthlyExtra), longestMonths, interest };
      }

      function debtPaymentLogs(){
        const rows = [];
        (Array.isArray(debts) ? debts : []).forEach(d=>{
          (Array.isArray(d?.payments) ? d.payments : []).forEach(p=>{
            if(!p || Number(p.amount || 0) <= 0) return;
            rows.push({ debt:d, payment:p });
          });
        });
        return rows.sort((a,b)=>{
          const bd = String(b.payment.date || "").localeCompare(String(a.payment.date || ""));
          if(bd) return bd;
          return String(b.payment.id || "").localeCompare(String(a.payment.id || ""));
        });
      }

                        </div>
                      </div>
                    </details>
                  `;

      function initBillsTableResizers(){
        const table = wrap.querySelector(".billTable");
        if(!table) return;
        const cols = table.querySelectorAll("colgroup col");
        const ths = table.querySelectorAll("thead th[data-col]");
        if(!cols.length || !ths.length) return;

        // Apply saved widths (desktop only)
        try{
          const saved = JSON.parse(localStorage.getItem("billTableColWidths_v6")||"null");
          if(Array.isArray(saved) && saved.length === cols.length){
            saved.forEach((w,i)=>{
              if(typeof w === "number" && isFinite(w) && w > 40){
                cols[i].style.width = w + "px";
              }
            });
            table.style.tableLayout = "fixed";
          }
        }catch(e){}

        // If no inline widths yet, lock current widths to px to make resizing stable
        const hasInline = Array.from(cols).some(c=>String(c.style.width||"").includes("px"));
        if(!hasInline){
          const rects = Array.from(cols).map((c,i)=>{
            const th = ths[i];
            return th ? th.getBoundingClientRect().width : null;
          });
          rects.forEach((w,i)=>{
            if(w && w > 40) cols[i].style.width = Math.round(w) + "px";
          });
          table.style.tableLayout = "fixed";
        }

        const fixedDeleteColWidth = 72;
        if(cols[cols.length - 1]){
          cols[cols.length - 1].style.width = fixedDeleteColWidth + "px";
          cols[cols.length - 1].style.minWidth = fixedDeleteColWidth + "px";
        }

        const save = ()=>{
          const arr = Array.from(cols).map((c, idx)=>{
            if(idx === cols.length - 1) return fixedDeleteColWidth;
            const w = parseFloat(c.style.width||"");
            return (isFinite(w) ? Math.round(w) : null);
          });
          localStorage.setItem("billTableColWidths_v6", JSON.stringify(arr));
        };

        ths.forEach((th, i)=>{
          const handle = th.querySelector(".colResizer");
          if(!handle) return;
          if(handle.dataset.bound === "1") return;
          handle.dataset.bound = "1";

          handle.addEventListener("dblclick", ()=>{
            // Reset: clear saved widths and let CSS defaults apply
            localStorage.removeItem("billTableColWidths_v6");
            cols.forEach(c=>{ c.style.width=""; });
            if(cols[cols.length - 1]) cols[cols.length - 1].style.width = fixedDeleteColWidth + "px";
            table.style.tableLayout = "fixed";
            render();
          });

          handle.addEventListener("mousedown", (ev)=>{
            ev.preventDefault();
            ev.stopPropagation();
            const startX = ev.clientX;
            const startW = parseFloat(cols[i].style.width||"") || th.getBoundingClientRect().width;
            const nextIdx = i+1;
            const nextW = (cols[nextIdx] ? (parseFloat(cols[nextIdx].style.width||"") || ths[nextIdx].getBoundingClientRect().width) : 0);
            const minW = 70;
            const nextMinW = (nextIdx === cols.length - 1) ? fixedDeleteColWidth : minW;

            const onMove = (mv)=>{
              const dx = mv.clientX - startX;
              let w1 = Math.max(minW, startW + dx);
              if(cols[nextIdx]){
                let w2 = Math.max(nextMinW, nextW - dx);
                cols[i].style.width = Math.round(w1) + "px";
                cols[nextIdx].style.width = Math.round(w2) + "px";
              }else{
                cols[i].style.width = Math.round(w1) + "px";
              }
              if(cols[cols.length - 1]) cols[cols.length - 1].style.width = fixedDeleteColWidth + "px";
            };
            const onUp = ()=>{
              document.removeEventListener("mousemove", onMove);
              document.removeEventListener("mouseup", onUp);
              save();
            };
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
          });
        });
      }

      function openGraphLongPressMenu(col, clientX, clientY){
        if(!col) return;
        const graphId = String(col.dataset.graphId || "");
        if(!graphId) return;
        const graphLabel = String(col.dataset.graphLabel || "this pay period");
        closeGraphLongPressMenu();
        col.classList.add("longPressActive");

        const menu = document.createElement("div");
        menu.id = "graphLongPressMenu";
        menu.className = "graphLongPressMenu";
        menu.innerHTML = `
          <div class="graphLongPressMenuTitle">${escapeHtml(graphLabel)}</div>
          <div class="graphLongPressMenuActions">
            <button type="button" class="btn danger" data-act="hide">Hide this graph</button>
            <button type="button" class="btn" data-act="cancel">Cancel</button>
          </div>
        `;
        document.body.appendChild(menu);

        const rect = menu.getBoundingClientRect();
        const pad = 12;
        const x = Math.min(Math.max(pad, Number(clientX || window.innerWidth / 2) - rect.width / 2), window.innerWidth - rect.width - pad);
        const y = Math.min(Math.max(pad, Number(clientY || window.innerHeight / 2) - rect.height - 10), window.innerHeight - rect.height - pad);
        menu.style.left = `${x}px`;
        menu.style.top = `${y}px`;

        menu.addEventListener("click", ev=>{
          const btn = ev.target.closest("button[data-act]");
          if(!btn) return;
          const act = btn.dataset.act;
          if(act === "hide"){
            state.ui = state.ui || {};
            const currentMode = String(state.ui.extraSpendGraphRange || "month");
            const customSource = currentMode === "last7" ? "last7" : (currentMode === "custom" ? (state.ui.extraSpendGraphCustomSource === "last7" ? "last7" : "month") : "month");
            if(currentMode !== "custom" || state.ui.extraSpendGraphCustomSource !== customSource){
              state.ui.extraSpendGraphHiddenIds = [];
            }
            if(!Array.isArray(state.ui.extraSpendGraphHiddenIds)) state.ui.extraSpendGraphHiddenIds = [];
            if(!state.ui.extraSpendGraphHiddenIds.map(x=>String(x)).includes(graphId)){
              state.ui.extraSpendGraphHiddenIds.push(graphId);
            }
            state.ui.extraSpendGraphCustomSource = customSource;
            state.ui.extraSpendGraphRange = "custom";
            if(String(state.ui.extraSpendGraphOpenId || "") === graphId) state.ui.extraSpendGraphOpenId = "";
            state.ui.extraSpendGraphAvgExpanded = false;
            saveState();
            closeGraphLongPressMenu();
            try{ quickToast("Graph hidden. Range set to Custom."); }catch(_){}
            render();
          }else{
            closeGraphLongPressMenu();
          }
        });

        setTimeout(()=>{
          const onOutside = (ev)=>{
            if(menu && !menu.contains(ev.target)) closeGraphLongPressMenu();
          };
          document.addEventListener("pointerdown", onOutside, {once:true});
        }, 0);
      }

      wrap.querySelectorAll(".graphCol[data-graph-id]").forEach(col=>{
        let pressTimer = null;
        let startX = 0;
        let startY = 0;
        let suppressClickUntil = 0;
        const clearPress = ()=>{
          if(pressTimer){
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        };
        col.addEventListener("pointerdown", ev=>{
          if(ev.button && ev.button !== 0) return;
          if(ev.pointerType === "mouse") return;
          startX = ev.clientX;
          startY = ev.clientY;
          clearPress();
          pressTimer = setTimeout(()=>{
            pressTimer = null;
            suppressClickUntil = Date.now() + 900;
            try{ if(col.setPointerCapture) col.setPointerCapture(ev.pointerId); }catch(_){}
            openGraphLongPressMenu(col, ev.clientX, ev.clientY);
          }, 650);
        });
        col.addEventListener("pointermove", ev=>{
          if(!pressTimer) return;
          const dx = Math.abs(ev.clientX - startX);
          const dy = Math.abs(ev.clientY - startY);
          if(dx > 12 || dy > 12) clearPress();
        });
        ["pointerup","pointercancel","pointerleave"].forEach(name=> col.addEventListener(name, clearPress));
        col.addEventListener("click", ev=>{
          if(Date.now() < suppressClickUntil) return;
          const graphId = String(col.dataset.graphId || "");
          if(!graphId) return;
          state.ui = state.ui || {};
          state.ui.extraSpendGraphOpenId = String(state.ui.extraSpendGraphOpenId || "") === graphId ? "" : graphId;
          state.ui.extraSpendGraphAvgExpanded = false;
          saveState();
          render();
        });
        col.addEventListener("contextmenu", ev=>{
          const coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
          if(!coarse) return;
          ev.preventDefault();
          clearPress();
          suppressClickUntil = Date.now() + 900;
          openGraphLongPressMenu(col, ev.clientX, ev.clientY);

      function bindDragSort(selector, dataAttr, key, enabled = true){
        if(!enabled) return;
        let draggedId = null;
        wrap.querySelectorAll(selector).forEach(node=>{
          const handle = node.querySelector(".dragHandle");
          const getId = ()=> node.getAttribute(dataAttr);
          const releaseArmedDrag = ()=>{ if(node) node.setAttribute("draggable", "false"); };
          if(handle){
            handle.addEventListener("mousedown", (ev)=>{
              ev.stopPropagation();
              draggedId = getId();
              node.setAttribute("draggable", "true");
            });
            handle.addEventListener("touchstart", (ev)=>{
              ev.stopPropagation();
              draggedId = getId();
              node.setAttribute("draggable", "true");
            }, {passive:true});
            handle.addEventListener("mouseup", releaseArmedDrag);
            handle.addEventListener("mouseleave", releaseArmedDrag);
            handle.addEventListener("touchend", releaseArmedDrag, {passive:true});
            handle.addEventListener("touchcancel", releaseArmedDrag, {passive:true});
          }
          node.addEventListener("dragstart", (ev)=>{
            if(!draggedId || draggedId !== getId()){
              ev.preventDefault();
              return;
            }
            node.classList.add("dragging");
            try{ ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", draggedId || ""); }catch(_){ }
          });
          node.addEventListener("dragend", ()=>{
            draggedId = null;
            releaseArmedDrag();
            wrap.querySelectorAll(selector).forEach(n=> { n.classList.remove("dragging", "dragOver"); n.setAttribute("draggable", "false"); });
          });
          node.addEventListener("dragover", (ev)=>{
            if(!draggedId) return;
            ev.preventDefault();
            if(getId() === draggedId) return;
            node.classList.add("dragOver");
            try{ ev.dataTransfer.dropEffect = "move"; }catch(_){ }
          });
          node.addEventListener("dragleave", ()=> node.classList.remove("dragOver"));
          node.addEventListener("drop", (ev)=>{
            ev.preventDefault();
            node.classList.remove("dragOver");
            const targetId = getId();
            if(moveIdInCustomOrder(key, draggedId, targetId)) render();
            else releaseArmedDrag();
          });
        });
      }

          const split = debtPaymentSplit(d, requested, currentBalance, payDate, interestFromDate);

          d.originalBalance = Math.max(Number(d.originalBalance || 0), currentBalance);
          if(!Array.isArray(d.payments)) d.payments = [];
          d.payments.push({ id:`p${Date.now()}`, date: payDate, amount: split.amount, principal: split.principal, interest: split.interest, interestDays: split.interestDays, balanceBefore: split.balanceBefore, balanceAfter: split.balanceAfter, note: "", createdAt: new Date().toISOString() });

            message: "Delete this spending log?",

      function previewMonthOccurrenceMsFromRule(rule){
        const safeRule = (rule && typeof rule === "object") ? rule : {};
        const mk = String(state.selectedMonth || currentLocalMonthKey() || "").trim() || currentLocalMonthKey();
        const fallbackMs = parseISOToMs(todayIsoInTZ(APP_TZ));
        const { y, m } = parseMonthKey(mk);
        const mm = String(m).padStart(2, "0");

        if(safeRule.type === "one_time" || safeRule.type === "biweekly"){
          const iso = normalizeISODateLoose(safeRule.anchor || "");
          return iso ? parseISOToMs(iso) : fallbackMs;
        }

        if(safeRule.type === "annual_md"){
          const iso = normalizeISODateLoose(safeRule.anchor || `${mk}-01`);
          if(!iso) return fallbackMs;
          const parts = iso.split("-");
          const anchorMonth = Math.max(1, Math.min(12, Number(parts[1] || m) || m));
          const anchorDay = Math.max(1, Number(parts[2] || 1) || 1);
          const dom = Math.min(anchorDay, daysInMonth(y, anchorMonth));
          return parseISOToMs(`${y}-${String(anchorMonth).padStart(2, "0")}-${String(dom).padStart(2, "0")}`);
        }

        if(safeRule.type === "monthly_dom"){
          const domRaw = Math.max(1, Number(safeRule.dom || 1) || 1);
          const dom = Math.min(domRaw, daysInMonth(y, m));
          return parseISOToMs(`${y}-${mm}-${String(dom).padStart(2, "0")}`);
        }

        if(safeRule.type === "weekly_dow"){
          const wantDow = clampInt(safeRule.dow ?? 1, 0, 6);
          const start = monthStartMs(mk);
          const end = monthEndMs(mk);
          const todayMs = fallbackMs;
          let firstMatch = null;
          for(let ms = start; ms <= end; ms = addDaysMs(ms, 1)){
            if(toDateObj(ms).dow !== wantDow) continue;
            if(firstMatch == null) firstMatch = ms;
            if(ms >= todayMs) return ms;
          }
          return firstMatch != null ? firstMatch : start;
        }

        if(safeRule.type === "perpay"){
          const paydays = getPaydaysForMonth(mk, state.settings);
          if(Array.isArray(paydays) && paydays.length){
            const todayMs = fallbackMs;
            return paydays.find(ms => ms >= todayMs) ?? paydays[0];
          }
          return monthStartMs(mk);
        }

        return fallbackMs;
      }

      function previewMsFromEditor(el){
        const billRow = el?.closest?.("[data-bill]");

        if(billRow){
          const id = billRow.getAttribute("data-bill");
          const b = state.bills.find(v => v.id === id);
          if(b) return previewMonthOccurrenceMsFromRule(ensureRule(b));
        }

        const extraRow = el?.closest?.("[data-extra]");
        if(extraRow){
          const id = extraRow.getAttribute("data-extra");
          const list = Array.isArray(state.extras) ? state.extras : [];
          const x = list.find(v => v.id === id);
          if(x) return previewMonthOccurrenceMsFromRule(ensureRule(x));
        }

        return parseISOToMs(todayIsoInTZ(APP_TZ));
      }

      function previewPocketWhileEditing(el){
        if(billsPreviewTimer) clearTimeout(billsPreviewTimer);
        billsPreviewTimer = setTimeout(()=>{
          const baseMonth = (state.settings.baseMonth || state.selectedMonth || currentLocalMonthKey()).trim();
          const viewMonth = (state.selectedMonth || currentLocalMonthKey()).trim();
          const horizon = Math.max(12, Number(state.settings?.savings?.timelineMonths || 6) + 2);
          const bi = monthIndex(baseMonth);
          const vi = monthIndex(viewMonth);

          let rangeStart = baseMonth;
          let rangeEnd = viewMonth;
          if(Number.isFinite(bi) && Number.isFinite(vi)){
            rangeStart = (bi <= vi) ? baseMonth : viewMonth;
            rangeEnd   = (bi <= vi) ? viewMonth : baseMonth;
          }

          const currentMs = parseISOToMs(todayIsoInTZ(APP_TZ));
          const fromMonth = addMonthsKey(rangeStart, -1);
          const toMonth = addMonthsKey(rangeEnd, horizon);
          const ctx2 = buildPlanRange(fromMonth, toMonth, state.settings, state.bills);
          showPocketToast(ctx2, { label: "Projected free to spend", anchorEl: el, preferAbove: true, duration: 7000, ms: currentMs });
        }, 90);
      }

      function updateDebtFromEditor(el){
        const act = el?.dataset?.act;
        if(!["dName","dBalance","dApr","dMin","dExtra","dDue","dPriority","dInterestStart"].includes(act)) return false;
        const debtRow = el.closest("[data-debt]");
        if(!debtRow) return false;
        const id = debtRow.getAttribute("data-debt");
        const d = (Array.isArray(state.debts) ? state.debts : []).find(x=>x && x.id === id);
        if(!d) return false;

        if(act === "dName"){
          d.name = String(el.value || "");
        }else if(act === "dBalance"){
          const v = Math.max(0, round2(el.value || 0));
          d.balance = v;
          d.originalBalance = Math.max(Number(d.originalBalance || 0), round2(v + debtPrincipalPaidTotal(d)), v);
        }else if(act === "dApr"){
          d.apr = Math.max(0, round2(el.value || 0));
        }else if(act === "dMin"){
          d.minPayment = Math.max(0, round2(el.value || 0));
        }else if(act === "dExtra"){
          d.extraPayment = Math.max(0, round2(el.value || 0));
        }else if(act === "dDue"){
          d.dueDay = clampInt(el.value || 1, 1, 31);
        }else if(act === "dPriority"){
          d.priority = clampInt(el.value || 1, 1, 999);
        }else if(act === "dInterestStart"){
          d.interestStartDate = normalizeISODateLoose(el.value || "") || "";
          if(Array.isArray(d.payments) && d.payments.length){
            recalcDebtFromPayments(d, Number(d.originalBalance || 0));
          }
        }

        saveState();
        return true;
      }

      function refreshDebtCardNumbers(){
        const summary = debtSummary();
        const statVals = wrap.querySelectorAll(".debtStat .v");
        if(statVals[0]) statVals[0].textContent = fmtMoney(summary.totalBalance);
        if(statVals[1]) statVals[1].textContent = fmtMoney(summary.paidSoFar);
        if(statVals[2]) statVals[2].textContent = fmtMoney(summary.monthlyTotal);
        if(statVals[3]) statVals[3].textContent = debtMonthsLabel(summary.longestMonths);

        wrap.querySelectorAll(".debtCard[data-debt]").forEach(card=>{
          const id = card.getAttribute("data-debt");
          const d = (Array.isArray(state.debts) ? state.debts : []).find(x=>x && x.id === id);
          if(!d) return;
          const calc = debtPayoffCalc(d);
          const original = Math.max(Number(d.originalBalance || 0), Number(d.balance || 0), 0);
          const paidSoFar = debtPaidSoFar(d);
          const paidPct = original > 0 ? Math.max(0, Math.min(100, (paidSoFar / original) * 100)) : (Number(d.balance || 0) <= 0 ? 100 : 0);
          const totalEl = card.querySelector(".debtMonthlyTotal");
          if(totalEl) totalEl.textContent = fmtMoney(calc.payment);
          const payoffEl = card.querySelector(".debtPayoffText");
          if(payoffEl) payoffEl.innerHTML = `<span class="debtProgressLabel">${paidPct.toFixed(0)}% paid • ${fmtMoney(paidSoFar)} paid</span><span class="debtInterestLabel">${fmtMoney(Number(d.balance || 0))} left • ${debtMonthsLabel(calc.months)}</span>`;
          const trackerTop = card.querySelector(".debtTrackerTop span");
          if(trackerTop) trackerTop.textContent = `${paidPct.toFixed(0)}% paid • ${fmtMoney(paidSoFar)} paid`;
          const meterEl = card.querySelector(".debtMeterFill");
          if(meterEl) meterEl.style.setProperty("--pct", `${paidPct.toFixed(1)}%`);
        });

        const hint = wrap.querySelector(".debtMiniHint");
        if(hint) hint.innerHTML = `Est. interest left: <strong>${fmtMoney(summary.interest)}</strong>`;

      function scheduleDebtRender(){
        // Do not re-render while typing in Debt fields.
        // Mobile browsers close the keyboard when the edited input is recreated.
        // Debt values are saved live and the full ledger/route refresh happens on blur/change.
        if(debtLiveRenderTimer) clearTimeout(debtLiveRenderTimer);

        if(updateDebtFromEditor(el)){

        if(act !== "amount" && act !== "xAmt") return;

wrap.addEventListener("change", (e)=>{
        const el = e.target;
        const act = el?.dataset?.act;
        if(!act) return;

        const billRow = el.closest("[data-bill]");
        const extraRow = el.closest("[data-extra]");
        const debtRow = el.closest("[data-debt]");
        const extraSpendRow = el.closest("[data-extra-spend]");

        if(debtRow){
          if(updateDebtFromEditor(el)){
            if(debtLiveRenderTimer) clearTimeout(debtLiveRenderTimer);
            render();
          }
          return;
        }

        if(billRow){
          const id = billRow.getAttribute("data-bill");
          const b = state.bills.find(x=>x.id === id);
          if(!b) return;
          const rule = ensureRule(b);

          if(act === "name"){ b.name = el.value; }
          if(act === "amount"){ b.amount = round2(el.value || 0); }

          if(act === "ruleType"){
            const next = el.value;
            rule.type = next;

            // Ensure required fields exist
            if(next === "monthly_dom"){ rule.dom = clampInt(rule.dom ?? 1, 1, 31); delete rule.dow; delete rule.anchor; }
            else if(next === "weekly_dow"){ rule.dow = clampInt(rule.dow ?? 1, 0, 6); delete rule.dom; delete rule.anchor; }
            else {
              // annual_md, one_time, biweekly, perpay -> anchor date picker shared
              rule.anchor = String(rule.anchor || defaultAnchor());
              delete rule.dom; delete rule.dow;
            }

            render();
            return;
          }

          if(act === "dom"){ rule.dom = clampInt(el.value || 1, 1, 31); render(); return; }
          if(act === "dow"){ rule.dow = clampInt(el.value || 1, 0, 6); render(); return; }
          if(act === "anchor"){
            rule.anchor = String(el.value || defaultAnchor());
            render();
            return;
          }

          render();
          return;
        }

        const debtPaymentLogRow = el.closest("[data-debt-payment-log]");

        if(debtPaymentLogRow){
          const did = String(debtPaymentLogRow.getAttribute("data-debt-id") || "");
          const pid = String(debtPaymentLogRow.getAttribute("data-debt-payment-log") || "");
          const d = (Array.isArray(state.debts) ? state.debts : []).find(v=>v && v.id === did);
          const p = d && Array.isArray(d.payments) ? d.payments.find(x=>x && x.id === pid) : null;
          if(!d || !p) return;

          if(act === "dpAmt"){
            const oldAmount = Math.max(0, round2(Number(p.amount || 0)));
            const currentBalance = Math.max(0, round2(Number(d.balance || 0)));
            let newAmount = Math.max(0, round2(Number(el.value || 0)));
            if(newAmount <= 0){ render(); return; }
            newAmount = Math.min(newAmount, round2(currentBalance + oldAmount));
            p.amount = newAmount;
            d.balance = round2(Math.max(0, currentBalance + oldAmount - newAmount));
            d.originalBalance = Math.max(Number(d.originalBalance || 0), Number(d.balance || 0) + debtPaymentTotal(d));
            render();
            return;
          }
          if(act === "dpDate"){
            p.date = normalizeISODateLoose(el.value || "") || String(el.value || todayIsoInTZ(APP_TZ));
            render();
            return;
          }
          if(act === "dpNote"){
            p.note = String(el.value || "");
            render();
            return;
          }
          render();
          return;
        }

        if(extraSpendRow){
          const id = extraSpendRow.getAttribute("data-extra-spend");
          const list = allExtraSpendEntries();
          const x = list.find(v=>v.id === id);
          if(!x) return;

          if(act === "esExtraId"){
            const nextId = String(el.value || "");
            const chosen = extraSpendCategoryOptions().find(v=>v.id === nextId);
            x.extraId = nextId;
            if(chosen && chosen.name) x.extraName = chosen.name;
            render();
            return;
          }
          if(act === "esType"){
            const nextType = String(el.value || "spend").trim() === "refund" ? "refund" : "spend";
            x.entryType = nextType;
            x.amount = nextType === "refund" ? -Math.abs(round2(x.amount || 0)) : Math.abs(round2(x.amount || 0));
            render();
            return;
          }
          if(act === "esAmt"){
            const nextAmt = Math.abs(round2(el.value || 0));
            const nextType = String(x.entryType || "").trim() === "refund" || Number(x.amount || 0) < 0 ? "refund" : "spend";
            x.entryType = nextType;
            x.amount = nextType === "refund" ? -nextAmt : nextAmt;
            render();
            return;
          }
          if(act === "esDate"){ x.date = normalizeISODateLoose(el.value || "") || String(el.value || ""); render(); return; }
          if(act === "esNote"){ x.note = String(el.value || ""); render(); return; }

          render();
          return;
        }

        if(extraRow){
          const id = extraRow.getAttribute("data-extra");
          const list = (state.extrasByMonth && state.extras) ? state.extras : null;
          if(!list) return;
          const x = list.find(v=>v.id === id);
          if(!x) return;

          const rule = ensureRule(x);

          if(act === "xName"){ x.name = String(el.value || ""); render(); return; }
          if(act === "xAmt"){ x.amount = round2(el.value || 0); render(); return; }

          if(act === "xRuleType"){
            const next = el.value;
            rule.type = next;

            // Ensure required fields exist
            if(next === "monthly_dom"){ rule.dom = clampInt(rule.dom ?? 1, 1, 31); delete rule.dow; delete rule.anchor; }
            else if(next === "weekly_dow"){ rule.dow = clampInt(rule.dow ?? 1, 0, 6); delete rule.dom; delete rule.anchor; }
            else if(next === "perpay"){ delete rule.dom; delete rule.dow; delete rule.anchor; }
            else { rule.anchor = String(rule.anchor || defaultAnchor()); delete rule.dom; delete rule.dow; }

            render();
            return;
          }

          if(act === "xDom"){ rule.dom = clampInt(el.value || 1, 1, 31); render(); return; }
          if(act === "xDow"){ rule.dow = clampInt(el.value || 1, 0, 6); render(); return; }
          if(act === "xAnchor"){ rule.anchor = String(el.value || defaultAnchor()); render(); return; }

          render();
          return;
        }
      });

      return wrap;
    }

        function normalizeISODate(s){
          const v = String(s || "").trim();
          if(!v) return "";
          // Already ISO: YYYY-MM-DD
          if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
          // Month key: YYYY-MM  -> assume day 01
          if(/^\d{4}-\d{2}$/.test(v)) return v + "-01";
          // YYYY/MM/DD
          let m = v.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
          if(m){
            const yy = m[1];
            const mm = String(m[2]).padStart(2,"0");
            const dd = String(m[3]).padStart(2,"0");
            return `${yy}-${mm}-${dd}`;
          }
          // MM/DD/YYYY
          m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
          if(m){
            const mm = String(m[1]).padStart(2,"0");
            const dd = String(m[2]).padStart(2,"0");
            const yy = m[3];
            return `${yy}-${mm}-${dd}`;
          }
          // Last resort: Date.parse (best-effort)
          try{
            const d = new Date(v);
            if(!Number.isNaN(d.getTime())){
              const yy = d.getFullYear();
              const mm = String(d.getMonth()+1).padStart(2,"0");
              const dd = String(d.getDate()).padStart(2,"0");
              return `${yy}-${mm}-${dd}`;
            }
          }catch(_){}
          return v;
        }

          const iso = normalizeISODate(s);

          : projectedSavingsAtMonthStart(curMk, state.settings));

        const tr = document.createElement("tr");

        ptb.appendChild(tr);

        if(projectedMode){
          rememberProjectedSavingsMonth(curMk, runningSav, endSav);
        }

        runningSav = endSav;
        curMk = addMonthsKey(curMk,1);
      }

      pw.appendChild(pt);
      proj.appendChild(pw);
      wrap.appendChild(proj);

      return wrap;
    }

      const pocketModeBaseLabelEl = a.querySelector("#pocketModeBaseLabel");
      const pocketModeHelpEl = a.querySelector("#pocketModeHelp");
      const daysBAEl = a.querySelector("#daysBA");
      const defViewEl = a.querySelector("#defLedgerView");

      // Base month mismatch warning + one-click sync (helps avoid confusion across months)
      const monthPickerEl = document.getElementById("monthPicker");
      const bmWarnEl = a.querySelector("#baseMonthWarn");
      const bmWarnTextEl = bmWarnEl ? bmWarnEl.querySelector(".bmwarn-text") : null;
      const bmSyncBtn = a.querySelector("#baseMonthSync");

      function syncPocketModeToggle(){
        state.settings.pocket = state.settings.pocket || {};
        const mode = pocketThresholdMode();
        if(pocketModeSwitchEl){
          pocketModeSwitchEl.classList.toggle("on", mode === "base");
          pocketModeSwitchEl.setAttribute("aria-checked", mode === "base" ? "true" : "false");
          pocketModeSwitchEl.title = `Currently using ${mode === "base" ? "pocket base" : "projected free to spend"} for red warnings.`;
        }
        if(pocketModeNetLabelEl){
          pocketModeNetLabelEl.classList.toggle("active", mode === "net");
        }
        if(pocketModeBaseLabelEl){
          pocketModeBaseLabelEl.classList.toggle("active", mode === "base");
        }
        if(pocketModeHelpEl){
          pocketModeHelpEl.textContent = `Red warning uses ${mode === "base" ? "pocket base" : "projected free to spend"}.`;
        }
      }
      function setPocketThresholdMode(mode){
        state.settings.pocket = state.settings.pocket || {};
        state.settings.pocket.thresholdMode = (mode === "base") ? "base" : "net";
        render();
      }

      function updateBaseMonthWarn(){
        if(!bmWarnEl || !monthPickerEl) return;
        const baseV = (baseMonthEl.value || "").trim();
        const viewV = (monthPickerEl.value || "").trim();
        if(baseV && viewV && baseV !== viewV){
          bmWarnEl.style.display = "flex";
          if(bmWarnTextEl){
            bmWarnTextEl.textContent = `Heads up: projections are anchored to ${baseV} while you’re viewing ${viewV}.`;
          }
        } else {
          bmWarnEl.style.display = "none";
        }
      }

      if(bmSyncBtn){
        bmSyncBtn.addEventListener("click", ()=>{
          if(window.__syncBaseToViewed) window.__syncBaseToViewed("settings");
        });
      }
// Avoid stacking listeners across renders
      if(monthPickerEl && !monthPickerEl.dataset.bmwarnBound){
        monthPickerEl.dataset.bmwarnBound = "1";
        monthPickerEl.addEventListener("change", ()=>{
          // If settings panel is open, it'll re-render anyway; still update if the warning is visible.
          const el = document.getElementById("baseMonthWarn");
          if(el) {
            const txt = el.querySelector(".bmwarn-text");
            const baseEl = document.getElementById("baseMonth");
            const baseV = (baseEl?.value || "").trim();
            const viewV = (monthPickerEl.value || "").trim();
            if(baseV && viewV && baseV !== viewV){
              el.style.display = "flex";
              if(txt) txt.textContent = `Heads up: projections are anchored to ${baseV} while you’re viewing ${viewV}.`;
            } else {
              el.style.display = "none";
            }
          }
        });
      }


      baseMonthEl.value = state.settings.baseMonth;
      baseBillsEl.value = Number(state.settings.baseBillsBalance||0).toFixed(2);
      {
        const bm = (state.settings.baseMonth || state.selectedMonth || currentLocalMonthKey());
        const viewMk = (state.selectedMonth || currentLocalMonthKey() || "").trim();
        const projected = (String(bm).trim() !== String(viewMk).trim());

        const disp = projected
          ? projectedSavingsAtMonthStart(bm, state.settings)
          : Number(state.settings.baseSavingsBalance || 0);

        baseSavEl.value = Number(disp || 0).toFixed(2);

        if(baseSavHintEl){
          baseSavHintEl.textContent = projected ? "Projected Savings Balance" : "Base Savings balance";
          baseSavHintEl.style.color = projected ? "var(--blue)" : "var(--muted)";
        }
      }
      setCushEl.value = Number(state.settings.cushion||0).toFixed(2);
      pocketMinEl.value = Number(state.settings.pocket?.minimumSurvival || 0).toFixed(2);
      syncPocketModeToggle();
      daysBAEl.value = String(state.ui.daysBeforeAfter || 3);
      defViewEl.value = state.ui.ledgerView;

      updateBaseMonthWarn();

      {
        let lastSettingsBaseMonthCommit = "";
        const commitSettingsBaseMonth = ()=>{
          const v = (baseMonthEl.value || "").trim();
          if(!v || v === lastSettingsBaseMonthCommit) return;
          lastSettingsBaseMonthCommit = v;
          // Changing the base month can intentionally de-sync from the Viewed month.
          // If you set it back to the Viewed month, projection mode ends.
          const viewV = ((state.selectedMonth || "") + "").trim();
          const prevBase = (((state.settings.baseMonth || "") + "").trim()) || viewV;
          const wasSynced = (prevBase && viewV && prevBase === viewV);
          const willSync = (v && viewV && v === viewV);
          const willUnsync = (v && viewV && v !== viewV);

          if(willUnsync && wasSynced) ensureSavingsGoalSnapshot();
          if(willUnsync) ensureProjectionSandbox();
          if(willSync) restoreSavingsGoalSnapshot();
          if(willSync) restoreProjectionSandbox();

          state.settings.baseMonthAutoSync = false;
          state.settings.baseMonth = v;
          state.ui = state.ui || {};
          state.ui.unsyncedByBase = !!willUnsync;

          updateBaseMonthWarn();
          render();
        };
        baseMonthEl.addEventListener("input", commitSettingsBaseMonth);
        baseMonthEl.addEventListener("change", commitSettingsBaseMonth);
      }
      baseBillsEl.addEventListener("input", ()=>{
        state.settings.baseBillsBalance = Number(baseBillsEl.value || 0);
        render();
      });
      // Commit Base/Projected Savings on change (editing "Projected" re-anchors the true base to this month)
      baseSavEl.addEventListener("change", ()=>{
        const bm = (state.settings.baseMonth || state.selectedMonth || currentLocalMonthKey()).trim();
        state.settings.baseSavingsBalance = round2(baseSavEl.value || 0);
        state.settings.trueSavingsMonth = bm;
        render();
      });
      setCushEl.addEventListener("input", ()=>{
        state.settings.cushion = Number(setCushEl.value || 0);
        document.getElementById("cushionInput").value = Number(state.settings.cushion||0).toFixed(2);
        render();
      });
      function commitPocketMinimum(renderAfter = true){
        state.settings.pocket = state.settings.pocket || {};
        const raw = String(pocketMinEl.value || "").trim();
        const nextVal = (raw === "") ? 0 : Math.max(0, Number(raw || 0));
        state.settings.pocket.minimumSurvival = Number.isFinite(nextVal) ? nextVal : Number(state.settings.pocket.minimumSurvival || 0);
        saveState();
        if(renderAfter) render();
      }
      pocketMinEl.addEventListener("input", ()=>{
        state.settings.pocket = state.settings.pocket || {};
        const raw = String(pocketMinEl.value || "").trim();
        const nextVal = (raw === "") ? 0 : Math.max(0, Number(raw || 0));
        state.settings.pocket.minimumSurvival = Number.isFinite(nextVal) ? nextVal : Number(state.settings.pocket.minimumSurvival || 0);
        saveState();
      });
      pocketMinEl.addEventListener("change", ()=> commitPocketMinimum(true));
      pocketMinEl.addEventListener("blur", ()=> commitPocketMinimum(true));
      if(pocketModeSwitchEl){
        pocketModeSwitchEl.addEventListener("click", ()=>{
          setPocketThresholdMode(pocketThresholdMode() === "base" ? "net" : "base");
        });
        pocketModeSwitchEl.addEventListener("keydown", (e)=>{
          if(e.key === "Enter" || e.key === " "){
            e.preventDefault();
            setPocketThresholdMode(pocketThresholdMode() === "base" ? "net" : "base");
          }
        });
      }
      if(pocketModeNetLabelEl){
        pocketModeNetLabelEl.addEventListener("click", ()=> setPocketThresholdMode("net"));
      }
      if(pocketModeBaseLabelEl){
        pocketModeBaseLabelEl.addEventListener("click", ()=> setPocketThresholdMode("base"));
      }
      daysBAEl.addEventListener("input", ()=>{
        state.ui.daysBeforeAfter = clampInt(daysBAEl.value || 3, 0, 31);
        render();
      });
      defViewEl.addEventListener("change", ()=>{
        state.ui.ledgerView = defViewEl.value;
        render();
      });

      c.querySelector("#resetAll").addEventListener("click", ()=>{
        if(!confirm("Delete everything and start fresh?")) return;
        clearAllPlannerStorage();
        state = migrateState(structuredClone(DEFAULT_STATE));
        state.selectedMonth = currentMonthKey();
        state.ui.activeTab = "settings";
        state.ui._loadedFromKey = null;
        saveState();
        render();
        try{ quickToast("Everything deleted. Starting fresh."); }catch(_){ }
      });

      return wrap;
    }

    function renderPocketDock(ctx){
      const dock = document.getElementById("pocketDock");
      const body = document.getElementById("pocketDockBody");

      const shouldShow = !!state.ui.showSidePocket;
      dock.style.display = shouldShow ? "" : "none";
      pocketToggleBtn.classList.toggle("active", shouldShow);
      body.innerHTML = "";

      const mk = state.selectedMonth;
      const next = addMonthsKey(mk,1);

      const p1 = ctx.plans.get(mk);
      const p2 = ctx.plans.get(next);

      const sections = [
        { mk, plan: p1 },
        { mk: next, plan: p2 }
      ].filter(x=>!!x.plan);

      const allExtras = allExtrasList();

      for(const sec of sections){
        const periods = pocketPayPeriods(sec.plan);
        const {y,m} = parseMonthKey(sec.mk);

        for(const pp of periods){
          // Compute pocket-only extra spending for this pay period
          const ex = extrasSpentAndNamesForRange(pp.start, pp.end, ctx, allExtras);

          const names = Array.isArray(ex.names) ? ex.names.slice() : [];
          const pocketSpent = round2(ex.spent || 0);
          const pocketNet = round2(pp.pocketBase - pocketSpent);
          const spentLimit = round2(pp.pocketBase);
          const pocketSpentOver = pocketSpent > (spentLimit + 0.005);
          const thresholdInfo = pocketMinimumInfo(sec.plan, pp.payIndex, pocketNet, pocketSpent);
          const thresholdLow = !!thresholdInfo;
          const netThresholdClass = (thresholdLow && thresholdInfo && thresholdInfo.mode === "net") ? " thresholdLowText" : "";
          const baseThresholdClass = (thresholdLow && thresholdInfo && thresholdInfo.mode === "base") ? " thresholdLowText" : "";

          const extrasClass = (names.length <= 4) ? "fixed" : "more";
          const extrasHtml = names.length
            ? names.map(n => `<div class="pe">${escapeHtml(n)}</div>`).join("")
            : `<div class="pe none">none</div>`;

          const item = document.createElement("button");
          item.type = "button";
          item.className = "pocketItem";
          item.dataset.mk = sec.mk;
          item.dataset.start = String(pp.start);
          item.dataset.end = String(pp.end);
          item.dataset.pk = pocketKey(item.dataset.mk, item.dataset.start, item.dataset.end);
          item.dataset.thresholdLow = thresholdLow ? "1" : "0";
          if(pocketNet < 0) item.classList.add("neg");
          if(thresholdLow) item.classList.add("thresholdLow");
          if(thresholdLow){
            item.title = `${thresholdInfo.metricLabel} ${fmtMoney(thresholdInfo.metricValue)} is below your minimum ${fmtMoney(thresholdInfo.minimum)}. Tap to see why.`;
          }
          item.addEventListener("click", (e)=> togglePocketBreakdownInline(e, item, ctx));

          const selectedMode = pocketThresholdMode();
          item.innerHTML = `
            <div class="l">
              <div class="m">${monthName(m)} ${y}</div>
              <div class="p">${dowName(toDateObj(pp.start).dow)} ${fmtMD(pp.start)} → ${dowName(toDateObj(pp.end).dow)} ${fmtMD(pp.end)}</div>
              <div class="pocketExtras ${extrasClass}">${extrasHtml}</div>
            </div>
            <div>
              <div class="pocketMetricLegend"><span class="metricProj ${selectedMode === "net" ? "activeMetric" : ""}">Proj. free<br>to spend</span><span class="${selectedMode === "base" ? "activeMetric" : ""}">Base</span></div>
              <div class="r"><span class="pocketNetValue${netThresholdClass}">${fmtMoney(pocketNet)}</span><span class="pocketSlash">/</span><span class="pocketTot pocketBaseValue${baseThresholdClass}">${fmtMoney(pp.pocketBase)}</span></div>
              <div class="pocketMeta">spent <span class="${pocketSpentOver ? 'overSpent' : ''}">${fmtMoney(pocketSpent)}</span></div>
            </div>
`;

          body.appendChild(item);
          // Re-open inline breakdown after re-render (mobile/desktop)
          if(thresholdLow && state.ui && state.ui.pocketExpandedKey === item.dataset.pk){
            expandPocketItemInline(item, ctx, true);
          }

        }
      }

      if(body.children.length === 0){
        const empty = document.createElement("div");
        empty.className = "muted";
        empty.textContent = "No paydays found for current/next month.";
        body.appendChild(empty);
      }
    }

    // -----------------------------
    // Sync helper (Savings + Settings)
    // -----------------------------
    function isSavingsProjected(){
      const bm = (((state.settings.baseMonth || "") + "").trim()) || (((state.selectedMonth || "") + "").trim());
      const vm = (((state.selectedMonth || "") + "").trim());
      return !!(bm && vm && bm !== vm);
    }
    function ensureSavingsGoalSnapshot(){
      try{
        state.settings.savings = state.settings.savings || {};
        state.ui = state.ui || {};
        const snap = state.ui.savingsGoalSnapshot;
        if(!snap || !snap.active){
          state.ui.savingsGoalSnapshot = { active: true, value: Number(state.settings.savings.monthlyGoal || 0) };
        }
      }catch(_){}
    }
    function restoreSavingsGoalSnapshot(){
      try{
        state.settings.savings = state.settings.savings || {};
        const snap = state.ui && state.ui.savingsGoalSnapshot;
        if(snap && snap.active){
          state.settings.savings.monthlyGoal = Number(snap.value || 0);
          snap.active = false;
        }
      }catch(_){}
    }


    function projectionMonthMemoryStart(){
      try{
        const baseV = ((state.settings && state.settings.baseMonth) ? String(state.settings.baseMonth) : "").trim();
        const viewV = ((state.selectedMonth || "") + "").trim();
        const bi = monthIndex(baseV);
        const vi = monthIndex(viewV);
        if(Number.isFinite(bi) && Number.isFinite(vi)){
          return (vi > bi) ? viewV : baseV;
        }
        return viewV || baseV || currentLocalMonthKey();
      }catch(_){ return currentLocalMonthKey(); }
    }

    function getProjectionSavingsSnapshots(){
      try{
        const p = state && state.ui && state.ui.proj;
        if(!p || !p.active) return null;
        if(!p.savingsMonthSnapshots || typeof p.savingsMonthSnapshots !== "object" || Array.isArray(p.savingsMonthSnapshots)){
          p.savingsMonthSnapshots = {};
        }
        return p.savingsMonthSnapshots;
      }catch(_){ return null; }
    }

    function getProjectedSavingsStartSnapshot(monthKey){
      try{
        const mk = String(monthKey || "").trim();
        const map = getProjectionSavingsSnapshots();
        if(!mk || !map || !map[mk]) return NaN;
        const v = Number(map[mk].start);
        return Number.isFinite(v) ? round2(v) : NaN;
      }catch(_){ return NaN; }
    }

    function rememberProjectedSavingsMonth(monthKey, startValue, endValue){
      try{
        const mk = String(monthKey || "").trim();
        const map = getProjectionSavingsSnapshots();
        if(!mk || !map) return;
        const start = Number(startValue);
        const end = Number(endValue);
        if(!Number.isFinite(start) || !Number.isFinite(end)) return;
        map[mk] = { start: round2(start), end: round2(end) };
      }catch(_){ }
    }

    function invalidateProjectedSavingsSnapshotsFrom(monthKey){
      try{
        const map = getProjectionSavingsSnapshots();
        if(!map) return;
        const mk = String(monthKey || projectionMonthMemoryStart() || "").trim();
        const startIdx = monthIndex(mk);
        if(!Number.isFinite(startIdx)) return;
        for(const key of Object.keys(map)){
          const ix = monthIndex(key);
          if(Number.isFinite(ix) && ix >= startIdx) delete map[key];
        }
        if(state.ui && state.ui.savingsProjected){
          state.ui.savingsProjected.key = "";
          state.ui.savingsProjected.value = null;
        }
      }catch(_){ }
    }

    function invalidateProjectedSavingsSnapshotsAfter(monthKey){
      try{
        const mk = String(monthKey || projectionMonthMemoryStart() || "").trim();
        if(!mk) return;
        invalidateProjectedSavingsSnapshotsFrom(addMonthsKey(mk, 1));
      }catch(_){ }
    }

    function markProjectedSavingsChanged(){
      try{
        if(!isSavingsProjected()) return;
        ensureProjectionSandbox();
        // Projection edits made while viewing a future month should NOT rewrite the
        // saved amount at the start of that viewed month. Keep that start value,
        // recalculate that month's end, then rebuild future months from there.
        invalidateProjectedSavingsSnapshotsAfter(projectionMonthMemoryStart());
      }catch(_){ }
    }

    // Temporary "Projection sandbox" for Bills + Paydays edits while in Projected mode.
    // These edits affect calculations immediately, but revert when you Sync base (or re-sync by matching Base month to Viewed month).
    function isProjectionActive(){
      return !!(state && state.ui && state.ui.proj && state.ui.proj.active);
    }
    function ensureProjectionSandbox(){
      try{
        state.ui = state.ui || {};
        if(state.ui.proj && state.ui.proj.active) return;
        state.ui.proj = {
          active: true,
          origBills: structuredClone(Array.isArray(state.bills) ? state.bills : []),
          origPay: structuredClone(state.settings && state.settings.pay ? state.settings.pay : {}),
          // Savings-only "what-if" extra costs (used only in Savings Timeline while projected)
          origExtraCosts: [],
          extraCosts: [],
          extraUI: {},
          savingsMonthSnapshots: {},
          openBills: false,
          openPay: false,
          openExtra: false
        };
      }catch(_){}
    }
    function restoreProjectionSandbox(){
      try{
        const p = state.ui && state.ui.proj;
        if(p && p.active){
          if(p.origBills) state.bills = structuredClone(p.origBills);
          if(p.origPay){
            state.settings = state.settings || {};
            state.settings.pay = structuredClone(p.origPay);
          }
          // Clear savings-only projection extras on any sync action
          p.extraCosts = structuredClone(Array.isArray(p.origExtraCosts) ? p.origExtraCosts : []);
          p.extraUI = {};
          p.savingsMonthSnapshots = {};
          p.active = false;
          p.openBills = false;
          p.openPay = false;
          p.openExtra = false;
        }
      }catch(_){}
    }


    window.__syncBaseToViewed = function(source){
      try{
        // If the user tweaked Monthly savings goal while in Projected mode, treat that as temporary.
        // Syncing back to the Viewed month restores the original goal.
        restoreSavingsGoalSnapshot();

        // Restore any temporary Bills/Paydays edits made while projected.
        restoreProjectionSandbox();

        const viewEl = document.getElementById("monthPicker");
        const baseEl = document.getElementById("baseMonth");
        const viewV = (((viewEl && viewEl.value) || state.selectedMonth || "") + "").trim();
        if(!viewV) return;

        const baseV = (((state.settings.baseMonth || "") + "").trim()) || viewV;

        // Build a temporary plan context from the current anchor so we can capture accurate
        // month-start balances for the viewed month before switching the anchor.
        const toMonth = addMonthsKey(viewV, 12);
        const tmpCtx = buildPlanRange(baseV, toMonth, state.settings, state.bills);
        const p = (tmpCtx && tmpCtx.plans) ? tmpCtx.plans.get(viewV) : null;
        if(p){
          state.settings.baseBillsBalance = Number(p.startBills ?? state.settings.baseBillsBalance ?? 0);
        }

        // Keep the user's true Base Savings Balance; syncing is about the base month.
        // Align the trueSavingsMonth to the viewed month so projections are consistent.
        state.settings.trueSavingsMonth = viewV;

        state.settings.baseMonth = viewV;
        state.settings.baseMonthAutoSync = false;

        state.ui = state.ui || {};
        state.ui.unsyncedByBase = false;

        // Clear projected Savings snapshot cache when re-syncing.
        if(state.ui && state.ui.savingsProjected){
          state.ui.savingsProjected.key = "";
          state.ui.savingsProjected.value = null;
        }
        if(baseEl) baseEl.value = viewV;
        const savBaseEl = document.getElementById("savBaseMonth");
        if(savBaseEl) savBaseEl.value = viewV;

        saveState();

        // Immediate feedback (especially on mobile)
        const sav = document.getElementById("savHeadsUp");
        if(sav){ sav.style.display = "none"; sav.innerHTML = ""; }

        quickToast("Base synced");
        render();
      }catch(err){
        try{ quickToast("Sync failed"); }catch(_){}
        console.error(err);
      }
    };


    /***********************
     * UI Events
     ***********************/
    function handleViewedMonthChange(e){
      const nextMonth = (e.target.value || "").trim();
      if(!nextMonth) return;
      if(nextMonth === ((state.selectedMonth || "") + "").trim()) return;

      const prevMonth = ((state.selectedMonth || "") + "").trim();
      const baseMonth = ((state.settings.baseMonth || "") + "").trim();

      const wasProjected = (baseMonth && prevMonth && baseMonth !== prevMonth);
      const wasSyncedToPrev = (baseMonth && prevMonth && baseMonth === prevMonth);
      const willProject = (baseMonth && nextMonth && baseMonth !== nextMonth);

      // Main/View month changes NEVER modify Base month.
      // Base month is a stable anchor; when Base != Viewed, the UI shows "Sync Base".
      state.selectedMonth = nextMonth;
      state.ui = state.ui || {};
      state.ui.unsyncedByBase = !!willProject;

      // If you move from a synced month into the future/past, enter projection mode immediately.
      if(willProject){
        if(wasSyncedToPrev) ensureSavingsGoalSnapshot();
        ensureProjectionSandbox();
      }

      // If you were in Projected mode and you navigated back to a synced month (Base == Viewed),
      // automatically restore any temporary projection edits.
      if(wasProjected && !isSavingsProjected()){
        restoreSavingsGoalSnapshot();
        restoreProjectionSandbox();
        state.ui.unsyncedByBase = false;
      }

      saveState();
      render();
    }
    const viewedMonthPicker = document.getElementById("monthPicker");
    viewedMonthPicker.addEventListener("input", handleViewedMonthChange);
    viewedMonthPicker.addEventListener("change", handleViewedMonthChange);


    document.getElementById("cushionInput").addEventListener("input", (e)=>{
      state.settings.cushion = Number(e.target.value || 0);
      render();
    });

    document.getElementById("dashboardSelect").addEventListener("change", (e)=>{
      state.ui.dashboardMode = e.target.value;
      render();
    });

    document.getElementById("themeBtn").addEventListener("click", ()=>{
      const order = ["dark","light","neon","aurora"];
      const cur = (state.ui && state.ui.theme) ? state.ui.theme : "dark";
      const idx = order.indexOf(cur);
      state.ui.theme = order[(idx >= 0 ? idx+1 : 1) % order.length];
      render();
    });

    document.getElementById("tabstrip").addEventListener("click", (e)=>{
      const btn = e.target.closest(".tab");
      if(!btn) return;
      state.ui.activeTab = btn.dataset.tab;
      render();
    });
    // Tab switching safety: bind directly to each tab button too.
    // This prevents cases where the delegated handler doesn't fire (some embedded viewers / odd overlays).
    document.querySelectorAll("#tabstrip .tab").forEach((btn)=>{
      // Ensure these are never treated as submit buttons.
      try{ btn.type = "button"; }catch{}
      btn.addEventListener("click", (ev)=>{
        ev.preventDefault();
        ev.stopPropagation();
        state.ui.activeTab = btn.dataset.tab || "ledger";
        render();
      });
      btn.addEventListener("keydown", (ev)=>{
        if(ev.key === "Enter" || ev.key === " "){
          ev.preventDefault();
          ev.stopPropagation();
          state.ui.activeTab = btn.dataset.tab || "ledger";
          render();
        }
      });
    });


    document.getElementById("collapseSwitch").addEventListener("click", ()=>{
      state.ui.collapseEmpty = !state.ui.collapseEmpty;
      render();
    });

    document.getElementById("ledgerViewSeg").addEventListener("click", (e)=>{
      const b = e.target.closest(".segBtn");
      if(!b) return;
      state.ui.ledgerView = b.dataset.view;
      render();
    });

    document.getElementById("todayBtn").addEventListener("click", ()=>{
      jumpToToday();
    });

    document.getElementById("pocketToggleBtn").addEventListener("click", ()=>{
      state.ui.showSidePocket = !state.ui.showSidePocket;
      render();
    });

    document.getElementById("pocketClose").addEventListener("click", ()=>{
      state.ui.showSidePocket = false;
      render();
    });

    document.getElementById("exportBtn").addEventListener("click", ()=>{
      const data = JSON.stringify(state, null, 2);
      const blob = new Blob([data], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "bills-account-planner.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    
    // ===== Import Undo toast =====
    let _importUndoTimer = null;
    let _importUndoPrev = null;

    function showImportUndoToast(prevState){
      const toast = document.getElementById("importUndoToast");
      if(!toast) return;

      _importUndoPrev = prevState;

      toast.innerHTML = `
        <span class="msg">Import applied.</span>
        <span class="sub">Undo?</span>
        <span class="actions">
          <button type="button" id="importUndoBtn">Undo</button>
          <button type="button" id="importUndoDismissBtn" aria-label="Dismiss">×</button>
        </span>
      `;
      toast.style.display = "flex";

      const hide = ()=>{
        toast.style.display = "none";
        if(_importUndoTimer){ clearTimeout(_importUndoTimer); _importUndoTimer = null; }
      };

      toast.querySelector("#importUndoBtn")?.addEventListener("click", ()=>{
        if(_importUndoPrev){
          state = structuredClone(_importUndoPrev);
          _importUndoPrev = null;
          saveState();
          render();
        }
        hide();
      });

      toast.querySelector("#importUndoDismissBtn")?.addEventListener("click", ()=>{
        _importUndoPrev = null;
        hide();
      });

      if(_importUndoTimer) clearTimeout(_importUndoTimer);
      _importUndoTimer = setTimeout(()=>{
        _importUndoPrev = null;
        toast.style.display = "none";
        _importUndoTimer = null;
      }, 10000);
    }

document.getElementById("importBtn").addEventListener("click", ()=>{
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = "application/json";
      inp.onchange = ()=>{
        const f = inp.files?.[0];
        if(!f) return;
        const r = new FileReader();
        r.onload = ()=>{
          try{
            const obj = JSON.parse(String(r.result||"{}"));
            const prev = structuredClone(state);
            state = migrateState(obj) ?? structuredClone(DEFAULT_STATE);
            saveState();
            render();
            showImportUndoToast(prev);
          }catch{
            alert("Invalid JSON.");
          }
        };
        r.readAsText(f);
      };
      inp.click();
    });

    window.addEventListener("scroll", positionPocketDock, {passive:true});
    window.addEventListener("resize", ()=>{
      if(!state.ui.ledgerView){
        state.ui.ledgerView = window.matchMedia("(max-width: 820px)").matches ? "cards" : "table";
      }
      positionPocketDock();
    });

        window.addEventListener("scroll", updateLedgerStickyHeader, {passive:true});
    window.addEventListener("resize", refreshLedgerStickyHeader, {passive:true});

/***********************
     * Utilities
     ***********************/
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, (c)=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[c]));
    }
    function escapeAttr(s){
      return escapeHtml(s).replace(/"/g, "&quot;");
    }
if(!state.ui.ledgerView){
      state.ui.ledgerView = window.matchMedia("(max-width: 820px)").matches ? "cards" : "table";
    }
    render();
  
</script>
</body>
</html>
