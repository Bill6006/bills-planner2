    function splitTransferAmount(total, pctPay2, pctOther){
      const totalC = Math.round(Number(total || 0) * 100);
      if(!Number.isFinite(totalC) || totalC <= 0){
        return { source1: 0, pay2: 0, other: 0 };
      }
      let p2C = Math.round(totalC * (Number(pctPay2 || 0) / 100));
      let oC  = Math.round(totalC * (Number(pctOther || 0) / 100));
      if(!Number.isFinite(p2C)) p2C = 0;
      if(!Number.isFinite(oC)) oC = 0;
      if(p2C < 0) p2C = 0;
      if(oC < 0) oC = 0;
      if(p2C + oC > totalC){
        oC = Math.max(0, totalC - p2C);
      }
      const s1C = totalC - p2C - oC;
      return { source1: s1C/100, pay2: p2C/100, other: oC/100 };
    }

/***********************
     * Planning Engine (Fixed transfer model)
     ***********************/
    function parseISOToMs(iso){
      const [Y,M,D] = String(iso).split("-").map(Number);
      return msUTC(Y,M,D);
    }

    function clampInt(n, lo, hi){
      const v = Math.floor(Number(n) || 0);
      return Math.max(lo, Math.min(hi, v));
    }

    
    function getPaydaysForPay(monthKey, pay){
      const start = monthStartMs(monthKey);
      const end = monthEndMs(monthKey);
      const p = (pay && typeof pay === "object") ? pay : {};
      const freq = String(p.frequency || "semimonthly");

      if(freq === "semimonthly"){
        const {y,m} = parseMonthKey(monthKey);
        const dim = daysInMonth(y,m);
        const dom1 = clampInt(p.semimonthlyDom1 ?? 15, 1, dim);
        const dom2Raw = clampInt(p.semimonthlyDom2 ?? dim, 1, 31);
        const dom2 = Math.max(1, Math.min(dim, dom2Raw));
        const p1 = msUTC(y,m,dom1);
        const p2 = msUTC(y,m,dom2);
        const out = [p1, p2].sort((a,b)=>a-b).filter((v,i,a)=> i===0 || v!==a[i-1]);
        return out;
      }

      if(freq === "monthly"){
        const {y,m} = parseMonthKey(monthKey);
        const dim = daysInMonth(y,m);
        let dom = Number(p.monthlyDom || 0);
        if(!dom){
          try{ dom = Number(String(p.anchorNextPayday).split("-")[2] || 1); }catch{ dom = 1; }
        }
        dom = clampInt(dom, 1, dim);
        return [msUTC(y,m,dom)];
      }

      if(freq === "custom"){
        const out = [];
        const list = Array.isArray(p.customDates) ? p.customDates : [];
        for(const iso of list){
          if(String(iso).slice(0,7) === monthKey){
            const ms = parseISOToMs(iso);
            if(ms >= start && ms <= end) out.push(ms);
          }
        }
        out.sort((a,b)=>a-b);
        return out.filter((v,i,a)=> i===0 || v!==a[i-1]);
      }

      const step = (freq === "weekly") ? 7 : 14;
      const anchor = parseISOToMs(p.anchorNextPayday);
      let first = anchor;
      while(first > start) first = addDaysMs(first, -step);

      const out = [];
      let cur = first;
      while(cur < start) cur = addDaysMs(cur, step);
      while(cur <= end){
        out.push(cur);
        cur = addDaysMs(cur, step);
      }
      return out;
    }

    function getPaydaysForMonth(monthKey, settings){
      const s = (settings && typeof settings === "object") ? settings : {};
      const p1 = getPaydaysForPay(monthKey, s.pay || {});
      const p2 = s.pay2 ? getPaydaysForPay(monthKey, s.pay2) : [];
      const out = p1.concat(p2).slice().sort((a,b)=>a-b);
      return out.filter((v,i,a)=> i===0 || v!==a[i-1]);
    }

    function getPayCapInfoForMonth(monthKey, settings, paydays){
      const s = (settings && typeof settings === "object") ? settings : {};
      const days = (Array.isArray(paydays) ? paydays : getPaydaysForMonth(monthKey, s)).slice().sort((a,b)=>a-b);

      const p1 = s.pay || {};
      const p2 = s.pay2 || null;

      const p1days = getPaydaysForPay(monthKey, p1);
      const p2days = p2 ? getPaydaysForPay(monthKey, p2) : [];

      const baseCaps = new Map();
      const cap1Caps = new Map();
      const cap2Caps = new Map();
      for(const d of days){
        baseCaps.set(d, 0);
        cap1Caps.set(d, 0);
        cap2Caps.set(d, 0);
      }
      const cap1 = Number(p1.paycheckCap || 0);
      for(const d of p1days){
        if(baseCaps.has(d)){
          baseCaps.set(d, baseCaps.get(d) + cap1);
          cap1Caps.set(d, cap1Caps.get(d) + cap1);
        }
      }
      const cap2 = p2 ? Number(p2.paycheckCap || 0) : 0;
      for(const d of p2days){
        if(baseCaps.has(d)){
          baseCaps.set(d, baseCaps.get(d) + cap2);
          cap2Caps.set(d, cap2Caps.get(d) + cap2);
        }
      }

      // Additional income allocation (Option A): credit the pay period containing the date (maps to the most recent payday <= date).
      const other = Array.isArray(s.otherIncomes) ? s.otherIncomes : [];
      const occ = billOccurrencesForMonth(monthKey, other, s);

      const alloc = new Array(days.length).fill(0);
      let total = 0;

      function findPayIndexForDate(ms){
        if(!days.length) return null;
        // last payday <= ms (if none, first payday)
        let lo = 0, hi = days.length - 1, ans = -1;
        while(lo <= hi){
          const mid = (lo + hi) >> 1;
          if(days[mid] <= ms){ ans = mid; lo = mid + 1; } else { hi = mid - 1; }
        }
        return (ans >= 0) ? ans : 0;
      }

      for(const [ms, list] of occ.entries()){
        for(const it of list){
          const amt = Number(it.amount || 0);
          if(!amt) continue;
          total += amt;
          const idx = findPayIndexForDate(ms);
          if(idx != null) alloc[idx] = round2(Number(alloc[idx] || 0) + amt);
        }
      }

      const payCaps = days.map((d, i)=> round2(Number(baseCaps.get(d) || 0) + Number(alloc[i] || 0)));
      const minCap = payCaps.length ? Math.min(...payCaps) : 0;
      const perPay = days.length ? round2(total / days.length) : 0;

      return {
        paydays: days,
        payCaps,
        pay1Caps: days.map(d=> round2(Number(cap1Caps.get(d) || 0))),
        pay2Caps: days.map(d=> round2(Number(cap2Caps.get(d) || 0))),
        minCap,
        otherIncomeTotal: round2(total),
        otherIncomePerPayday: perPay,
        otherIncomeAlloc: alloc
      };
    }


    function nextPaydayAfterMs(ms, settings){
      // Find the next payday strictly after `ms`, scanning forward month-by-month.
      let mk = isoDate(ms).slice(0,7);
      for(let guard=0; guard<36; guard++){
        const pays = getPaydaysForMonth(mk, settings).slice().sort((a,b)=>a-b);
        for(const p of pays){
          if(p > ms) return p;
        }
        mk = addMonthsKey(mk, 1);
      }
      return null;
    }


    function billOccurrencesForMonth(monthKey, bills, settings){
      const start = monthStartMs(monthKey);
      const end = monthEndMs(monthKey);
      const {y,m} = parseMonthKey(monthKey);
      const dim = daysInMonth(y,m);

      const occ = new Map();
      function addOcc(ms, item){
        if(!Number.isFinite(ms)) return;
        if(ms < start || ms > end) return;
        if(!occ.has(ms)) occ.set(ms, []);
        occ.get(ms).push(item);
      }

      function parseAnchorIso(rule){
        const a = rule.anchor || rule.iso || rule.date || rule.ymd || "";
        const iso = String(a || "");
        if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
        return iso;
      }

      for(const b of (bills || [])){
        const rule = (b && b.rule) ? b.rule : {};
        const type = String(rule.type || "monthly_dom");
        const item = { id:b.id, name:b.name, amount: Number(b.amount) };

        if(type === "monthly_dom"){
          const dom = clampInt(rule.dom ?? 1, 1, dim);
          addOcc(msUTC(y,m,dom), item);
          continue;
        }

        if(type === "weekly_dow"){
          const targetDow = clampInt(rule.dow ?? 1, 0, 6);
          for(let d=1; d<=dim; d++){
            const ms = msUTC(y,m,d);
            if(toDateObj(ms).dow === targetDow) addOcc(ms, item);
          }
          continue;
        }

        if(type === "annual_md"){
          const iso = parseAnchorIso(rule);
          if(!iso) continue;
          const mm = clampInt(Number(iso.slice(5,7)), 1, 12);
          const dd = clampInt(Number(iso.slice(8,10)), 1, 31);
          if(mm !== m) continue;
          addOcc(msUTC(y,m, clampInt(dd, 1, dim)), item);
          continue;
        }

        if(type === "one_time"){
          const iso = parseAnchorIso(rule);
          if(!iso) continue;
          if(iso.slice(0,7) !== monthKey) continue;
          addOcc(parseISOToMs(iso), item);
          continue;
        }

        if(type === "biweekly"){
          const iso = parseAnchorIso(rule);
          if(!iso) continue;
          const anchor = parseISOToMs(iso);
          const step = 14;
          let first = anchor;
          while(first > start) first = addDaysMs(first, -step);
          let cur = first;
          while(cur < start) cur = addDaysMs(cur, step);
          while(cur <= end){
            addOcc(cur, item);
            cur = addDaysMs(cur, step);
          }
          continue;
        }

        if(type === "perpay"){
          // Per Pay: occurs on every payday (no anchor required).
          // For pocket-only extra costs, avoid applying to months before the item was created.
          if(b && b._extraMonth && String(b._extraMonth).length === 7 && monthKey < String(b._extraMonth)) continue;
          const paydays = getPaydaysForMonth(monthKey, settings || state.settings);
          for(const p of paydays) addOcc(p, item);
          continue;
        }

        // Unknown rule => ignore
      }

      return occ;
    }

    function billOccurrencesForRange(startMs, endMs, bills, settings){
      // Build occurrences across month boundaries (used for Pocket pay periods that cross months).
      if(!Number.isFinite(startMs) || !Number.isFinite(endMs) || endMs < startMs) return new Map();
      let mk = isoDate(startMs).slice(0,7);
      const mkEnd = isoDate(endMs).slice(0,7);

      const out = new Map();
      for(let guard=0; guard<36; guard++){
        const occ = billOccurrencesForMonth(mk, bills, settings);
        for(const [dms, items] of occ.entries()){
          if(dms < startMs || dms > endMs) continue;
          if(!out.has(dms)) out.set(dms, []);
          out.get(dms).push(...items);
        }
        if(mk === mkEnd) break;
        mk = addMonthsKey(mk, 1);
      }
      return out;
    }


    
    

    function debtPaymentAmountForSchedule(d){
      return round2(Math.max(0, Number(d?.minPayment || 0) + Number(d?.extraPayment || 0)));
    }

    function debtScheduledBillsForMonth(monthKey, settings){
      // Debt items behave like scheduled bills in the Ledger/Bills-account math.
      // Actual debt balance still changes only when you log a payment in the Debt section.
      const list = Array.isArray(state?.debts) ? state.debts : [];
      const todayMk = todayIsoInTZ(APP_TZ).slice(0,7);
      const monthOffset = monthIndex(monthKey) - monthIndex(todayMk);
      const out = [];

      for(const d of list){
        if(!d || typeof d !== "object") continue;
        const amount = debtPaymentAmountForSchedule(d);
        if(amount <= 0) continue;
        if(Number(d.balance || 0) <= 0) continue;

        // Stop scheduling the debt after its estimated payoff window.
        // If the payment cannot cover interest, keep scheduling it so the Ledger still reflects the monthly obligation.
        try{
          const calc = (typeof debtPayoffCalc === "function") ? debtPayoffCalc(d) : null;
          const months = Number(calc?.months);
          if(Number.isFinite(months) && monthOffset >= Math.ceil(months)) continue;
        }catch(_){ }

        const dom = clampInt(Number(d.dueDay || 1), 1, 31);
        const nm = String(d.name || "Debt").trim() || "Debt";
        out.push({
          id: `debt-${d.id || nm}`,
          name: `Debt: ${nm}`,
          amount,
          rule: { type: "monthly_dom", dom },
          _debtId: d.id || ""
        });
      }
      return out;
    }

    function billsWithScheduledDebtsForMonth(monthKey, bills, settings){
      const base = Array.isArray(bills) ? bills : [];
      return base.concat(debtScheduledBillsForMonth(monthKey, settings || state.settings));
    }

    // Return paydays between [startMs, endMs] using the already-built plans when available.
    function paydaysInRange(startMs, endMs, ctx){
      const out = [];
      if(!Number.isFinite(startMs) || !Number.isFinite(endMs) || endMs < startMs) return out;
      let mk = isoDate(startMs).slice(0,7);
      const mkEnd = isoDate(endMs).slice(0,7);
      for(let guard=0; guard<36; guard++){
        const plan = (ctx && ctx.plans) ? ctx.plans.get(mk) : null;
        const list = (plan && Array.isArray(plan.paydays)) ? plan.paydays : getPaydaysForMonth(mk, state.settings);
        for(const p of (list || [])){
          if(p >= startMs && p <= endMs) out.push(p);
        }
        if(mk === mkEnd) break;
        mk = addMonthsKey(mk, 1);
      }
      out.sort((a,b)=>a-b);
      return out;
    }

    // Compute pocket-only "extra cost" spending + a de-duplicated name list for a given range.
    // This is used by Pocket leftover so that rule frequency always matches what the Paydays engine produced.
    function extrasSpentAndNamesForRange(startMs, endMs, ctx, extras){
      if(!Array.isArray(extras) || !Number.isFinite(startMs) || !Number.isFinite(endMs) || endMs < startMs){
        return { spent: 0, names: [] };
      }

      const names = [];
      const seen = new Set();
      let spent = 0;

      const addHit = (nm, amt, count=1)=>{
        if(!Number.isFinite(amt) || amt === 0 || count <= 0) return;
        spent += (amt * count);
        if(nm && !seen.has(nm)){
          seen.add(nm);
          names.push(nm);
        }
      };

      for(const b of extras){
        if(!b || typeof b !== "object") continue;
        const amt = Number(b.amount || 0);
        if(!Number.isFinite(amt) || amt === 0) continue;

        const nm = String(b.name || "Extra cost").trim() || "Extra cost";
        const rule = (b.rule && typeof b.rule === "object") ? b.rule : {};
        const type = String(rule.type || "monthly_dom");

        // Avoid applying before the month this item was created in (legacy-safe).
        let rs = startMs;
        if(b._extraMonth && String(b._extraMonth).length === 7){
          const created = monthStartMs(String(b._extraMonth));
          if(Number.isFinite(created)){
            if(endMs < created) continue;
            rs = Math.max(rs, created);
          }
        }

        if(type === "perpay"){
          const pays = paydaysInRange(rs, endMs, ctx);
          addHit(nm, amt, pays.length);
          continue;
        }

        if(type === "one_time"){
          const iso = String(rule.anchor || rule.iso || rule.date || rule.ymd || "");
          const ms = parseISOToMs(iso);
          if(Number.isFinite(ms) && ms >= rs && ms <= endMs) addHit(nm, amt, 1);
          continue;
        }

        if(type === "annual_md"){
          const iso = String(rule.anchor || rule.iso || rule.date || rule.ymd || "");
          if(!iso || iso.length < 10) continue;
          const mm = clampInt(Number(iso.slice(5,7)), 1, 12);
          const dd = clampInt(Number(iso.slice(8,10)), 1, 31);

          const yStart = toDateObj(rs).y;
          const yEnd = toDateObj(endMs).y;
          for(let yy=yStart; yy<=yEnd; yy++){
            const dim = daysInMonth(yy, mm);
            const d = clampInt(dd, 1, dim);
            const ms = msUTC(yy, mm, d);
            if(ms >= rs && ms <= endMs) addHit(nm, amt, 1);
          }
          continue;
        }

        if(type === "biweekly"){
          const iso = String(rule.anchor || rule.iso || rule.date || rule.ymd || "");
          const anchor = parseISOToMs(iso);
          if(!Number.isFinite(anchor)) continue;
          const step = 14;

          let cur = anchor;
          while(cur < rs) cur = addDaysMs(cur, step);

          let count = 0;
          while(cur <= endMs){
            if(cur >= rs) count += 1;
            cur = addDaysMs(cur, step);
          }
          addHit(nm, amt, count);
          continue;
        }

        if(type === "monthly_dom"){
          const dom = clampInt(rule.dom ?? 1, 1, 31);
          let mk = isoDate(rs).slice(0,7);
          const mkEnd = isoDate(endMs).slice(0,7);

          let count = 0;
          for(let guard=0; guard<36; guard++){
            const {y,m} = parseMonthKey(mk);
            const dim = daysInMonth(y,m);
            const d = clampInt(dom, 1, dim);
            const ms = msUTC(y, m, d);
            if(ms >= rs && ms <= endMs) count += 1;
            if(mk === mkEnd) break;
            mk = addMonthsKey(mk, 1);
          }
          addHit(nm, amt, count);
          continue;
        }

        if(type === "weekly_dow"){
          const targetDow = clampInt(rule.dow ?? 1, 0, 6);

          // Jump to the first matching weekday in range, then step by 7.
          let cur = rs;
          // Normalize to midnight for safety
          const ro = toDateObj(cur);
          cur = msUTC(ro.y, ro.m, ro.d);

          while(cur <= endMs && toDateObj(cur).dow !== targetDow){
            cur = addDaysMs(cur, 1);
          }

          let count = 0;
          while(cur <= endMs){
            if(cur >= rs) count += 1;
            cur = addDaysMs(cur, 7);
          }

          addHit(nm, amt, count);
          continue;
        }

        // Unknown rule => ignore
      }

      return { spent: round2(spent), names };
    }

    // Compute Event (Savings withdrawal) spending + a de-duplicated label list for a given pay-period range.
    // Events are permanent and can be one-time (and potentially recurring in the future, since they use the same rules engine).
    // Kept for Savings-related views and any future event-only breakdowns.
    function eventsSpentAndNamesForRange(startMs, endMs, ctx, eventsList){
      const list = Array.isArray(eventsList) ? eventsList : (Array.isArray(state.events) ? state.events : []);
      if(!Array.isArray(list) || !Number.isFinite(startMs) || !Number.isFinite(endMs) || endMs < startMs){
        return { spent: 0, names: [] };
      }

      // Normalize once (also migrates legacy shapes)
      allEventsList();

      const names = [];
      const seen = new Set();
      let spent = 0;

      const addHit = (nm, amt, count=1)=>{
        if(!Number.isFinite(amt) || amt === 0 || count <= 0) return;
        spent += (amt * count);
        if(nm && !seen.has(nm)){
          seen.add(nm);
          names.push(nm);
        }
      };

      // Walk month-by-month across the range to find occurrences.
      let mk = isoDate(startMs).slice(0,7);
      const mkEnd = isoDate(endMs).slice(0,7);
      for(let guard=0; guard<36; guard++){
        const occ = eventsOccurrencesForMonth(mk, list);
        for(const [ms, arr] of occ.entries()){
          if(ms < startMs || ms > endMs) continue;
          for(const it of (arr || [])){
            const amt = Number(it?.amount || 0);
            if(!Number.isFinite(amt) || amt === 0) continue;

            const ev = String(it?.event || "").trim();
            const item = String(it?.item || "").trim();

            let label = "";
            if(ev && item) label = `${ev} - ${item}`;
            else label = ev || item || "Event";

            addHit(label, amt, 1);
          }
        }
        if(mk === mkEnd) break;
        mk = addMonthsKey(mk, 1);
      }

      return { spent: round2(spent), names };
    }

function allExtrasList(){
      const out = [];
      const seen = new Set();

      function add(x, mk){
        if(!x || typeof x !== "object") return;
        if(x._extraMonth == null && mk) x._extraMonth = mk;
        if(!x.id) x.id = `${(mk || "global")}-x${Math.random().toString(16).slice(2)}`;
        if(seen.has(x.id)) return;
        seen.add(x.id);
        out.push(x);
      }

      // Preferred storage (v17+): global rules
      if(Array.isArray(state.extras)){
        for(const x of state.extras) add(x, x._extraMonth || null);
      }

      // Legacy support: per-month storage
      if(state.extrasByMonth && typeof state.extrasByMonth === "object"){
        for(const [mk, arr] of Object.entries(state.extrasByMonth)){
          if(!Array.isArray(arr)) continue;
          for(const x of arr) add(x, mk);
        }
      }
      return out;
    }

const MISC_EXTRA_ID = "__misc__";
const MISC_EXTRA_NAME = "Misc";

function isMiscExtraId(id){
      return String(id || "") === MISC_EXTRA_ID;
    }

function compareExtraCategoryNames(a, b){
      const aId = String((a && typeof a === "object") ? (a.id || "") : "");
      const bId = String((b && typeof b === "object") ? (b.id || "") : "");
      const aName = String((a && typeof a === "object") ? (a.name || "") : (a || ""));
      const bName = String((b && typeof b === "object") ? (b.name || "") : (b || ""));
      const aMisc = isMiscExtraId(aId) || aName.trim().toLowerCase() === MISC_EXTRA_NAME.toLowerCase();
      const bMisc = isMiscExtraId(bId) || bName.trim().toLowerCase() === MISC_EXTRA_NAME.toLowerCase();
      if(aMisc !== bMisc) return aMisc ? 1 : -1;
      return aName.localeCompare(bName, undefined, { sensitivity:"base", numeric:true });
    }

function pocketPlanForPeriod(startMs, monthHint){
      const hint = String(monthHint || state.selectedMonth || isoDate(startMs).slice(0,7) || "").trim() || isoDate(startMs).slice(0,7);
      const ctx = buildPlanRange(addMonthsKey(hint, -1), addMonthsKey(hint, 1), state.settings, state.bills);
      let plan = ctx.plans.get(hint) || null;
      if(plan && Array.isArray(plan.paydays) && plan.paydays.length){
        const sorted = plan.paydays.slice().sort((a,b)=>a-b);
        if(sorted.length && Number(startMs) < sorted[0]){
          const prev = ctx.plans.get(addMonthsKey(hint, -1));
          if(prev && Array.isArray(prev.paydays) && prev.paydays.length) plan = prev;
        }
      }
      if(!plan || !Array.isArray(plan.paydays) || !plan.paydays.length){
        const fallbackMk = isoDate(startMs).slice(0,7);
        plan = ctx.plans.get(fallbackMk) || plan;
      }
      return { ctx, plan };
    }

function miscBudgetForRange(startMs, endMs, projectedBudgetTotal, monthHint){
      startMs = Number(startMs);
      endMs = Number(endMs);
      if(!Number.isFinite(startMs) || !Number.isFinite(endMs)) return 0;
      if(endMs < startMs){ const t=startMs; startMs=endMs; endMs=t; }

      const info = pocketPlanForPeriod(startMs, monthHint);
      const plan = info && info.plan;
      if(!plan || !Array.isArray(plan.paydays) || !plan.paydays.length) return 0;
      const payIndex = payIndexForDate(plan, startMs);
      if(payIndex == null || payIndex < 0) return 0;
      const pocketBase = round2(pocketBasePerPaycheck(plan, payIndex));
      const miscBudget = round2(Math.max(0, pocketBase - round2(Number(projectedBudgetTotal || 0))));
      return miscBudget > 0.009 ? miscBudget : 0;
    }

function allExtraSpendEntries(){
      if(!Array.isArray(state.extraSpendEntries)) state.extraSpendEntries = [];
      const out = state.extraSpendEntries;

      for(const x of out){
        if(!x || typeof x !== "object") continue;
        if(!x.id) x.id = `xs${Math.random().toString(16).slice(2)}`;
        x.extraId = String(x.extraId || "");
        if(isMiscExtraId(x.extraId) && !x.extraName && !x.name) x.extraName = MISC_EXTRA_NAME;
        x.extraName = String(x.extraName || x.name || (isMiscExtraId(x.extraId) ? MISC_EXTRA_NAME : "Extra cost"));
        x.note = String(x.note || x.memo || "");

        const iso = normalizeISODateLoose(x.date || x.iso || x.anchor || "");
        x.date = iso || `${(state.selectedMonth || currentLocalMonthKey())}-01`;

        const normalizedAmt = round2(Number(x.amount || 0));
        const inferredType = String(x.entryType || "").trim() === "refund" || normalizedAmt < 0 ? "refund" : "spend";
        x.entryType = inferredType;
        x.amount = inferredType === "refund" ? -Math.abs(normalizedAmt) : Math.abs(normalizedAmt);
      }

      return out;
    }

function allExtraSpendTransfers(){
      if(!Array.isArray(state.extraSpendTransfers)) state.extraSpendTransfers = [];
      const out = state.extraSpendTransfers;

      for(const x of out){
        if(!x || typeof x !== "object") continue;
        if(!x.id) x.id = `xst${Math.random().toString(16).slice(2)}`;
        x.fromExtraId = String(x.fromExtraId || x.fromId || "");
        x.toExtraId = String(x.toExtraId || x.toId || "");
        x.fromExtraName = String(x.fromExtraName || x.fromName || "Extra cost");
        x.toExtraName = String(x.toExtraName || x.toName || "Extra cost");
        x.note = String(x.note || x.memo || "");
        const iso = normalizeISODateLoose(x.date || x.iso || x.anchor || "");
        x.date = iso || `${(state.selectedMonth || currentLocalMonthKey())}-01`;
        x.amount = Math.max(0, round2(Number(x.amount || 0)));
      }

      return out.filter(x=>x && x.fromExtraId && x.toExtraId && x.fromExtraId !== x.toExtraId && Number(x.amount || 0) > 0);
    }

function extraSpendCategoryOptions(){
      const out = [];
      const seen = new Set();

      const add = (id, name)=>{
        const sid = String(id || "");
        if(!sid || seen.has(sid)) return;
        seen.add(sid);
        out.push({ id: sid, name: String(name || (isMiscExtraId(sid) ? MISC_EXTRA_NAME : "Extra cost")) });
      };

      const extras = Array.isArray(state.extras) ? state.extras : [];
      for(const x of extras){
        const id = String(x?.id || "");
        add(id, String(x?.name || "Extra cost"));
      }

      add(MISC_EXTRA_ID, MISC_EXTRA_NAME);

      const logs = allExtraSpendEntries();
      for(const it of logs){
        const id = String(it?.extraId || "");
        add(id, String(it?.extraName || (isMiscExtraId(id) ? MISC_EXTRA_NAME : "Extra cost")));
      }

      return out.sort(compareExtraCategoryNames);
    }

function extraSpendSnapshotForRange(startMs, endMs, extrasList, spendEntries, transferEntries){
      const extras = Array.isArray(extrasList) ? extrasList : [];
      const logs = Array.isArray(spendEntries) ? spendEntries : [];
      const transfers = Array.isArray(transferEntries) ? transferEntries : allExtraSpendTransfers();
      const extraById = new Map(extras.map(x=>[String(x?.id || ""), x]).filter(([id])=>!!id));
      const map = new Map();

      const ensure = (id, fallbackName="Extra cost")=>{
        const sid = String(id || "");
        if(!sid) return null;

        if(!map.has(sid)){
          const ex = extraById.get(sid);
          map.set(sid, {
            id: sid,
            name: String(ex?.name || fallbackName || "Extra cost"),
            budget: 0,
            spent: 0,
            remaining: 0,
            entryCount: 0,
            transferIn: 0,
            transferOut: 0,
            transferNet: 0
          });
        }else{
          const row = map.get(sid);
          const ex = extraById.get(sid);
          if(ex?.name) row.name = String(ex.name);
          else if((!row.name || row.name === "Extra cost") && fallbackName) row.name = String(fallbackName);
        }
        return map.get(sid);
      };

      for(const x of extras){
        if(x?.id) ensure(x.id, x.name || "Extra cost");
      }

      const occ = billOccurrencesForRange(startMs, endMs, extras, state.settings);
      for(const arr of occ.values()){
        for(const it of (arr || [])){
          if(!it?.id) continue;
          const row = ensure(it.id, it.name || "Extra cost");
          if(!row) continue;
          row.budget = round2(row.budget + Number(it.amount || 0));
        }
      }

      for(const it of logs){
        if(!it || typeof it !== "object") continue;
        const iso = normalizeISODateLoose(it.date || "");
        const ms = parseISOToMs(iso);
        if(!Number.isFinite(ms) || ms < startMs || ms > endMs) continue;
        const row = ensure(it.extraId, it.extraName || "Extra cost");
        if(!row) continue;
        row.spent = round2(row.spent + Number(it.amount || 0));
        row.entryCount += 1;
      }

      for(const it of transfers){
        if(!it || typeof it !== "object") continue;
        const iso = normalizeISODateLoose(it.date || "");
        const ms = parseISOToMs(iso);
        if(!Number.isFinite(ms) || ms < startMs || ms > endMs) continue;
        const amt = Math.max(0, Number(it.amount || 0));
        if(!(amt > 0)) continue;
        const fromRow = ensure(it.fromExtraId, it.fromExtraName || "Extra cost");
        const toRow = ensure(it.toExtraId, it.toExtraName || "Extra cost");
        if(fromRow){
          fromRow.budget = round2(fromRow.budget - amt);
          fromRow.transferOut = round2(fromRow.transferOut + amt);
        }
        if(toRow){
          toRow.budget = round2(toRow.budget + amt);
          toRow.transferIn = round2(toRow.transferIn + amt);
        }
      }

      const miscRow = ensure(MISC_EXTRA_ID, MISC_EXTRA_NAME);
      if(miscRow){
        const projectedBudgetTotal = Array.from(map.values())
          .filter(row => !isMiscExtraId(row?.id))
          .reduce((sum, row)=> sum + Number(row?.budget || 0), 0);
        miscRow.name = MISC_EXTRA_NAME;
        miscRow.budget = miscBudgetForRange(startMs, endMs, projectedBudgetTotal, isoDate(endMs).slice(0,7));
      }

      const items = Array.from(map.values())
        .map(x=> ({
          ...x,
          transferNet: round2(Number(x.transferIn || 0) - Number(x.transferOut || 0)),
          remaining: round2(Number(x.budget || 0) - Number(x.spent || 0))
        }))
        .filter(x=> x.budget !== 0 || x.spent > 0 || x.entryCount > 0 || x.transferIn > 0 || x.transferOut > 0);

      items.sort(compareExtraCategoryNames);

      return {
        items,
        totals: {
          budget: round2(items.reduce((sum, x)=> sum + Number(x.budget || 0), 0)),
          spent: round2(items.reduce((sum, x)=> sum + Number(x.spent || 0), 0)),
          remaining: round2(items.reduce((sum, x)=> sum + Number(x.remaining || 0), 0))
        }
      };
    }

function extraSpendSnapshotForMonth(mk, extrasList, spendEntries, transferEntries){
      const startMs = monthStartMs(mk);
      const endMs = monthEndMs(mk);
      return extraSpendSnapshotForRange(startMs, endMs, extrasList, spendEntries, transferEntries);
    }

function allEventsList(){
      // Permanent Savings withdrawals ("Events") live in state.events.
      // Shape: {id, event, item, amount, rule:{type:"one_time", anchor:"YYYY-MM-DD"}}
      if(!Array.isArray(state.events)) state.events = [];
      const out = state.events;

      // In-place migration/normalization so calculations + UI are stable.
      for(const x of out){
        if(!x || typeof x !== "object") continue;

        // Legacy support: {date,event,item,amount} or {iso,...}
        const iso = normalizeISODateLoose(x?.rule?.anchor || x?.date || x?.iso || "");
        if(!x.rule){
          if(iso) x.rule = { type:"one_time", anchor: iso };
        }else{
          if(x.rule && x.rule.anchor) x.rule.anchor = normalizeISODateLoose(x.rule.anchor) || x.rule.anchor;
          if(!x.rule.type) x.rule.type = "one_time";
        }

        if(!x.event && x.name) x.event = String(x.name);
        x.event = String(x.event || "Event");
        x.item = String(x.item || "");
        x.amount = Number(x.amount || 0);

        // Build a display name for Events (used in lists/labels).
        x.name = `Event: ${x.event}${x.item ? " - " + x.item : ""}`;

        if(!x.id){
          const mk = monthKeyFromISODateLoose(iso) || (state.selectedMonth || currentLocalMonthKey());
          x.id = `${mk}-e${Math.random().toString(16).slice(2)}`;
        }
      }

      return out;
    }

/***********************
 * Pocket breakdown modal
 ***********************/
function closePocketBreakdown(){
  const overlay = document.getElementById("pocketBreakdownOverlay");
  if(!overlay) return;
  overlay.classList.add("hidden");
  overlay.setAttribute("aria-hidden","true");
}

function openPocketBreakdownModal(title, html){
  const overlay = document.getElementById("pocketBreakdownOverlay");
  const titleEl = document.getElementById("pocketBreakdownTitle");
  const bodyEl  = document.getElementById("pocketBreakdownBody");
  const closeBtn= document.getElementById("pocketBreakdownClose");
  if(!overlay || !titleEl || !bodyEl || !closeBtn) return;

  titleEl.textContent = title || "Pocket breakdown";
  bodyEl.innerHTML = html || "";

  overlay.classList.remove("hidden");
  overlay.setAttribute("aria-hidden","false");

  const onKey = (e)=>{ if(e.key === "Escape"){ e.preventDefault(); cleanup(); closePocketBreakdown(); } };
  const onOverlay = (e)=>{ if(e.target === overlay){ cleanup(); closePocketBreakdown(); } };
  const onClose = (e)=>{ e.preventDefault(); cleanup(); closePocketBreakdown(); };

  function cleanup(){
    document.removeEventListener("keydown", onKey);
    overlay.removeEventListener("click", onOverlay);
    closeBtn.removeEventListener("click", onClose);
  }

  document.addEventListener("keydown", onKey);
  overlay.addEventListener("click", onOverlay);
  closeBtn.addEventListener("click", onClose);

  try{ closeBtn.focus({ preventScroll:true }); }catch(_){}
}

function _pocketBDItemsTable(items){
  if(!items || !items.length){
    return `<div class="muted pocketBDNone">none</div>`;
  }
  const rows = items.map(it=>{
    const dt = escapeHtml(isoDate(it.ms));
    const nm = escapeHtml(String(it.name || ""));
    const amt = fmtMoney(Number(it.amount || 0));
    return `<tr><td class="mono">${dt}</td><td>${nm}</td><td class="right num">− ${amt}</td></tr>`;
  }).join("");
  return `
    <table class="pocketBDItems">
      <thead>
        <tr><th>Date</th><th>Item</th><th class="right">Amount</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function pocketLoggedSpendItemsForRange(startMs, endMs, spendEntries){
  startMs = Number(startMs);
  endMs = Number(endMs);
  if(!Number.isFinite(startMs) || !Number.isFinite(endMs)) return [];
  if(endMs < startMs){ const t = startMs; startMs = endMs; endMs = t; }

  const logs = Array.isArray(spendEntries) ? spendEntries : allExtraSpendEntries();
  const out = [];
  for(const it of logs){
    if(!it || typeof it !== "object") continue;
    const iso = normalizeISODateLoose(it.date || it.iso || it.anchor || "");
    const ms = parseISOToMs(iso);
    if(!Number.isFinite(ms) || ms < startMs || ms > endMs) continue;
    const raw = round2(Number(it.amount || 0));
    const isRefund = String(it.entryType || "").trim() === "refund" || raw < 0;
    out.push({
      ms,
      name: String(it.extraName || it.name || "Extra cost"),
      amount: Math.abs(raw),
      signedAmount: isRefund ? Math.abs(raw) : -Math.abs(raw),
      isRefund
    });
  }
  out.sort((a,b)=> a.ms - b.ms || String(a.name || "").localeCompare(String(b.name || ""), undefined, { sensitivity:"base", numeric:true }));
  return out;
}

function _pocketBDLoggedEntriesTable(items, snapshotItems){
  const rowsByName = new Map();

  const ensure = (name)=>{
    const nm = String(name || "").trim() || "Uncategorized";
    if(!rowsByName.has(nm)) rowsByName.set(nm, { name: nm, projected: 0, actual: 0 });
    return rowsByName.get(nm);
  };

  const snap = Array.isArray(snapshotItems) ? snapshotItems : [];
  for(const it of snap){
    if(!it || typeof it !== "object") continue;
    const row = ensure(it.name);
    row.projected = round2(Number(row.projected || 0) + Number(it.budget || 0));
    row.actual = round2(Number(row.actual || 0) + Number(it.spent || 0));
  }

  const list = Array.isArray(items) ? items : [];
  if(!snap.length){
    for(const it of list){
      if(!it || typeof it !== "object") continue;
      const row = ensure(it.name);
      row.actual = round2(Number(row.actual || 0) + Math.abs(Number(it.signedAmount || 0)));
    }
  }

  const rows = Array.from(rowsByName.values())
    .filter(it=> Math.abs(Number(it.projected || 0)) > 0.0001 || Math.abs(Number(it.actual || 0)) > 0.0001)
    .sort(compareExtraCategoryNames)
    .map(it=>{
      const nm = escapeHtml(String(it.name || ""));
      const projectedNum = Math.abs(Number(it.projected || 0));
      const actualNum = Math.abs(Number(it.actual || 0));
      const projected = fmtMoney(projectedNum);
      const actual = fmtMoney(actualNum);
      const actualClass = actualNum > projectedNum + 0.0001 ? ' pocketActualCell overProjected' : ' pocketActualCell';
      return `<tr><td>${nm}</td><td class="right num pocketProjCell">− ${projected}</td><td class="right num${actualClass}">− ${actual}</td></tr>`;
    }).join("");

  if(!rows){
    return `<div class="muted pocketBDNone">none</div>`;
  }

  return `
    <table class="pocketBDItems">
      <thead>
        <tr><th>Category</th><th class="right pocketProjCol">Projected</th><th class="right pocketActualCol">Actual</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function pocketLineItemsForRange(startMs, endMs, ctx, list, kind){
  startMs = Number(startMs);
  endMs = Number(endMs);
  if(!Number.isFinite(startMs) || !Number.isFinite(endMs)) return { total: 0, items: [] };
  if(endMs < startMs){ const t=startMs; startMs=endMs; endMs=t; }

  // Normalize lists so we can reliably build occurrences and labels.
  const norm = Array.isArray(list) ? list : [];
  if(kind === "event"){
    try{ allEventsList(); }catch(_){ }
  }
  if(kind === "extra"){
    // Minimal in-place normalization + legacy support (iso/memo/date => one-time anchor)
    for(const x of norm){
      if(!x || typeof x !== "object") continue;
      // Legacy: {iso,memo,amount}
      if((x.iso || x.date || x.ymd) && !x.rule){
        const iso = normalizeISODateLoose(x.iso || x.date || x.ymd || "");
        if(iso){
          x.rule = { type: "one_time", anchor: iso };
        }
      }
      if(x.rule && typeof x.rule === "object"){
        if(x.rule.anchor) x.rule.anchor = normalizeISODateLoose(x.rule.anchor) || x.rule.anchor;
        if(!x.rule.type) x.rule.type = "one_time";
      }
      if(!x.name && x.memo) x.name = String(x.memo);
      x.amount = Number(x.amount || 0);
    }
  }

  // Build occurrences using the same rules engine used elsewhere.
  const occ = billOccurrencesForRange(startMs, endMs, norm, state.settings || {});

  const items = [];
  let total = 0;
  for(const [ms, arr] of occ.entries()){
    for(const it of (arr || [])){
      const a = round2(Number(it?.amount || 0));
      if(!Number.isFinite(a) || a === 0) continue;
      const nm = (String(it?.name || "").trim()) || (kind === "event" ? "Event" : "Extra cost");
      total = round2(total + a);
      items.push({ ms: Number(ms), name: nm, amount: a });
    }
  }

  items.sort((a,b)=>a.ms - b.ms);
  return { total: round2(total), items };
}

function openPocketBreakdownFromCtx(ctx, mk, startMs, endMs){
  try{
    startMs = Number(startMs);
    endMs = Number(endMs);
    if(!Number.isFinite(startMs) || !Number.isFinite(endMs)) return;
    if(endMs < startMs){ const t=startMs; startMs=endMs; endMs=t; }

    mk = (String(mk || "").trim()) || isoDate(startMs).slice(0,7);
    const plan = (ctx && ctx.plans) ? ctx.plans.get(mk) : null;
    if(!plan){
      try{ quickToast("No plan available for that pay period."); }catch(_){}
      return;
    }

    const payIndex = payIndexForDate(plan, startMs);
    const cap = round2(capForPayIndex(plan, payIndex));
    const billsPer = round2(Number(plan.billsPerPaycheck || 0));
    const savPer   = round2(Number(plan.savingsPerPaycheck || 0));
    const base     = round2(pocketBasePerPaycheck(plan, payIndex));

    const capInfo = getPayCapInfoForMonth(mk, state.settings, plan.paydays);
    const cap1 = round2(Number((capInfo && capInfo.pay1Caps) ? capInfo.pay1Caps[payIndex] : 0));
    const cap2 = round2(Number((capInfo && capInfo.pay2Caps) ? capInfo.pay2Caps[payIndex] : 0));
    const capOther = round2(Number((capInfo && capInfo.otherIncomeAlloc) ? capInfo.otherIncomeAlloc[payIndex] : 0));
    const multiCap = (cap2 > 0.009) || (capOther > 0.009);

    const split = ensureTransferSplit(state.settings);
    const p2BillsPct    = (cap2 > 0.009) ? split.pay2BillsPct : 0;
    const otherBillsPct = (capOther > 0.009) ? split.otherBillsPct : 0;
    const p2SavPct      = (cap2 > 0.009) ? split.pay2SavingsPct : 0;
    const otherSavPct   = (capOther > 0.009) ? split.otherSavingsPct : 0;

    const billsSplit = splitTransferAmount(billsPer, p2BillsPct, otherBillsPct);
    const savSplit   = splitTransferAmount(savPer,  p2SavPct,  otherSavPct);

    const extras = pocketLineItemsForRange(startMs, endMs, ctx, allExtrasList(), "extra");
    const loggedSnapshot = extraSpendSnapshotForRange(startMs, endMs, allExtrasList(), allExtraSpendEntries(), allExtraSpendTransfers());
    const projectedSpent = round2((extras.total || 0));
    const projectedSpentDisplay = round2(projectedSpent + Math.max(0, base - projectedSpent));
    const actualSpent = round2((loggedSnapshot && loggedSnapshot.totals ? loggedSnapshot.totals.spent : 0) || 0);
    const projectedNet = round2(base - projectedSpent);
    const currentNet = round2(base - actualSpent);
    const thresholdInfo = pocketMinimumInfo(plan, payIndex, projectedNet, actualSpent);
    const thresholdHtml = pocketThresholdExplainHtml(thresholdInfo);

    const title = `Pocket breakdown — ${fmtMonthKeyShort(mk)} — ${fmtMD(startMs)}`;
    const html = `
      ${thresholdHtml}
      <div class="pocketBDRange">
        <span class="muted">Pay period:</span>
        <span class="mono">${escapeHtml(isoDate(startMs))}</span>
        <span class="muted">→</span>
        <span class="mono">${escapeHtml(isoDate(endMs))}</span>
      </div>

      <div class="pocketBDGrid">
        <div class="pocketBDStat">
          <div class="hint">Projected free to spend</div>
          <div class="num ${(thresholdInfo && thresholdInfo.mode === "net") ? "neg" : ""}">${fmtMoney(projectedNet)}</div>
        </div>
        <div class="pocketBDStat">
          <div class="hint">Available to spend</div>
          <div class="num ${currentNet < 0 ? "neg" : ""}">${fmtMoney(currentNet)}</div>
        </div>
        <div class="pocketBDStat">
          <div class="hint">Pocket base</div>
          <div class="num ${(thresholdInfo && thresholdInfo.mode === "base") ? "neg" : ""}">${fmtMoney(base)}</div>
        </div>
        <div class="pocketBDStat">
          <div class="hint">Spent</div>
          <div class="num">${fmtMoney(actualSpent)}</div>
        </div>
      </div>

      <div class="pocketBDCols">
        <div class="pocketBDCard">
          <div class="pocketBDH">How Pocket base is built</div>
          <table class="pocketBDTable">
            <tbody>
              <tr><td>Paycheck cap</td><td class="right num">${fmtMoney(cap)}</td></tr>
              ${multiCap ? `
                ${cap1 ? `<tr class="sub"><td>Income 1</td><td class="right num">${fmtMoney(cap1)}</td></tr>` : ``}
                ${cap2 ? `<tr class="sub"><td>Income 2</td><td class="right num">${fmtMoney(cap2)}</td></tr>` : ``}
                ${capOther ? `<tr class="sub"><td>Additional income</td><td class="right num">${fmtMoney(capOther)}</td></tr>` : ``}
              ` : ``}

              <tr><td>Bills transfer</td><td class="right num">− ${fmtMoney(billsPer)}</td></tr>
              ${multiCap ? ( (p2BillsPct>0 && cap2>0.009) || (otherBillsPct>0 && capOther>0.009) ? `
                ${(cap2>0.009 && p2BillsPct>0) ? `<tr class="sub"><td>Income 2 (${p2BillsPct}%)</td><td class="right num">− ${fmtMoney(billsSplit.pay2)}</td></tr>` : ``}
                ${(capOther>0.009 && otherBillsPct>0) ? `<tr class="sub"><td>Additional income (${otherBillsPct}%)</td><td class="right num">− ${fmtMoney(billsSplit.other)}</td></tr>` : ``}
                <tr class="sub"><td>Income 1 (rest)</td><td class="right num">− ${fmtMoney(billsSplit.source1)}</td></tr>
              ` : `
                <tr class="sub"><td>From Income 1</td><td class="right num">− ${fmtMoney(billsPer)}</td></tr>
              `) : ``}

              <tr><td>Savings transfer</td><td class="right num">− ${fmtMoney(savPer)}</td></tr>
              ${multiCap ? ( (p2SavPct>0 && cap2>0.009) || (otherSavPct>0 && capOther>0.009) ? `
                ${(cap2>0.009 && p2SavPct>0) ? `<tr class="sub"><td>Income 2 (${p2SavPct}%)</td><td class="right num">− ${fmtMoney(savSplit.pay2)}</td></tr>` : ``}
                ${(capOther>0.009 && otherSavPct>0) ? `<tr class="sub"><td>Additional income (${otherSavPct}%)</td><td class="right num">− ${fmtMoney(savSplit.other)}</td></tr>` : ``}
                <tr class="sub"><td>Income 1 (rest)</td><td class="right num">− ${fmtMoney(savSplit.source1)}</td></tr>
              ` : `
                <tr class="sub"><td>From Income 1</td><td class="right num">− ${fmtMoney(savPer)}</td></tr>
              `) : ``}
              <tr class="pocketBDTotal"><td><strong>Pocket base</strong></td><td class="right num ${(thresholdInfo && thresholdInfo.mode === 'base') ? 'neg' : ''}"><strong>${fmtMoney(base)}</strong></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pocketBDCard">
          <div class="pocketBDH">Pocket status for this pay period</div>
          <table class="pocketBDTable">
            <tbody>
              <tr class="pocketBDGroup pocketProjHead"><td colspan="2">Projected</td></tr>
              <tr class="pocketProj"><td>Projected spending</td><td class="right num">− ${fmtMoney(projectedSpentDisplay)}</td></tr>
              <tr class="pocketProj pocketBDTotal"><td><strong>Projected free to spend</strong></td><td class="right num ${projectedNet > 0 ? 'pos' : ((thresholdInfo && thresholdInfo.mode === 'net') ? 'neg' : '')}"><strong>${fmtMoney(projectedNet)}</strong></td></tr>
              <tr class="pocketBDGroup pocketActualHead"><td colspan="2">Actual</td></tr>
              <tr class="pocketActual"><td>Actual spent from logs</td><td class="right num">− ${fmtMoney(actualSpent)}</td></tr>
              <tr class="pocketActual pocketBDTotal"><td><strong>Available to spend</strong></td><td class="right num ${currentNet > 0 ? 'pos' : (currentNet < 0 ? 'neg' : '')}"><strong>${fmtMoney(currentNet)}</strong></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="pocketBDSection">
        <div class="pocketBDH2">Projected vs actual spending by category in this pay period</div>
        ${_pocketBDLoggedEntriesTable(pocketLoggedSpendItemsForRange(startMs, endMs, allExtraSpendEntries()), loggedSnapshot && loggedSnapshot.items)}
      </div>

    `;

    openPocketBreakdownModal(title, html);
  }catch(err){
    console.error(err);
    try{ quickToast("Could not open breakdown."); }catch(_){}
  }
}


// ===== Pocket (per pay period) inline breakdown (expand inside the selected box) =====
function pocketKey(mk, startMs, endMs){
  return String(mk||"") + "|" + String(startMs||"") + "|" + String(endMs||"");
}

function collapsePocketItemInline(item){
  if(!item) return;
  item.classList.remove("expanded");
  item.setAttribute("aria-expanded","false");
  const exp = item.querySelector(".pocketExpand");
  if(exp) exp.remove();
}

function pocketBreakdownHtmlInline(ctx, mk, startMs, endMs){
  try{
    startMs = Number(startMs);
    endMs   = Number(endMs);
    if(!Number.isFinite(startMs) || !Number.isFinite(endMs)) return null;
    if(endMs < startMs){ const t=startMs; startMs=endMs; endMs=t; }

    mk = (String(mk || "").trim()) || isoDate(startMs).slice(0,7);
    const plan = (ctx && ctx.plans) ? ctx.plans.get(mk) : null;
    if(!plan){
      return `<div class="muted">No plan available for that pay period.</div>`;
    }

    const payIndex = payIndexForDate(plan, startMs);
    const cap = round2(capForPayIndex(plan, payIndex));
    const billsPer = round2(Number(plan.billsPerPaycheck || 0));
    const savPer   = round2(Number(plan.savingsPerPaycheck || 0));
    const base     = round2(pocketBasePerPaycheck(plan, payIndex));

    const extras = pocketLineItemsForRange(startMs, endMs, ctx, allExtrasList(), "extra");
    const loggedSnapshot = extraSpendSnapshotForRange(startMs, endMs, allExtrasList(), allExtraSpendEntries(), allExtraSpendTransfers());
    const projectedSpent = round2((extras.total || 0));
    const projectedSpentDisplay = round2(projectedSpent + Math.max(0, base - projectedSpent));
    const actualSpent = round2((loggedSnapshot && loggedSnapshot.totals ? loggedSnapshot.totals.spent : 0) || 0);
    const projectedNet = round2(base - projectedSpent);
    const currentNet = round2(base - actualSpent);
    const thresholdInfo = pocketMinimumInfo(plan, payIndex, projectedNet, actualSpent);
    const thresholdHtml = pocketThresholdExplainHtml(thresholdInfo);

    // Inline header (kept compact)
    const hdr = `
      <div class="pocketBDRange" style="margin-bottom:10px">
        <span class="muted">Pay period:</span>
        <span class="mono">${escapeHtml(isoDate(startMs))}</span>
        <span class="muted">→</span>
        <span class="mono">${escapeHtml(isoDate(endMs))}</span>
        <span class="muted" style="margin-left:8px">tap again to collapse</span>
      </div>
    `;

    const html = `
      ${thresholdHtml}
      ${hdr}

      <div class="pocketBDCols pocketBDColsInline">
        <div class="pocketBDCard">
          <div class="pocketBDH">How the pocket base is built</div>
          <table class="pocketBDTable">
            <tbody>
              <tr><td>Paycheck cap</td><td class="right num">${fmtMoney(cap)}</td></tr>
              <tr><td>Bills transfer</td><td class="right num">− ${fmtMoney(billsPer)}</td></tr>
              <tr><td>Savings transfer</td><td class="right num">− ${fmtMoney(savPer)}</td></tr>
              <tr class="pocketBDTotal"><td><strong>Pocket base</strong></td><td class="right num"><strong>${fmtMoney(base)}</strong></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pocketBDCard">
          <div class="pocketBDH">Pocket status for this pay period</div>
          <table class="pocketBDTable">
            <tbody>
              <tr class="pocketBDGroup pocketProjHead"><td colspan="2">Projected</td></tr>
              <tr class="pocketProj"><td>Projected spending</td><td class="right num">− ${fmtMoney(projectedSpentDisplay)}</td></tr>
              <tr class="pocketProj pocketBDTotal"><td><strong>Projected free to spend</strong></td><td class="right num ${projectedNet > 0 ? 'pos' : ((thresholdInfo && thresholdInfo.mode === 'net') ? 'neg' : '')}"><strong>${fmtMoney(projectedNet)}</strong></td></tr>
              <tr class="pocketBDGroup pocketActualHead"><td colspan="2">Actual</td></tr>
              <tr class="pocketActual"><td>Actual spent from logs</td><td class="right num">− ${fmtMoney(actualSpent)}</td></tr>
              <tr class="pocketActual pocketBDTotal"><td><strong>Available to spend</strong></td><td class="right num ${currentNet > 0 ? 'pos' : (currentNet < 0 ? 'neg' : '')}"><strong>${fmtMoney(currentNet)}</strong></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="pocketBDSection">
        <div class="pocketBDH2">Projected vs actual spending by category in this pay period</div>
        ${_pocketBDLoggedEntriesTable(pocketLoggedSpendItemsForRange(startMs, endMs, allExtraSpendEntries()), loggedSnapshot && loggedSnapshot.items)}
      </div>

    `;

    return html;
  }catch(err){
    console.error(err);
    return `<div class="muted">Could not build breakdown for this pay period.</div>`;
  }
}

function expandPocketItemInline(item, ctx, silent){
  try{
    if(!item) return;
    // Remove any existing expansion
    const old = item.querySelector(".pocketExpand");
    if(old) old.remove();

    const mk = item.dataset.mk;
    const startMs = item.dataset.start;
    const endMs   = item.dataset.end;

    const exp = document.createElement("div");
    exp.className = "pocketExpand";
    exp.addEventListener("click", (ev)=> ev.stopPropagation());
    exp.addEventListener("mousedown", (ev)=> ev.stopPropagation());
    exp.addEventListener("touchstart", (ev)=> ev.stopPropagation(), {passive:true});

    const html = pocketBreakdownHtmlInline(ctx, mk, startMs, endMs);
    exp.innerHTML = html || `<div class="muted">No breakdown available for that pay period.</div>`;

    item.classList.add("expanded");
    item.setAttribute("aria-expanded","true");
    item.appendChild(exp);
  }catch(err){
    console.error(err);
    if(!silent){
      // As a fallback, show an inline error (no toast)
      try{
        const exp = document.createElement("div");
        exp.className = "pocketExpand";
        exp.textContent = "Could not open breakdown.";
        item.classList.add("expanded");
        item.appendChild(exp);
      }catch(_){}
    }
  }
}

function togglePocketBreakdownInline(e, item, ctx){
  try{
    // Clicking inside the expanded details should NOT toggle/collapse.
    if(e && e.target && e.target.closest && e.target.closest(".pocketExpand")) return;

    if(!state.ui) state.ui = {};

    const scope = item && item.parentElement ? item.parentElement : document;
    // Close any other expanded items within this same list
    scope.querySelectorAll(".pocketItem.expanded").forEach((it)=>{
      if(it !== item) collapsePocketItemInline(it);
    });

    if(item.classList.contains("expanded")){
      collapsePocketItemInline(item);
      state.ui.pocketExpandedKey = null;
      return;
    }

    const key = item.dataset.pk || pocketKey(item.dataset.mk, item.dataset.start, item.dataset.end);
    state.ui.pocketExpandedKey = key;

    expandPocketItemInline(item, ctx);
  }catch(err){
    console.error(err);
  }
}


function eventsOccurrencesForMonth(monthKey, listOverride){
      // Events are Savings withdrawals; compute their occurrences within the given month.
      const list = Array.isArray(listOverride) ? listOverride : (Array.isArray(state.events) ? state.events : []);
      // Ensure names/rules are normalized
      allEventsList();
      return billOccurrencesForMonth(monthKey, list, state.settings);
    }


function extrasOccurrencesForMonth(monthKey, listOverride){
      // Pocket-only extra costs are global rules; compute their occurrences within the given month.
      const list = Array.isArray(listOverride) ? listOverride : (Array.isArray(state.extras) ? state.extras : []);

      // Migrate any legacy shapes in-place: {iso, memo, amount} -> {name, amount, rule:{type:"one_time", anchor:iso}}
      for(const x of list){
        if(!x || typeof x !== "object") continue;
        if((x.iso || x.memo) && !x.rule){
          const iso = String(x.iso || `${(x._extraMonth || monthKey)}-01`);
          x.name = String(x.name || x.memo || "Extra cost");
          x.amount = Number(x.amount || 0);
          x.rule = { type: "one_time", anchor: iso };
          delete x.iso;
          delete x.memo;
        }else{
          if(!x.name && x.memo) x.name = String(x.memo);
        }
      }

      return billOccurrencesForMonth(monthKey, list, state.settings);
    }


    function computeAS2ForMonth(monthKey, settings, bills){
      const paydays = getPaydaysForMonth(monthKey, settings);
      const occ = billOccurrencesForMonth(monthKey, bills, settings);

      const start = monthStartMs(monthKey);
      const end = monthEndMs(monthKey);
      const P1 = (paydays.length > 0) ? paydays[0] : addDaysMs(end, 1);

      let pre = 0;
      for(let ms = start; ms <= end; ms = addDaysMs(ms,1)){
        if(ms < P1){
          const list = occ.get(ms) || [];
          for(const it of list) pre += Number(it.amount);
        }
      }
      const as2 = round2(pre + Number(settings.cushion || 0));
      return { as2, prePaycheckTotal: round2(pre), P1, paydays };
    }

    function monthIndex(key){
      const {y,m} = parseMonthKey(key);
      return y*12 + (m-1);
    }
    function monthKeyFromIndex(i){
      const y = Math.floor(i/12);
      const m = (i%12)+1;
      return monthKeyFrom(y,m);
    }

    function getTrueSavingsMonth(settings, fallbackMonth){
      try{
        const t = (settings && settings.trueSavingsMonth != null) ? String(settings.trueSavingsMonth).trim() : "";
        return t || (fallbackMonth || "");
      }catch{
        return (fallbackMonth || "");
      }
    }
    function projectedSavingsAtMonthStart(targetMonth, settings, goalOverride){
      const mk = (targetMonth || "").trim();
      if(!mk) return 0;

      const goal = Number((goalOverride != null && Number.isFinite(Number(goalOverride))) ? goalOverride : (settings?.savings?.monthlyGoal || 0));
      const trueMonth = getTrueSavingsMonth(settings, mk);
      const trueBal = Number(settings?.baseSavingsBalance || 0);

      const a = monthIndex(mk);
      const b = monthIndex(trueMonth);
      if(!Number.isFinite(a) || !Number.isFinite(b)) return round2(trueBal);

      const diff = a - b;
      let base = round2(trueBal + (diff * goal));

      // Permanent Events are Savings withdrawals. Subtract any that occur AFTER trueSavingsMonth
      // and BEFORE the start of the target month.
      try{
        const list = Array.isArray(state?.events) ? state.events : [];
        if(list.length){
          let evSum = 0;
          for(const x of list){
            if(!x) continue;
            const iso = normalizeISODateLoose(x?.rule?.anchor || x?.date || x?.iso || "");
            if(!iso) continue;
            const mkx = iso.slice(0,7);
            const ix = monthIndex(mkx);
            if(!Number.isFinite(ix)) continue;
            if(ix < b) continue;     // before true month already included in trueBal
            if(ix >= a) continue;    // in/after target month
            evSum += Number(x.amount || 0);
          }
          if(evSum) base = round2(base - evSum);
        }
      }catch(_){}

      return round2(base);
    }

    // Build plans for a month range.
    // NOTE: rangeStart (the first argument) does not have to equal the "anchor" Base month.
    // If the user sets Base month (TB2) to a future month, we still need to be able to
    // render earlier viewed months (so the app doesn't blank out).
    function buildPlanRange(baseMonth, toMonthInclusive, settings, bills){
      const months = [];
      const baseIndex = monthIndex(baseMonth);
      const toIndex = monthIndex(toMonthInclusive) + 1;
      for(let i=baseIndex; i<=toIndex; i++){
        months.push(monthKeyFromIndex(i));
      }

      const as2Map = new Map();
      const paydaysMap = new Map();
      const occMap = new Map();
      const extraOccMap = new Map();
      const eventOccMap = new Map();
      const tb1Map = new Map();

      const allExtras = allExtrasList();
      const allEvents = allEventsList();

      for(const mk of months){
        const ledgerBills = billsWithScheduledDebtsForMonth(mk, bills, settings);
        const occ = billOccurrencesForMonth(mk, ledgerBills, settings);
        occMap.set(mk, occ);

        const xocc = extrasOccurrencesForMonth(mk, allExtras);
        extraOccMap.set(mk, xocc);

        const eocc = eventsOccurrencesForMonth(mk, allEvents);
        eventOccMap.set(mk, eocc);

        let tb1 = 0;
        for(const arr of occ.values()){
          for(const it of arr) tb1 += Number(it.amount);
        }
        tb1Map.set(mk, round2(tb1));

        const {as2, paydays} = computeAS2ForMonth(mk, settings, ledgerBills);
        as2Map.set(mk, as2);
        paydaysMap.set(mk, paydays);
      }

      const plans = new Map();

      const seedMonth = String(baseMonth || "").trim();
      const anchorMonth = String((settings && settings.baseMonth) ? settings.baseMonth : seedMonth).trim() || seedMonth;

      // Seed the very first month in the computed range.
      // - If the range starts at the anchor month, respect the user's true TB2.
      // - Otherwise, seed with that month’s AS2 (so top-up/sweep starts at 0 and projections remain stable).
      let billsStart = (seedMonth && anchorMonth && seedMonth === anchorMonth)
        ? Number(settings.baseBillsBalance || 0)
        : Number(as2Map.get(seedMonth) || 0);

      // Savings always uses the projection anchored to trueSavingsMonth.
      let savingsStart = Number(projectedSavingsAtMonthStart(seedMonth, settings) || 0);

      for(let idx=0; idx<months.length-1; idx++){
        const mk = months[idx];
        const nextMk = months[idx+1];

        // If the anchor month is inside the range but isn't the first month, reset TB2 here.
        // This prevents the app from blanking out when the user chooses a Base month in the future.
        if(anchorMonth && mk === anchorMonth && mk !== seedMonth){
          billsStart = Number(settings.baseBillsBalance || 0);
        }

        const monthStart = monthStartMs(mk);
        const monthEnd = monthEndMs(mk);

        
        const startBills = billsStart;
        const startSavings = savingsStart;
const AS2 = as2Map.get(mk);
        const TargetCarry = as2Map.get(nextMk);
        const TB1 = tb1Map.get(mk);
        const payCapInfo = getPayCapInfoForMonth(mk, settings, paydaysMap.get(mk));
        const paydays = payCapInfo.paydays;
        const payCaps = payCapInfo.payCaps;
        const minPayCap = payCapInfo.minCap;
        const otherIncomeTotal = payCapInfo.otherIncomeTotal;
        const otherIncomePerPayday = payCapInfo.otherIncomePerPayday;
        const otherIncomeAlloc = payCapInfo.otherIncomeAlloc;

        const sortedPaydays = (Array.isArray(paydays) ? paydays : []).slice().sort((a,b)=>a-b);
        const lastPayday = sortedPaydays.length ? sortedPaydays[sortedPaydays.length-1] : null;
        const nextPaydayAfterLast = (lastPayday != null) ? nextPaydayAfterMs(lastPayday, settings) : null;
        const occ = occMap.get(mk);
        const xocc = extraOccMap.get(mk);
        const eocc = eventOccMap.get(mk);

        const seedBaseTarget = round2(AS2); // AS2 = bills due before first payday + Cushion
        const cushion = Number(settings.cushion || 0);

        // Plan in "working" terms so the Bills balance is expected to approach the Cushion at least once.
        // Any extra cash already sitting in Bills above this planned seed is treated as retained surplus:
        // it stays in Bills, but is excluded from the working balance shown in the Ledger.
        const seedForPlanning = round2(seedBaseTarget); // planned seed (working)
        const b0 = round2(seedForPlanning - cushion); // buffer above cushion in working terms

        const N = paydays.length;

        const savingsGoal = Number(settings.savings.monthlyGoal || 0);
        const savingsPerPaycheck = (N>0) ? round2(savingsGoal / N) : 0;

        const cap = Number(minPayCap || 0);
        const maxBillsPerPaycheck = Math.max(0, round2(cap - savingsPerPaycheck));

        // Nominal fixed transfer to land next month at the target carry.
        const totalNeeded = Math.max(0, TargetCarry + TB1 - seedForPlanning);
        const nominalBillsPerPaycheck = (N>0) ? ceil2(totalNeeded / N) : 0;

        // Minimum fixed transfer needed so Bills acct never drops below the cushion (no extra funding).
        let minBillsPerPaycheckForCushion = 0;
        if(N > 0){
          let D = 0; // paydays encountered so far (deposit happens at start of payday)
          let W = 0; // cumulative bills through this day
          let maxReq = 0;
          for(let t = monthStart; t <= monthEnd; t = addDaysMs(t,1)){
            if(paydays.includes(t)) D += 1;
            const dayBills = occ.get(t) || [];
            for(const it of dayBills) W += Number(it.amount);
            if(D > 0){
              const req = (W - b0) / D;
              if(req > maxReq) maxReq = req;
            }
          }
          minBillsPerPaycheckForCushion = ceil2(Math.max(0, maxReq));
        }

        // Choose a fixed per-payday bills transfer (bounded by paycheck cap).
        const desiredBillsPerPaycheck = Math.max(nominalBillsPerPaycheck, minBillsPerPaycheckForCushion);
        const billsPerPaycheck = Math.min(desiredBillsPerPaycheck, maxBillsPerPaycheck);

        // If capped transfers still can't maintain the cushion / target carry, compute the minimum
        // extra funding required at month start (taken from external money / pocket).
        let extraFunding = 0;
        if(N > 0){
          let D = 0;
          let W = 0;
          let maxNeed = 0;
          for(let t = monthStart; t <= monthEnd; t = addDaysMs(t,1)){
            if(paydays.includes(t)) D += 1;
            const dayBills = occ.get(t) || [];
            for(const it of dayBills) W += Number(it.amount);
            const need = W - (b0 + (billsPerPaycheck * D));
            if(need > maxNeed) maxNeed = need;
          }
          const needForCushion = Math.max(0, maxNeed);
          const endWithoutExtra = round2(seedForPlanning + (billsPerPaycheck * N) - TB1);
          const needForTargetCarry = Math.max(0, TargetCarry - endWithoutExtra);
          extraFunding = ceil2(Math.max(needForCushion, needForTargetCarry));
        }else{
          const endWithoutExtra = round2(seedForPlanning - TB1);
          extraFunding = ceil2(Math.max(0, TargetCarry - endWithoutExtra));
        }

        const seedWanted = round2(seedForPlanning + extraFunding); // planned working start
        const billsStartSurplus = round2(Math.max(0, billsStart - seedWanted)); // retained in Bills, excluded from working
        const topup = round2(Math.max(0, seedWanted - billsStart)); // hidden external top-up if Bills starts too low
        const sweepOut = 0; // we never push Bills surplus into Pocket automatically
        const startAfterTopup = round2(billsStart + topup); // true Bills balance after top-up


        const rows = [];
        let billsBal = startAfterTopup;
        let savingsBal = savingsStart;

        let lowestBillsBal = Infinity;
        let lowestBillsBalDate = null;

        for(let ms = monthStart; ms <= monthEnd; ms = addDaysMs(ms,1)){
          const isPayday = paydays.includes(ms);
          const isMonthStart = (ms === monthStart);

          let transferIn = 0;
          let savingsIn = 0;
          let billsOut = 0;
          let pocketOut = 0;
          let savingsOut = 0;
          let notes = [];

          if(isPayday){
            transferIn += billsPerPaycheck;
            savingsIn += savingsPerPaycheck;
            notes.push("Payday transfer");
          }

          const dayBills = occ.get(ms) || [];
          if(dayBills.length){
            for(const it of dayBills) billsOut += Number(it.amount);
            notes.push(dayBills.map(x=>x.name).join(", "));
          }

          const dayExtras = xocc.get(ms) || [];
          if(dayExtras.length){
            for(const it of dayExtras) pocketOut += Number(it.amount);
            // Pocket-only extras affect Pocket Leftover only; do not appear in Ledger.
          }

          const dayEvents = (eocc && eocc.get(ms)) ? (eocc.get(ms) || []) : [];
          if(dayEvents.length){
            for(const it of dayEvents){
              const amt = Number(it.amount || 0);
              savingsOut += amt;
            }
            // Events are Savings withdrawals only. They affect Savings Timeline / projections,
            // and do not reduce Pocket leftover or add event names to Ledger notes.
          }

          billsBal = round2(billsBal + transferIn - billsOut);
          savingsBal = round2(savingsBal + savingsIn - savingsOut);

          const billsBalDisplay = round2(billsBal - billsStartSurplus);
          if(billsBalDisplay < lowestBillsBal){
            lowestBillsBal = billsBalDisplay;
            lowestBillsBalDate = ms;
          }

          rows.push({
            ms,
            transferIn: round2(transferIn),
            billsOut: round2(billsOut),
            savingsIn: round2(savingsIn),
            savingsOut: round2(savingsOut),
            pocketOut: round2(pocketOut),
            billsBalance: billsBal,
            billsBalanceWorking: billsBalDisplay,
            savingsBalance: savingsBal,
            notes: notes.length ? notes.join(" • ") : "—",
            cardLeadNotes: [isPayday ? "Payday transfer" : ""].filter(Boolean),
            cardBillItems: dayBills.map(it => ({
              name: String(it?.name || "").trim(),
              amount: Number(it?.amount || 0)
            }))
          });
        }

                const spentByPayIndex = new Array(Math.max(0, sortedPaydays.length)).fill(0);
        if(sortedPaydays.length){
          for(const r of rows){
            if(r.pocketOut <= 0) continue;
            let pi = -1;
            for(let i=0;i<sortedPaydays.length;i++){
              if(sortedPaydays[i] <= r.ms) pi=i;
              else break;
            }
            if(pi>=0) spentByPayIndex[pi] = round2(spentByPayIndex[pi] + r.pocketOut);
          }

          // Extend the last pay period into the next month so "Pocket leftover" is truly
          // "until the next paycheck" (not clamped to month-end).
          if(nextPaydayAfterLast){
            const lastIdx = sortedPaydays.length - 1;
            const addStart = addDaysMs(monthEnd, 1);
            const addEnd = addDaysMs(nextPaydayAfterLast, -1);

            if(addStart <= addEnd){
              // IMPORTANT: Use the extra-cost rules from THIS month (the payday-month),
              // and expand them across the cross-month range so frequency stays correct.
              const baseExtras = allExtras;
              const occRange = billOccurrencesForRange(addStart, addEnd, baseExtras, settings || state.settings);
              for(const items of occRange.values()){
                for(const it of items){
                  spentByPayIndex[lastIdx] = round2(spentByPayIndex[lastIdx] + Number(it.amount || 0));
                }
              }
            }
          }
        }

        const endBills = billsBal;
        const endSavings = savingsBal;

        billsStart = endBills;
        savingsStart = endSavings;

        plans.set(mk, {
          mk,
          monthStart,
          monthEnd,
          AS2,
          TargetCarry,
          TB1,
          paydays,
          payCaps,
          minPayCap: cap,
          otherIncomeTotal,
          otherIncomePerPayday,
          otherIncomeAlloc,
          nextPaydayAfterLast,
          billsPerPaycheck,
          desiredBillsPerPaycheck,
          nominalBillsPerPaycheck,
          minBillsPerPaycheckForCushion,
          maxBillsPerPaycheck,
          extraFunding,
          savingsPerPaycheck,
          savingsGoal,
          topup,
        sweepOut,
        startAfterTopup,
        TB2_at_start: round2(startBills),
          rows,
          startBills: round2(startBills),
          startSavings: round2(startSavings),
          billsStartSurplus: round2(billsStartSurplus),

          endBills,
          endSavings,
          lowestBillsBal: round2(lowestBillsBal),
          lowestBillsBalDate,
          pocketSpentByPayIndex: spentByPayIndex
        });
      }

      return { plans };
    }

    /***********************
     * Pocket leftover
     ***********************/
        function capForPayIndex(plan, payIndex){
      const capFromPlan = (plan && Array.isArray(plan.payCaps)) ? Number(plan.payCaps[payIndex]) : NaN;
      const fallbackCap = Number(state.settings.pay.paycheckCap || 0) + (state.settings.pay2 ? Number(state.settings.pay2.paycheckCap || 0) : 0);
      const cap = (Number.isFinite(capFromPlan) && capFromPlan > 0) ? capFromPlan : fallbackCap;
      return cap;
    }
    function pocketHealth(plan){
      if(!plan || !Array.isArray(plan.paydays) || plan.paydays.length === 0) return null;
      const N = plan.paydays.length;
      let minBase = Infinity, maxBase = -Infinity;
      let minNet = Infinity, maxNet = -Infinity;
      let spentSum = 0, baseSum = 0;
      let capMin = Infinity, capMax = -Infinity;

      for(let i=0;i<N;i++){
        const cap = capForPayIndex(plan, i);
        if(Number.isFinite(cap)){
          capMin = Math.min(capMin, cap);
          capMax = Math.max(capMax, cap);
        }
        const base = pocketBasePerPaycheck(plan, i);
        const spent = Number(plan.pocketSpentByPayIndex?.[i] || 0);
        const net = round2(base - spent);

        minBase = Math.min(minBase, base);
        maxBase = Math.max(maxBase, base);
        minNet = Math.min(minNet, net);
        maxNet = Math.max(maxNet, net);

        baseSum += base;
        spentSum += spent;
      }

      const required = round2(Number(plan.savingsPerPaycheck||0) + Number(plan.billsPerPaycheck||0));

      return {
        N,
        capMin: Number.isFinite(capMin) ? round2(capMin) : 0,
        capMax: Number.isFinite(capMax) ? round2(capMax) : 0,
        savingsPerPaycheck: round2(Number(plan.savingsPerPaycheck||0)),
        billsPerPaycheck: round2(Number(plan.billsPerPaycheck||0)),
        required,
        minBase: round2(minBase),
        maxBase: round2(maxBase),
        minNet: round2(minNet),
        maxNet: round2(maxNet),
        spentSum: round2(spentSum),
        baseAvg: round2(baseSum / N)
      };
    }

    function pocketSurvivalMinimum(){
      return Math.max(0, round2(Number(state?.settings?.pocket?.minimumSurvival || 0)));
    }
    function pocketThresholdMode(){
      return state?.settings?.pocket?.thresholdMode === "base" ? "base" : "net";
    }
    function pocketThresholdLabel(modeOverride){
      return ((modeOverride || pocketThresholdMode()) === "base") ? "Pocket base" : "Projected free to spend";
    }
    function pocketMinimumInfo(plan, payIndex, netOverride, spentOverride){
      const minimum = pocketSurvivalMinimum();
      if(!(minimum > 0.009) || !plan || payIndex == null || payIndex < 0) return null;
      const mode = pocketThresholdMode();
      const base = round2(pocketBasePerPaycheck(plan, payIndex));
      const spentNum = Number(spentOverride);
      const spent = round2(Number.isFinite(spentNum) ? spentNum : Number(plan.pocketSpentByPayIndex?.[payIndex] || 0));
      const netNum = Number(netOverride);
      const net = round2(Number.isFinite(netNum) ? netNum : (base - spent));
      const metricValue = round2(mode === "base" ? base : net);
      if(metricValue >= (minimum - 0.009)) return null;
      const cap = round2(capForPayIndex(plan, payIndex));
      const billsPer = round2(Number(plan.billsPerPaycheck || 0));
      const savPer = round2(Number(plan.savingsPerPaycheck || 0));
      return {
        mode,
        metricLabel: pocketThresholdLabel(mode),
        metricValue,
        minimum,
        base,
        spent,
        net,
        shortBy: round2(minimum - metricValue),
        cap,
        billsPer,
        savPer,
        required: round2(billsPer + savPer)
      };
    }
    function pocketThresholdExplainHtml(info){
      if(!info) return "";
      const spentOverBase = Number(info.spent || 0) > (Number(info.base || 0) + 0.005);
      const overBy = spentOverBase ? round2(Number(info.spent || 0) - Number(info.base || 0)) : 0;
      const metricSentence = `<li>${escapeHtml(info.metricLabel)} <span class="warnNum">${fmtMoney(info.metricValue)}</span> is below your minimum free to spend of <span class="warnNum">${fmtMoney(info.minimum)}</span> by <span class="warnNumRed">${fmtMoney(info.shortBy)}</span>.</li>`;
      const spentLine = spentOverBase
        ? `<li>Spent amount of <span class="warnNumRed">${fmtMoney(info.spent)}</span> exceeds your pocket base of <span class="warnNum">${fmtMoney(info.base)}</span> by <span class="warnNumRed">${fmtMoney(overBy)}</span>.</li>`
        : "";
      return `
      <div class="warnBanner" style="margin:0 0 10px 0;">
        <strong>Why this is red:</strong>
        <ul>
          ${metricSentence}
          ${spentLine}
        </ul>
      </div>
    `;
    }

function pocketBasePerPaycheck(plan, payIndex){
      const cap = capForPayIndex(plan, payIndex);
      return round2(cap - plan.billsPerPaycheck - plan.savingsPerPaycheck);
    }
    function pocketForPayIndex(plan, payIndex){
      // Pocket left is per-paycheck disposable money:
      // paycheck cap (+ any allocated additional income) minus required transfers.
      // IMPORTANT: Do NOT include hidden month-start Bills normalization (topup/sweepOut),
      // otherwise the first pay period can look artificially inflated/deflated.
      return pocketBasePerPaycheck(plan, payIndex);
    }
    function pocketNetForPayIndex(plan, payIndex){
      const base = pocketForPayIndex(plan, payIndex);
      const spent = Number(plan.pocketSpentByPayIndex?.[payIndex] || 0);
      return round2(base - spent);
    }
