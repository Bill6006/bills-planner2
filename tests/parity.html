function frame(id){

  });
}
const num = t => {
  if(t == null) return null;
  const s = String(t).replace(/−/g, "-").replace(/[^0-9.\-]/g, "");
  if(!s || s === "-" || s === ".") return null;
  return Math.round(Number(s) * 100) / 100;
};

const r2 = n => (n == null || !Number.isFinite(Number(n))) ? n : Math.round((Number(n) + Number.EPSILON) * 100) / 100;

function diffInto(diffs, path, a, b){
  if(a === b) return;
  if(typeof a === "number" && typeof b === "number" && Math.abs(a - b) < 0.0051) return;
  if(Array.isArray(a) && Array.isArray(b)){
    if(a.length !== b.length){ diffs.push(`${path}.length old=${a.length} new=${b.length}`); }
    for(let i = 0; i < Math.min(a.length, b.length); i++) diffInto(diffs, `${path}[${i}]`, a[i], b[i]);
    return;
  }
  if(a && b && typeof a === "object" && typeof b === "object"){
    for(const k of new Set([...Object.keys(a), ...Object.keys(b)])) diffInto(diffs, `${path}.${k}`, a[k], b[k]);
    return;
  }
  diffs.push(`${path} old=${JSON.stringify(a)} new=${JSON.stringify(b)}`);
}

function serializePlans(E, plans, iso){

      pocketSpentByPayIndex: p.pocketSpentByPayIndex, otherIncomeTotal: p.otherIncomeTotal, otherIncomePerPayday: p.otherIncomePerPayday,
      nextPaydayAfterLast: p.nextPaydayAfterLast == null ? null : iso(p.nextPaydayAfterLast),

    };
  }
  return out;
}

      c.querySelectorAll(".spendCatMetaRow").forEach(r => { vals[txt(r.querySelector(".muted"))] = num(txt(r.querySelector("strong"))); });
      return { name, count: num(txt(c.querySelector(".spendCatMetaLite"))), budget: vals.Budgeted, spent: vals.Spent, remaining: vals.Remaining, moved: vals.Moved ?? null };
    }) : [];
    const graph = d => ({
      cols: [...d.querySelectorAll(".graphCol[data-graph-id]")].map(c => ({ id: c.dataset.graphId, label: c.dataset.graphLabel.split(" • ")[0], cls: c.querySelector(".graphColBar").className.replace("graphColBar", "").trim() })),
      chips: [...d.querySelectorAll(".graphStats .chip")].map(c => txt(c))
    });
    out.graphMonth = graph(doc);
    out.history = [...doc.querySelectorAll("details.spendHistPeriod")].map(d => [d.dataset.openKey, txt(d.querySelector(".spendHistMeta"))]);
    out.debtStats = [...doc.querySelectorAll(".debtStat .v")].map(v => txt(v));
    out.debtRoute = [...doc.querySelectorAll(".debtRouteItem")].map(r => [txt(r.querySelector(".debtRouteName")), txt(r.querySelector(".debtRouteMeta")), txt(r.querySelector(".debtRouteBalance")), txt(r.querySelector(".debtRouteTime"))]);
    const hint = doc.querySelector(".debtMiniHint strong");
    out.debtInterest = hint ? num(txt(hint)) : null;
    doc = oldRender(W, { extraSpendSummaryMode: "month" });
    out.chipsMonth = [...doc.querySelectorAll(".spendSummaryWrap .spendMonthChips .chip")].map(c => num(txt(c)));
    doc = oldRender(W, { extraSpendGraphRange: "last7" });
    out.graphLast7 = graph(doc);
    const firstId = out.graphMonth.cols[0]?.id;
    if(firstId){
      doc = oldRender(W, { extraSpendGraphRange: "custom", extraSpendGraphCustomSource: "month", extraSpendGraphHiddenIds: [firstId] });
      out.graphCustom = graph(doc);
    }
  }

  // Savings tab (the timeline only compares when viewing the starting month; v5 replaces v4's projected mode)
  {
    const doc = oldRender(W, { activeTab: "savings" });
    out.savPer = num(doc.querySelector("#savPer")?.value);
    out.savAdds = [...doc.querySelectorAll(".paydaySavAddsTable tbody tr")].filter(tr => tr.querySelectorAll("td").length === 3).map(tr => {
      const td = tr.querySelectorAll("td");
      return [txt(td[0]).slice(0,10), num(txt(td[1])), num(txt(td[2]))];
    });
    if(view === base){
      out.timeline = [...doc.querySelectorAll(".savingsTimelineTable tbody tr")].map(tr => {
        const td = tr.querySelectorAll("td");
        return [txt(td[0]), num(txt(td[1])), num(txt(td[2].querySelector(".num")))];
      });
    }
  }
  // Events tab
  {
    const doc = oldRender(W, { activeTab: "events" });
    out.eventsTotal = num(doc.querySelector("#evTotalAll")?.value);
  }
  return out;
}

/* ---------------- new engine ---------------- */
function neoOutputs(N, ds, view){
  const E = N.BP.E;
  const S = N.BP.test.load(JSON.parse(JSON.stringify(ds.data)));
  S.selectedMonth = view;
  E.resetCache();
  const base = String(S.settings.baseMonth || view).trim();
  const horizon = Math.max(12, Number(S.settings?.savings?.timelineMonths || 6) + 2);
  const bi = E.monthIndex(base), vi = E.monthIndex(view);
  const rs = bi <= vi ? base : view, re = bi <= vi ? view : base;
  const out = { range: [rs, re, horizon] };
  const ctx = E.buildPlanRange(S, rs, E.addMonthsKey(re, horizon));
  out.plans = serializePlans(E, ctx.plans, E.isoDate);
  const plan = ctx.plans.get(view) || E.placeholderPlan(S, view);

  const st = E.monthStats(S, plan);
  out.stats = Object.fromEntries(E.STAT_KEYS.map(k => [k, r2(st[k])]));
  out.ledger = E.ledgerDays(S, ctx, view, S.ui.daysBeforeAfter, false).map(d => {
    const r = d.row;
    return [E.isoDate(d.ms), r2(r.billsBalanceWorking ?? r.billsBalance), r.transferIn > 0 ? r2(r.transferIn) : null, r.billsOut > 0 ? r2(-r.billsOut) : null, r2(r.savingsBalance), r.savingsIn > 0 ? r2(r.savingsIn) : null, r.notes];
  });
  for(const shift of [true, false]){
    const w = E.pocketWindow(S, view, shift);
    out["pocket_" + shift] = w.periods.map(p => ({ mk: p.mk, start: E.isoDate(p.start), end: E.isoDate(p.end), free: p.freeAfterBudgets, base: p.base, spent: p.loggedSpent, names: p.names, low: !!p.threshold }));
    out["pocketWarn_" + shift] = !!w.warn;
  }

  out.paydays = plan.paydays.map((p, i) => [E.isoDate(p), r2(plan.payCaps?.[i] ?? 0), r2(plan.savingsPerPaycheck), r2(plan.billsPerPaycheck), r2(E.pocketBasePerPaycheck(S, plan, i))]);
  const h = E.pocketHealth(S, plan);
  out.payHealth = !!(h && ((Math.abs(h.maxBase) < 0.01 && h.required >= (h.capMin - 0.01)) || h.minNet < 0));
  out.otherIncome = S.settings.otherIncomes.length
    ? `This month: +${E.fmtMoney(plan.otherIncomeTotal || 0)} total (≈ +${E.fmtMoney(plan.otherIncomePerPayday || 0)} per payday)`
    : null;

  let extrasTotal = 0;
  for(const arr of E.billOccurrencesForMonth(view, S.extras, S.settings).values()) for(const it of arr) extrasTotal += Number(it.amount || 0);
  out.extrasTotal = r2(extrasTotal);
  const active = E.spendActivePeriod(S, view, "");
  const fmtD = iso => { const [y,m,d] = iso.split("-"); return `${m}/${d}/${y}`; };
  out.activePeriod = active.startIso ? `${fmtD(active.startIso)} – ${fmtD(active.endIso)}` : null;
  out.chipsPay = [active.snapshot.totals.budget, active.snapshot.totals.spent, active.snapshot.totals.remaining].map(r2);
  out.cats = active.snapshot.items.map(it => ({
    name: it.name,
    count: E.allSpendEntries(S).filter(e => { const ms = E.parseISOToMs(e.date); return ms >= active.startMs && ms <= active.endMs && String(e.extraId) === String(it.id); }).length,
    budget: r2(it.budget), spent: r2(it.spent), remaining: r2(it.remaining), moved: it.transferNet ? r2(it.transferNet) : null
  }));
  const graph = meta => {
    const dense = meta.rows.length >= 5;
    return {
      cols: meta.rows.map(r => {
        const budget = Math.max(0, Number(r.budget || 0));
        const warnAt = budget > 0 ? E.round2(budget * 0.9) : Infinity;
        const over = budget > 0 && r.spent > budget;
        const near = budget > 0 && r.spent >= warnAt && r.spent <= budget;
        return { id: r.id, label: `${E.fmtMD(r.startMs)} to ${E.fmtMD(r.endMs)}`, cls: over ? "over" : near ? "warn" : (r.isCurrentPeriod ? "current" : "complete") };
      }),
      chips: [`Average ${meta.completedCount > 0 && meta.averageSpent > 0 ? E.fmtMoney(meta.averageSpent) : "—"}`, `Total ${E.fmtMoney(meta.totalSpent)}`, `Pay periods ${meta.count}`]
    };
  };
  const gm = E.graphData(S, view, "month");
  out.graphMonth = graph(gm);
  out.history = [];
  for(const y of E.spendHistoryTree(S)) for(const m of y.months) for(const p of m.periods) out.history.push([`esh:p:${p.key}`, `${p.count} ${p.count === 1 ? "log" : "logs"} ${E.fmtMoney(p.total)}`]);
  const sum = E.debtSummary(S);
  out.debtStats = S.debts.length || true ? [E.fmtMoney(sum.totalBalance), E.fmtMoney(sum.paidSoFar), E.fmtMoney(sum.monthlyTotal), E.debtMonthsLabel(sum.longestMonths)] : [];
  const strategy = S.ui.debtStrategy;
  const ordered = E.debtOrderedList(S, strategy);
  const stratLabel = strategy === "snowball" ? "Snowball" : (strategy === "custom" ? "Custom" : "Avalanche");
  out.debtRoute = ordered.slice(0, 8).map(d => {
    const c = E.debtPayoffCalc(d);
    return [d.name || "Debt", `${ordered.length > 1 ? `${stratLabel} • ` : ""}APR ${Number(d.apr || 0).toFixed(2)}% • ${E.fmtMoney(c.payment)}/mo • due ${Number(d.dueDay || 1)}`, `${E.fmtMoney(Number(d.balance || 0))} left`, E.debtMonthsLabel(c.months)];
  });
  out.debtInterest = r2(sum.interest);
  const ms = E.spendMonthSummary(S, view);
  out.chipsMonth = [ms.totals.budget, ms.totals.spent, ms.totals.remaining].map(r2);
  out.graphLast7 = graph(E.graphData(S, view, "last7"));
  const firstId = gm.rows[0]?.id;
  if(firstId) out.graphCustom = graph(E.graphData(S, view, "custom", "month", [firstId]));

  out.savPer = r2(plan.savingsPerPaycheck);
  out.savAdds = E.paydaySavingsAdds(plan).map(a => [E.isoDate(a.ms), a.add > 0 ? r2(a.add) : null, r2(a.balance)]);
  if(view === base){
    const months = E.clampInt(S.settings.savings.timelineMonths || 6, 1, 36);
    out.timeline = E.savingsTimeline(S, ctx, months).map(r => {
      const { y, m } = E.parseMonthKey(r.mk);
      return [`${y}-${E.monthAbbr(m)}`, r2(r.start), r2(r.end)];
    });
  }
  out.eventsTotal = r2(E.allEventsList(S).reduce((s, x) => {
    const iso = E.normalizeISODateLoose(x?.rule?.anchor || x?.date || x?.iso || "");
    return (iso && iso.slice(0,7) === view) ? s + Number(x.amount || 0) : s;
  }, 0));
  return out;
}

/* ---------------- run ---------------- */
// Old-app debt rows show "$X left" but debtStats compare as text; numbers compare numerically.
async function runParity(which, opts = {}){
  const W = await frame("old");
  const N = await frame("neo");
  N.BP.E.opts.debtPayoffCutoff = opts.cutoff === true;
  const report = [];
  const list = which == null ? DATASETS : DATASETS.filter((d, i) => i === which || d.name.startsWith(which));
  for(const ds of list){
    for(const view of ds.views){
      let a, b, err = null;
      try{ a = oldOutputs(W, ds, view); }catch(e){ err = "old: " + e.message; }
      try{ b = neoOutputs(N, ds, view); }catch(e){ err = (err ? err + " | " : "") + "new: " + e.message + "\n" + e.stack; }
      const diffs = [];
      if(!err) diffInto(diffs, "", a, b);
      report.push({ dataset: ds.name, view, err, diffCount: diffs.length, diffs: diffs.slice(0, 25) });
    }
  }
  return report;
}
window.runParity = runParity;
window.DATASETS = DATASETS;
window.oldOutputs = oldOutputs;
window.neoOutputs = neoOutputs;
$out.textContent = "Ready. Call runParity().";
</script>
